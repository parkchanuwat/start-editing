<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เริ่มตัดต่อ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+KR:wght@500&family=Noto+Sans+SC:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning: calm bilingual help pages a beginner can follow with the app open
   IDEA the editing suite: each page has a neutral app-grey stage where the concept actually works
   PICTURE one live demo per page (2D colour pad, frame shapes, insert/overwrite, keyframes, template, markers, mask, resolution ladder)
   COLOUR white / near-black page, neutral #1d1d1f stage in both themes, vermilion accent
   TYPE Anuphan for headings, IBM Plex Sans Thai for text (covers Latin too), Plex Mono for keys and values
   LAYOUT laptop: site menu | article | on-this-page; phone: title, stage, steps in one column */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#111112);--ink:light-dark(#151515,#f1f1f2);--mute:light-dark(#57575c,#a9a9b0);--line:light-dark(#e4e4e7,#2c2c30);--soft:light-dark(#f5f5f6,#1a1a1c);--acc:light-dark(#c4390b,#ff7a45);--accbg:light-dark(#fff1eb,#2a1810);--stage:#1d1d1f;--st2:#2c2c30;--st3:#3a3a3f;--stink:#ededef;--stmute:#a6a6ad;--hot:#ff7a45}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.75 "IBM Plex Sans Thai","Noto Sans Thai",Loma,system-ui,sans-serif;overflow-x:clip}
:lang(en) body,html:lang(en) body{line-height:1.65}
a{color:var(--acc);text-underline-offset:3px}
img{max-width:100%}
.nw{white-space:nowrap}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:10px max(16px,3vw);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font:600 18px/1.3 Anuphan,"IBM Plex Sans Thai",sans-serif;white-space:nowrap}
.brand small{font:500 13px/1 "IBM Plex Sans Thai",sans-serif;color:var(--mute);padding:4px 8px;border:1px solid var(--line);border-radius:99px}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.search input{font:16px/1.2 inherit;height:40px;width:min(260px,40vw);padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.lang a{display:flex;align-items:center;justify-content:center;min-width:44px;height:40px;padding:0 10px;font-size:14px;font-weight:600;color:var(--mute);text-decoration:none}
.lang a[aria-current]{background:var(--ink);color:var(--bg)}
.vh{position:absolute;left:-9999px}
input:focus-visible,button:focus-visible,[tabindex]:focus-visible,summary:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr) 190px;gap:44px;padding:0 max(16px,3vw)}
.navd{position:sticky;top:61px;align-self:start;max-height:calc(100vh - 61px);overflow:auto}
.navd summary{display:none}
.side{padding:24px 4px 40px 0;font-size:15px;line-height:1.5}
.grp{margin:20px 0 6px;font:600 14px/1.4 Anuphan,sans-serif;color:var(--mute)}
.grp:first-child{margin-top:0}
.side ul{list-style:none;margin:0;padding:0}
.side li>*{display:block;padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none}
.side li>span{color:var(--mute)}
.side a:hover{background:var(--soft)}
.side a[aria-current]{background:var(--accbg);color:var(--acc);font-weight:600}
.side .hint{font-size:13px;color:var(--mute);margin:18px 10px 0}
article{max-width:790px;padding:28px 0 64px}
.crumb{font-size:14px;color:var(--mute);margin:0}
h1{font:700 clamp(30px,4.4vw,44px)/1.25 Anuphan,"IBM Plex Sans Thai",sans-serif;letter-spacing:-.01em;margin:6px 0 10px;text-wrap:balance}
h2{font:600 26px/1.35 Anuphan,"IBM Plex Sans Thai",sans-serif;margin:52px 0 12px;text-wrap:balance}
h3{font:600 17px/1.5 Anuphan,"IBM Plex Sans Thai",sans-serif;margin:0 0 4px}
article>h3{margin-top:26px}
.lead{font-size:17px;margin:0 0 14px;max-width:66ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;padding:0;list-style:none}
.meta li{font-size:14px;line-height:1.4;padding:5px 11px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.meta .ver{border-color:var(--acc);color:var(--acc);font-weight:600}
.call{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:14px 16px;border-radius:12px;background:var(--accbg);margin:0 0 20px}
.call svg{margin-top:4px}
.call p{margin:0}
.onpage{display:none;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 0 18px;font-size:14px}
.onpage a{flex:none;padding:6px 12px;border:1px solid var(--line);border-radius:99px;color:var(--ink);text-decoration:none;white-space:nowrap}
.cap{font-size:13px;color:var(--mute);margin:8px 2px 0}
p{margin:0 0 12px}
.check{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.check li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px}
.check li::before{content:"";width:18px;height:18px;margin-top:5px;border:2px solid var(--mute);border-radius:5px}
.steps{list-style:none;counter-reset:s;padding:0;margin:0;display:grid;gap:26px}
.steps>li{counter-increment:s;display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 14px}
.steps>li::before{content:counter(s);grid-row:1/span 9;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);font:600 16px/34px Anuphan,sans-serif;text-align:center}
.steps p,.steps ul,.steps ol{margin:0 0 6px}
.steps ul,.steps ol{padding-left:1.3em}
.note{font-size:15px;color:var(--mute)}
.ui{font-weight:600;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--soft);-webkit-box-decoration-break:clone;box-decoration-break:clone}
kbd{font:500 14px/1 "IBM Plex Mono",monospace;padding:3px 7px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--soft);white-space:nowrap}
.tbl{overflow-x:auto;margin:8px 0 18px}
table{width:100%;border-collapse:collapse;font-size:15px;line-height:1.55}
th{text-align:left;font-weight:600;color:var(--mute);font-size:14px;border-bottom:1px solid var(--ink);padding:8px 10px 8px 0}
td{border-bottom:1px solid var(--line);padding:10px 10px 10px 0;vertical-align:top}
td:first-child{font-weight:600}
td.n{white-space:nowrap;font-variant-numeric:tabular-nums}
.order{margin:0;padding-left:1.4em;display:grid;gap:4px}
.mist{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.mist li{padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.mist b{display:block;font-family:Anuphan,"IBM Plex Sans Thai",sans-serif;font-weight:600}
details.old{border:1px solid var(--line);border-radius:12px;padding:0 16px}
details.old summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:600}
details.old ul{margin:0 0 14px;padding-left:1.2em}
.src{padding-left:1.2em;margin:0}
.src li{margin-bottom:4px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:48px}
.pn>*{padding:14px 16px;border:1px solid var(--line);border-radius:12px;font-size:15px;color:var(--mute);text-decoration:none}
.pn>a:hover{border-color:var(--acc)}
.pn>:last-child{text-align:right}
.pn b{display:block;color:var(--ink);font-size:16.5px}
footer{border-top:1px solid var(--line);margin-top:28px;padding-top:16px;font-size:14px;color:var(--mute)}
footer p{margin:0 0 6px}
.toc{position:sticky;top:61px;align-self:start;padding:30px 0;font-size:14px;line-height:1.5}
.toc p{font-weight:600;margin:0 0 8px}
.toc a{display:block;padding:4px 0;color:var(--mute);text-decoration:none}
.toc a:hover{color:var(--acc)}

/* stage: the shared dark demo surface */
.stage{background:var(--stage);color:var(--stink);border-radius:16px;padding:16px;display:grid;gap:14px 16px;font-size:15px;line-height:1.5}
.stage h3{font-size:15px;color:var(--stink);margin:0}
.stage p{margin:0}
.mon{position:relative;background:#000;border-radius:6px;overflow:hidden}
.mon>svg{display:block;width:100%;height:auto}
.mlabel{font-size:13px;color:var(--stmute);margin:0 0 6px}
.tag{position:absolute;top:8px;font-size:13px;line-height:1;padding:5px 8px;border-radius:6px;background:rgba(0,0,0,.62);color:#fff}
.tag.b{left:8px}.tag.a{right:8px}
.btn,.chip,.seg button{font:500 14px/1.25 "IBM Plex Sans Thai",sans-serif;min-height:44px;border-radius:8px;border:0;cursor:pointer;padding:4px 12px}
.btn{background:var(--st2);color:var(--stink)}
.btn.pri{background:#f1f1f2;color:#111}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--st2);color:var(--stink);min-height:40px}
.chip[aria-pressed=true]{background:#f1f1f2;color:#111}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--st2);padding:4px;border-radius:10px}
.seg button{background:transparent;color:var(--stink);padding:4px 6px}
.seg button[aria-pressed=true]{background:#f1f1f2;color:#111}
.st{margin:0;font-size:14px;line-height:1.5;color:var(--stink);background:var(--st2);padding:10px 12px;border-radius:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;min-height:40px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--hot);margin:0;flex:none}
.rng{display:grid;gap:2px;font-size:14px}
.rng span{display:flex;justify-content:space-between;gap:8px;color:var(--stmute)}
.rng code,.stage code{font:500 14px/1.4 "IBM Plex Mono",monospace;color:var(--stink);white-space:nowrap}
.stage input[type=range]{width:100%;height:30px;accent-color:var(--hot);margin:0}
.stage input[type=text]{font:16px/1.2 "IBM Plex Sans Thai",sans-serif;width:100%;height:42px;padding:0 10px;border-radius:8px;border:1px solid var(--st3);background:#151517;color:var(--stink)}
.stage label.f{display:grid;gap:4px;font-size:14px;color:var(--stmute)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:14px}
.kv dt{color:var(--stmute)}
.kv dd{margin:0;color:var(--stink);font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px 16px}
.kv.stk{grid-template-columns:minmax(0,1fr);gap:0;align-content:start}
.kv.stk dt{font-size:13px;margin-top:10px}
.kv.stk dt:first-child{margin-top:0}
.kv.stk dd{font-size:15px}
.kv.stk dd small{display:block;font-weight:500;color:var(--stmute);font-size:13px}
.col{display:flex;flex-direction:column;gap:10px}

/* colour mode demo */
.cm{grid-template-columns:minmax(0,1fr) 210px;grid-template-areas:"h h" "m c" "s c" "t c";grid-template-rows:auto auto auto 1fr}
.cm>h3{grid-area:h}.cm .mon{grid-area:m}.cm .ctrl{grid-area:c}.cm .strip{grid-area:s}.cm .st{grid-area:t;align-self:start}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.clip{font:inherit;text-align:left;background:none;color:var(--stink);border:0;padding:0;cursor:pointer}
.clip svg{display:block;width:100%;aspect-ratio:16/9;border-radius:5px;outline:2px solid transparent;outline-offset:2px}
.clip[aria-pressed=true] svg{outline-color:#fff}
.clip span{display:block;font-size:13px;line-height:1.35;margin-top:7px;color:var(--stmute)}
.clip[aria-pressed=true] span{color:#fff}
.ctrl{display:flex;flex-direction:column;gap:10px}
.pad{position:relative;width:100%;aspect-ratio:1;max-width:190px;border-radius:10px;touch-action:none;cursor:crosshair;background:linear-gradient(to right,rgba(0,0,0,.45),transparent 50%,rgba(255,255,255,.16)),linear-gradient(to top,#0d0d0d,#666 50%,#ececec)}
.pad[data-mode=TN]{background:linear-gradient(to right,rgba(60,175,85,.6),transparent 42%,transparent 58%,rgba(205,60,175,.6)),linear-gradient(to top,#3667c4,#6a6a6a 50%,#e8862c)}
.pad::before,.pad::after{content:"";position:absolute;background:rgba(255,255,255,.35)}
.pad::before{left:50%;top:0;bottom:0;width:1px}
.pad::after{top:50%;left:0;right:0;height:1px}
.puck{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.55);pointer-events:none;z-index:1}
.read{font-size:13px;line-height:1.45;color:var(--stmute)}
.read .row{display:flex;justify-content:space-between;gap:8px;color:var(--stink);font-size:14px;margin-top:6px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* sequence demo */
.seqbox{background:#0b0b0c;border-radius:8px;display:flex;align-items:center;justify-content:center;height:300px;padding:14px}
.seqbox svg{display:block;width:100%;height:100%}

/* monitors demo */
.mons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scr{aspect-ratio:16/9;border-radius:6px;display:flex;align-items:center;justify-content:center;font:700 clamp(28px,6vw,54px)/1 Anuphan,sans-serif;color:rgba(255,255,255,.92);position:relative;transition:background-color .15s}
.scr small{position:absolute;left:8px;bottom:6px;font:500 13px/1.2 "IBM Plex Sans Thai",sans-serif;color:#fff}
.tl{position:relative;height:86px;background:#151517;border-radius:8px;padding:28px 8px 8px;cursor:pointer;touch-action:none}
.tl .ruler{position:absolute;left:8px;right:8px;top:6px;height:16px;font:500 11px/16px "IBM Plex Mono",monospace;color:var(--stmute)}
.tl .ruler i{position:absolute;top:0;font-style:normal;transform:translateX(-50%)}
.trk{position:relative;height:48px}
.seg2{position:absolute;top:0;bottom:0;border-radius:5px;display:flex;align-items:center;padding-left:8px;font-weight:700;color:#fff;border:1px solid rgba(0,0,0,.4);overflow:hidden;white-space:nowrap;font-size:14px}
.ph{position:absolute;top:22px;bottom:4px;width:2px;background:var(--hot);margin-left:-1px;pointer-events:none}
.ph::before{content:"";position:absolute;top:-6px;left:-6px;border:7px solid transparent;border-top-color:var(--hot)}
.srcbar{position:relative;height:12px;border-radius:6px;background:#3a3a3f;margin:2px 0 6px}
.rngs{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.two>.mon{align-self:start}
.srcbar b{position:absolute;top:0;bottom:0;background:#8fd16a;border-radius:6px}

/* keyframe demo */
.kfmon{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#000}
.kfmon svg{position:absolute;inset:0;width:100%;height:100%}
.ttl{position:absolute;top:58%;padding:8px 14px;border-radius:6px;background:rgba(15,15,17,.82);color:#fff;font:700 clamp(15px,3vw,24px)/1.2 Anuphan,"IBM Plex Sans Thai",sans-serif;white-space:nowrap;will-change:transform,opacity}
.kftl{background:#151517;border-radius:8px;padding:10px 10px 6px;display:grid;grid-template-columns:86px minmax(0,1fr);gap:6px 10px;align-items:center;font-size:13px;color:var(--stmute)}
.lane{position:relative;height:22px;border-bottom:1px solid #2e2e33}
.lane i{position:absolute;top:4px;width:12px;height:12px;margin-left:-6px;background:#f1f1f2;transform:rotate(45deg);border-radius:2px}
.lane .p{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--hot)}
.graph{background:#151517;border-radius:8px;padding:6px}
.graph svg{display:block;width:100%;height:110px}

/* mogrt demo */
.lt{position:absolute;left:5%;bottom:12%;display:grid;gap:2px;transform-origin:left center}
.lt .bar{display:block;padding:6px 14px 6px 12px;background:#ffffff;color:#111;font:700 clamp(14px,2.6vw,22px)/1.2 Anuphan,"IBM Plex Sans Thai",sans-serif;border-left:6px solid var(--ltc,#ff5a1f);white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
.lt .sub{display:inline-block;justify-self:start;padding:3px 12px;background:var(--ltc,#ff5a1f);color:#fff;font:500 clamp(12px,2vw,16px)/1.3 "IBM Plex Sans Thai",sans-serif;white-space:nowrap}
.lt.noacc .bar{border-left-width:0}
.lt.in{animation:ltin .6s cubic-bezier(.2,.8,.2,1)}
@keyframes ltin{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.sw{display:flex;gap:8px}
.sw button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw button[aria-pressed=true]{border-color:#fff}
.lock{font-size:13px;color:var(--stmute);border-top:1px solid var(--st3);padding-top:8px}

/* markers demo */
.mk{position:relative;height:92px;background:#151517;border-radius:8px;cursor:pointer;touch-action:none}
.mk .ruler{position:absolute;left:12px;right:12px;top:6px;height:16px;font:500 11px/16px "IBM Plex Mono",monospace;color:var(--stmute)}
.mk .ruler i{position:absolute;font-style:normal;transform:translateX(-50%)}
.mk .lanebox{position:absolute;left:12px;right:12px;top:26px;bottom:12px;background:repeating-linear-gradient(90deg,#2a2a2f 0 2px,transparent 2px 25%)}
.mk .clipbar{position:absolute;left:0;right:0;bottom:0;height:26px;border-radius:5px;background:#3b5f8a}
.mk .m{position:absolute;top:0;width:14px;height:18px;margin-left:-7px;clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%);cursor:pointer}
.mk .mr{position:absolute;top:4px;height:6px;border-radius:3px;opacity:.6}
.mk .ph{top:22px;bottom:6px}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:220px;overflow:auto}
.mlist li{display:grid;grid-template-columns:12px auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--st2);border-radius:8px;padding:4px 4px 4px 10px;font-size:14px}
.mlist li.cur{outline:2px solid #fff}
.mlist .dot{width:12px;height:12px;border-radius:3px}
.mlist button{font:inherit;color:var(--stink);background:none;border:0;cursor:pointer;min-height:36px;text-align:left;padding:0 6px}
.mlist .x{color:var(--stmute);min-width:36px;text-align:center}
.yt{font:500 13px/1.5 "IBM Plex Mono",monospace;white-space:pre-wrap;background:#151517;border-radius:8px;padding:10px;margin:0;color:var(--stink);min-height:44px}

/* object mask demo */
.om svg{cursor:pointer}
.om .hl{opacity:.75;animation:omp 1.6s ease-in-out infinite}.om .hl.on{opacity:1;animation:none;stroke-dasharray:none}
@keyframes omp{50%{opacity:.25}}
.chip:disabled{opacity:.45;cursor:default}
.stage input:disabled{opacity:.45;cursor:default}
.chk:has(input:disabled){color:var(--stmute)}

/* resolution demo */
.resfig{background:#0b0b0c;border-radius:8px;padding:12px;display:flex;align-items:center;min-height:200px}
.resfig svg{display:block;width:100%;height:auto;max-height:340px}
.reslist{display:flex;flex-wrap:wrap;gap:6px}
.reslist button{flex:1 1 130px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;font:500 14px/1.3 "IBM Plex Sans Thai",sans-serif;min-height:44px;padding:4px 12px;border-radius:8px;border:0;background:var(--st2);color:var(--stink);cursor:pointer}
.reslist button code{font-size:13px;color:var(--stmute)}
.reslist button[aria-pressed=true]{background:#f1f1f2;color:#111}
.reslist button[aria-pressed=true] code{color:#444}

/* first-video demo */
.route{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;counter-reset:r}
.stop{width:100%;min-height:64px;display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:10px;border:2px solid transparent;background:var(--st2);color:var(--stink);font:500 14px/1.3 "IBM Plex Sans Thai",sans-serif;cursor:pointer}
.stop b{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#151517;font:600 14px/1 Anuphan,sans-serif}
.stop.ok b{background:var(--hot);color:#111}
.stop[aria-pressed=true]{border-color:#fff}
.card{background:#151517;border-radius:10px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.card h4{margin:0;font:600 17px/1.4 Anuphan,"IBM Plex Sans Thai",sans-serif}

<h1>ทำคลิปแรกตั้งแต่ต้นจนจบ</h1>
<p class="lead">หน้านี้พาทำวิดีโอสั้นหนึ่งชิ้นใน Premiere ตั้งแต่เตรียมไฟล์จนได้ไฟล์ MP4 ทำตามลำดับทีละขั้น แต่ละขั้นมีลิงก์ไปหน้าที่อธิบายละเอียด ทำจบหนึ่งรอบแล้วจะเห็นภาพรวมของทั้งโปรแกรม</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>

<p><b>ใช้ Premiere ภาษาเกาหลีหรือจีนตัวย่ออยู่?</b> เว็บนี้ใช้ชื่อเมนูภาษาอังกฤษ ถ้าจะเปลี่ยนภาษาของโปรแกรม ไปที่ Creative Cloud desktop › Preferences แล้วเลือก Default install language (อยู่ในหัวข้อ Apps หรือ Language แล้วแต่<span class="nw">เวอร์ชัน</span>) จากนั้นถอนการติดตั้ง Premiere แล้วติดตั้งใหม่ ภาษาจึงจะเปลี่ยน</p></div>

<h2 id="steps">8 ขั้นตอน</h2>
<ol class="steps">
<li><h3>เตรียมโฟลเดอร์และ import</h3><p>สร้างโฟลเดอร์งาน เช่น <code>MyVlog</code> ข้างในมี <code>Footage</code> และ <code>Music</code> สร้าง<span class="nw">โปรเจกต์</span>ใหม่ไว้ในโฟลเดอร์นี้ แล้วลากไฟล์เข้า Project panel ห้ามย้ายหรือเปลี่ยนชื่อไฟล์หลัง import</p><p class="note"><a href="#th-project-media">จัดการไฟล์และ<span class="nw">โปรเจกต์</span> →</a></p></li>
<li><h3>สร้าง sequence</h3><p>ลากคลิปหลักไปที่ไอคอน <span class="ui">New Item</span> ถ้าจะทำแนวตั้ง สร้าง sequence 1080×1920 เอง</p><p class="note"><a href="#th-sequence">Sequence และ Sequence Settings →</a></p></li>
<li><h3>คัดฟุตเทจ</h3><p>ดับเบิลคลิกคลิปเพื่อเปิดใน Source Monitor กด <kbd>I</kbd> และ <kbd>O</kbd> เลือกช่วงที่ดีที่สุด แล้วกด <kbd>,</kbd> เพื่อ Insert ลง timeline ทำทีละคลิปตามลำดับเรื่อง</p><p class="note"><a href="#th-monitors">Source Monitor กับ Program Monitor →</a></p></li>
<li><h3>ตัดต่อบน timeline</h3><p>วางเพลงลง track เสียง ปักหมุดจังหวะด้วย <kbd>M</kbd> ตัดคลิปให้ลงจังหวะด้วย Razor แล้วปิดช่องว่างด้วย Ripple Delete เล่นดูทั้งเรื่องบ่อย ๆ</p><p class="note"><a href="#th-timeline">ตัดต่อบน Timeline →</a> · <a href="#th-markers">Marker →</a></p></li>
<li><h3>ใส่ title และกราฟิก</h3><p>เปิด <span class="ui">Window › Graphics Templates</span> ลาก template ชื่อเรื่องไปไว้ track V2 แล้วแก้ข้อความใน Properties panel</p><p class="note"><a href="#th-mogrt">MOGRT →</a> · <a href="#th-effects-keyframes">Effects และ Keyframe →</a></p></li>
<li><h3>แต่งสี</h3><p>คลิกแท็บ <span class="ui">Color</span> กด Auto Color ทีละคลิป แล้วปรับ Contrast, Exposure และ Temperature ให้ทุกคลิปดูไปทางเดียวกัน</p><p class="note"><a href="#th-color-mode">แต่งสีด้วย Color Mode →</a></p></li>
<li><h3>ใส่ซับ</h3><p>ถ้ามีเสียงพูด ใช้ Speech to Text ถอดเสียง สร้าง captions แล้วตรวจคำผิดและความยาวบรรทัด</p><p class="note"><a href="#th-captions">ซับไตเติลภาษาเกาหลีและจีนตัวย่อ →</a></p></li>
<li><h3>Export</h3><p>คลิกแท็บ <span class="ui">Export</span> เลือก Format <span class="ui">H.264</span> และ Preset <span class="ui">Match Source – Adaptive High Bitrate</span> เช็กขนาดภาพกับ frame rate แล้วกด Export</p><p class="note"><a href="#th-presets-resolution">Preset และ Resolution →</a></p></li>
</ol>

<h2 id="habits">นิสัยที่ช่วยให้งานไม่พัง</h2>
<ul class="check">
<li><span><b>กด <kbd>Ctrl</kbd>+<kbd>S</kbd> / <kbd>Cmd</kbd>+<kbd>S</kbd> บ่อย ๆ</b> และเปิด Auto Save ไว้เสมอ</span></li>
<li><span><b>ตัดเรื่องให้เสร็จก่อนแต่ง</b> แต่งสี ใส่<span class="nw">เอฟเฟกต์</span> และทำซับหลังจากลำดับคลิปนิ่งแล้ว จะไม่ต้องทำซ้ำ</span></li>
<li><span><b>ดูบนจอปลายทาง</b> งานแนวตั้งให้ส่งไฟล์เข้ามือถือดูก่อนโพสต์จริง</span></li>
<li><span><b>workspace หน้าตาเพี้ยน</b> ไปที่ <span class="ui">Window › Workspaces › Reset to Saved Layout</span> พาเนลจะกลับที่เดิม</span></li>
</ul>

<h2 id="mistakes">จุดที่มือใหม่พลาดบ่อย</h2>
<ul class="mist">
<li><b>import จากโฟลเดอร์ Downloads หรือเดสก์ท็อปแล้วลบทิ้งทีหลัง</b>คลิปจะขึ้น Media Offline ย้ายไฟล์เข้าโฟลเดอร์งานก่อน import</li>
<li><b>ตั้ง sequence ผิดแนว</b>รู้ตัวตอนจะ export ว่าต้องการแนวตั้ง ตั้งให้ถูกตั้งแต่ขั้นที่ 2</li>
<li><b>แต่งสีหรือทำซับก่อนตัดเสร็จ</b>ตัดคลิปเพิ่มทีหลังต้องทำซ้ำหลายรอบ</li>
<li><b>ใช้เพลงที่ไม่มีสิทธิ์</b>วิดีโออาจโดนปิดเสียงหรือติด claim บนแพลตฟอร์ม เลือกเพลงที่ใช้ได้ตั้งแต่แรก</li>
</ul>

<template id="t-th-project-media">
<p class="crumb">เริ่มที่นี่</p>
<h1>จัดการไฟล์และ<span class="nw">โปรเจกต์</span> ไม่ให้เจอ Media Offline</h1>
<p class="lead">ไฟล์<span class="nw">โปรเจกต์</span>ของ Premiere (.prproj) ไม่ได้เก็บวิดีโอไว้ในตัว มันจำแค่ว่าไฟล์อยู่ที่ไหนและชื่ออะไร ถ้าย้ายหรือเปลี่ยนชื่อไฟล์ คลิปจะกลายเป็นจอแดง Media Offline รู้หลักนี้ข้อเดียวก็กันปัญหาไปได้เกือบหมด</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>กฎข้อเดียวที่ควรจำ:</b> เก็บฟุตเทจไว้ในโฟลเดอร์เดียวกับไฟล์<span class="nw">โปรเจกต์</span> หรือโฟลเดอร์ย่อยของมัน และอย่าเปลี่ยนชื่อไฟล์หรือโฟลเดอร์หลัง import</p></div>
<div class="demo" data-demo="project-media"></div>

<h2 id="folders">โครงสร้างโฟลเดอร์ที่แนะนำ</h2>
<pre class="note" style="background:var(--soft);padding:12px 14px;border-radius:10px;font:500 14px/1.6 'IBM Plex Mono',monospace;overflow-x:auto">MyVlog/
  MyVlog.prproj
  Footage/
  Audio/
  Graphics/
  Exports/</pre>
<ul class="check">
<li><span>หนึ่งงานหนึ่งโฟลเดอร์ ทุกอย่างที่ใช้ในงานอยู่ข้างใน ย้ายไปไหนก็ย้ายทั้งโฟลเดอร์</span></li>
<li><span>ถ้าใช้ไดรฟ์ภายนอก ให้เสียบไว้ตลอดตอนทำงาน</span></li>
<li><span>ทำงานในทีมบน Windows ที่เก็บไฟล์บนเครือข่าย ให้ map เป็นตัวอักษรไดรฟ์ และใช้ตัวอักษรเดียวกันทุกเครื่อง</span></li>
</ul>

<h2 id="relink">Premiere ตามหาไฟล์ที่ย้ายยังไง</h2>
<ol class="steps">
<li><h3>ดูที่อยู่เดิมก่อน</h3><p>Premiere จำที่อยู่ของแต่ละไฟล์ไว้สูงสุด 3 ตำแหน่งใน<span class="nw">โปรเจกต์</span>ปกติ (ที่อยู่ปัจจุบันกับของเก่าอีกสองแห่ง) ถ้าย้ายกลับไปที่เดิมก็เจอเอง</p></li>
<li><h3>ค้นอัตโนมัติ 2 รอบ</h3><p>รอบแรกค้นในโฟลเดอร์ที่มีไฟล์<span class="nw">โปรเจกต์</span>และโฟลเดอร์ย่อยทั้งหมด รอบสองขึ้นไปหนึ่งระดับแล้วค้นทั้งโฟลเดอร์แม่ รวมถึงโฟลเดอร์ข้าง ๆ</p></li>
<li><h3>ถ้ายังไม่เจอ หน้าต่าง Link Media จะเปิดขึ้น</h3><p>ให้ชี้ไปที่ไฟล์เอง หรือคลิกขวาที่คลิป offline ใน Project panel แล้วเลือก <span class="ui">Link Media</span> เมื่อไรก็ได้</p>
<p class="note">ไฟล์ที่ถูกแปลงนามสกุล เช่น ทำ proxy หรือ transcode มา ให้เอาติ๊ก File Extension ใต้ Match File Properties ออกก่อนค้น</p></li>
</ol>
<p>ที่ต้อง relink เองเสมอคือ ไฟล์หรือโฟลเดอร์ถูกเปลี่ยนชื่อ โครงสร้างโฟลเดอร์ถูกรื้อใหม่ หรือไดรฟ์ไม่ได้เสียบ</p>

<h2 id="move">ย้ายหรือส่ง<span class="nw">โปรเจกต์</span>ไปเครื่องอื่น</h2>
<ol class="steps">
<li><h3>ใช้ Project Manager</h3><p>ไปที่ <span class="ui">File › Project Manager</span> เลือก sequence ที่จะเอาไป แล้วเลือก <span class="ui">Collect Files and Copy to New Location</span> Premiere จะก๊อปเฉพาะไฟล์ที่ใช้จริงไปไว้ที่ใหม่พร้อมไฟล์<span class="nw">โปรเจกต์</span></p></li>
<li><h3>อย่าลืมโฟลเดอร์ Masks</h3><p>ถ้าใช้ Object Mask ให้ส่งโฟลเดอร์ <code>&lt;ชื่อ<span class="nw">โปรเจกต์</span>&gt; Masks</code> ที่อยู่ข้างไฟล์<span class="nw">โปรเจกต์</span>ไปด้วย</p></li>
<li><h3>ฟอนต์และ template</h3><p>เครื่องปลายทางต้องมีฟอนต์ที่ใช้ใน title และ MOGRT ด้วย ไม่อย่างนั้นตัวหนังสือจะเปลี่ยนเป็นฟอนต์อื่น</p></li>
</ol>

<h2 id="autosave">Auto Save และการกู้งาน</h2>
<p>ตั้งที่ <span class="ui">Edit › Preferences › Auto Save</span> (Mac: <span class="ui">Premiere › Settings › Auto Save</span>) เลือกให้บันทึกอัตโนมัติทุกกี่นาที และเก็บไว้กี่<span class="nw">เวอร์ชัน</span> ไฟล์สำรองจะอยู่ในโฟลเดอร์ Auto-Save ข้างไฟล์<span class="nw">โปรเจกต์</span> ถ้าโปรแกรมปิดเองหรือไฟล์<span class="nw">โปรเจกต์</span>เสีย ให้เปิดไฟล์ล่าสุดในโฟลเดอร์นี้</p>

<h2 id="cache">Media cache คืออะไร ลบได้ไหม</h2>
<p>ตอน import Premiere สร้างไฟล์ช่วยเล่น เช่น ไฟล์เสียงที่แปลงแล้วและไฟล์ index เก็บไว้ใน media cache ซึ่งใช้ร่วมกับ Media Encoder และ After Effects ไฟล์พวกนี้ลบได้ เมื่อต้องใช้โปรแกรมจะสร้างใหม่</p>
<ul class="check">
<li><span>ตั้งค่าที่ <span class="ui">Edit › Preferences › Media Cache</span> (Mac: <span class="ui">Premiere › Settings › Media Cache</span>) ย้ายที่เก็บไปไดรฟ์ที่เร็วและพื้นที่เหลือเยอะได้</span></li>
<li><span>ตั้งให้ลบไฟล์เก่าอัตโนมัติเมื่อ cache ใหญ่เกินกำหนด ดิสก์จะไม่เต็มโดยไม่รู้ตัว</span></li>
<li><span>ถ้าเสียงหรือภาพเล่นเพี้ยนแปลก ๆ การล้าง cache แล้วเปิด<span class="nw">โปรเจกต์</span>ใหม่มักช่วยได้</span></li>
</ul>

<h2 id="mistakes">จุดที่มือใหม่พลาดบ่อย</h2>
<ul class="mist">
<li><b>import จากการ์ดหน่วยความจำโดยตรง</b>ถอดการ์ดเมื่อไรคลิป offline ทันที ก๊อปไฟล์ลงเครื่องก่อน</li>
<li><b>จัดโฟลเดอร์ใหม่ระหว่างทำงาน</b>ไฟล์ที่ย้ายออกนอกโฟลเดอร์<span class="nw">โปรเจกต์</span>จะหาไม่เจอ จัดให้เสร็จก่อนเริ่ม</li>
<li><b>ลบฟุตเทจที่คิดว่าไม่ได้ใช้</b>ใช้ Project Manager แยกไฟล์ที่ใช้จริงออกมาก่อนค่อยลบ</li>
<li><b>ไดรฟ์เต็มเพราะ cache</b>ตั้งขนาด cache สูงสุดและให้ลบไฟล์เก่าอัตโนมัติ</li>
</ul>

<template id="t-th-premiere-vs-ae">
<p class="crumb">เริ่มที่นี่</p>
<h1>Premiere กับ After Effects ใช้ต่างกันยังไง</h1>
<p class="lead">Premiere ใช้ <b>ตัดต่อ</b> คือเรียงคลิปยาว ๆ ให้เป็นเรื่อง ใส่เสียง ซับ และสี ส่วน After Effects ใช้ <b>สร้างภาพเคลื่อนไหวและ<span class="nw">เอฟเฟกต์</span></b> ที่ละเอียดในช่วงสั้น ๆ งานส่วนใหญ่เริ่มใน Premiere แล้วค่อยส่งบางช็อตไปทำต่อใน After Effects</p>
<ul class="meta"><li class="ver">Premiere และ After Effects 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>จำง่าย ๆ:</b> ถ้างานยาวเป็นนาทีและมีหลายคลิป ทำใน Premiere ถ้างานยาวไม่กี่วินาทีแต่ต้องขยับทุกอย่างอย่างละเอียด ทำใน After Effects</p></div>
<div class="demo" data-demo="premiere-vs-ae"></div>

<h2 id="compare">เทียบกันทีละเรื่อง</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>เรื่อง</th><th>Premiere</th><th>After Effects</th></tr></thead>
<tbody>
<tr><td>งานหลัก</td><td>ตัดต่อ เรียงเรื่อง เสียง ซับ แต่งสี</td><td>motion graphics, compositing, visual effects</td></tr>
<tr><td>หน่วยของงาน</td><td>Sequence</td><td>Composition</td></tr>
<tr><td>Timeline</td><td>track หนึ่งเส้นวางได้หลายคลิปต่อกัน</td><td>layer หนึ่งชั้นมีต้นฉบับได้แค่ชิ้นเดียว</td></tr>
<tr><td>ความยาวที่เหมาะ</td><td>หลายนาทีถึงหลายชั่วโมง</td><td>ไม่กี่วินาทีถึงไม่กี่นาที</td></tr>
<tr><td>ไฟล์<span class="nw">โปรเจกต์</span></td><td><code>.prproj</code></td><td><code>.aep</code></td></tr>
<tr><td>ส่งออก</td><td>Export mode หรือ Media Encoder</td><td>Render Queue หรือ Media Encoder</td></tr>
</tbody></table></div>

<h2 id="together">ใช้สองโปรแกรมร่วมกัน</h2>
<ol class="steps">
<li><h3>Dynamic Link: ส่งคลิปไปทำใน After Effects</h3><p>ใน Premiere คลิกขวาที่คลิปบน timeline แล้วเลือก <span class="ui">Replace With After Effects Composition</span> After Effects จะเปิดขึ้นพร้อม composition ใหม่ที่มีคลิปนั้นอยู่ แก้ใน After Effects แล้วกลับมาดูใน Premiere ได้เลยโดยไม่ต้อง render</p>
<p class="note">ต้องใช้ Premiere กับ After Effects <span class="nw">เวอร์ชัน</span>เดียวกัน ไม่อย่างนั้น Dynamic Link จะไม่ทำงาน</p></li>
<li><h3>สร้าง composition เปล่าจาก Premiere</h3><p>เลือก <span class="ui">File › Adobe Dynamic Link › New After Effects Composition</span> composition ใหม่จะได้ขนาดภาพและ frame rate ตาม project ของ Premiere และยาว 30 วินาทีเป็นค่าเริ่มต้น</p></li>
<li><h3>MOGRT: ออกแบบครั้งเดียวใช้ได้ทั้งทีม</h3><p>ออกแบบกราฟิกใน After Effects แล้ว export เป็น <code>.mogrt</code> คนตัดต่อเอาไปใช้ใน Premiere และแก้แค่ช่องที่เปิดไว้ เช่นชื่อและสี ดูเพิ่มที่หน้า <a href="#th-mogrt">MOGRT</a></p></li>
<li><h3>Media Encoder: ให้เครื่องส่งออกไฟล์แทน</h3><p>ทั้งสองโปรแกรมส่งงานไปเข้าคิวใน Adobe Media Encoder ได้ จะได้ทำงานต่อระหว่างที่ไฟล์กำลัง export</p></li>
</ol>

<h2 id="which">งานแบบไหนใช้อะไร</h2>
<ul class="check">
<li><span><b>Vlog, สัมภาษณ์, คลิปงานอีเวนต์</b> เริ่มและจบใน Premiere ได้เลย ใช้ MOGRT สำเร็จรูปสำหรับชื่อคน</span></li>
<li><span><b>Intro โลโก้, ไตเติลหนัง, infographic เคลื่อนไหว</b> ทำใน After Effects แล้ว render หรือส่งผ่าน Dynamic Link</span></li>
<li><span><b>ลบวัตถุ, tracking ป้าย, แทนท้องฟ้า</b> งาน compositing ละเอียดทำใน After Effects ส่วนงานง่าย ๆ ลองใช้ <a href="#th-object-mask">Object Mask</a> ใน Premiere ก่อน</span></li>
<li><span><b>ซับไตเติล, เสียง, แต่งสีทั้งเรื่อง</b> ทำใน Premiere เพราะต้องเห็นทั้งเรื่องต่อเนื่องกัน</span></li>
</ul>

<h2 id="mistakes">ข้อผิดพลาดที่มือใหม่เจอบ่อย</h2>
<ul class="mist">
<li><b>ตัดต่อทั้งเรื่องใน After Effects</b>After Effects ไม่ได้ออกแบบมาให้เรียงคลิปยาว ๆ จะ preview ช้าและแก้ลำบาก ตัดใน Premiere แล้วส่งเฉพาะช็อตที่ต้องทำ<span class="nw">เอฟเฟกต์</span>ไป</li>
<li><b>ทำ<span class="nw">แอนิเมชัน</span>ซับซ้อนด้วย keyframe ใน Premiere</b>ทำได้ระดับหนึ่ง แต่ถ้ามีหลายชิ้นขยับพร้อมกัน After Effects มี Graph Editor และ text animator ที่คุมได้ละเอียดกว่า</li>
<li><b>Dynamic Link ไม่ขึ้น</b>เช็กว่าทั้งสองโปรแกรมเป็น<span class="nw">เวอร์ชัน</span>เดียวกัน เช่น 27.0 ทั้งคู่</li>
<li><b>render จาก After Effects เป็น MP4 เพื่อวางทับใน Premiere</b>MP4 (H.264) เก็บพื้นหลังโปร่งใสไม่ได้ ถ้าต้องวางทับให้ใช้ Dynamic Link หรือ render เป็น ProRes 4444 แบบ RGB + Alpha</li>
</ul>

<h2 id="older">ถ้าใช้<span class="nw">เวอร์ชัน</span>เก่ากว่า 27.0</h2>
<details class="old"><summary>Premiere Pro 25.x และ Premiere 26.x</summary><ul>
<li>ก่อน<span class="nw">เวอร์ชัน</span> 26.0 โปรแกรมชื่อ Adobe Premiere Pro หน้าที่และการใช้งานร่วมกับ After Effects เหมือนเดิม</li>
<li>Dynamic Link และ MOGRT ใช้แบบเดียวกัน แต่ต้องให้<span class="nw">เวอร์ชัน</span>ของสองโปรแกรมตรงกันเสมอ</li></ul></details>

<h1>สเปกเครื่องและการติดตั้ง</h1>
<p class="lead">ก่อนติดตั้ง Premiere หรือ After Effects 27.0 ให้เช็กสามอย่าง คือระบบปฏิบัติการ RAM และการ์ดจอ <span class="nw">เวอร์ชัน</span> 27.0 ตัดการรองรับ Windows รุ่นเก่าและ Mac ชิป Intel ออกแล้ว</p>
<ul class="meta"><li class="ver">Premiere และ After Effects 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>Windows 11 <span class="nw">เวอร์ชัน</span> 23H2 ติดตั้ง 27.0 ไม่ได้</b> ต้องอัปเดตเป็น 24H2 ขึ้นไปก่อน ส่วน Mac ต้องเป็นชิป Apple silicon (M1 ขึ้นไป) และ macOS 15 ขึ้นไป</p></div>

<tr><td>RAM</td><td>ขั้นต่ำ 8 GB, แนะนำ 16 GB สำหรับ HD และ 32 GB ขึ้นไปสำหรับ 4K</td><td>ขั้นต่ำ 16 GB, แนะนำ 32 GB ขึ้นไปสำหรับ 4K</td></tr>
<tr><td>การ์ดจอ (Windows)</td><td>VRAM อย่างน้อย 4 GB ถ้าเป็น NVIDIA ต้องรุ่น Maxwell (2014) ขึ้นไป แนะนำ 8 GB</td><td>VRAM อย่างน้อย 4 GB</td></tr>

<h2 id="steps">ขั้นตอนติดตั้ง</h2>
<ol class="steps">
<li><h3>เช็ก<span class="nw">เวอร์ชัน</span>ระบบปฏิบัติการ</h3><p>Windows: <span class="ui">Settings › System › About</span> ดูที่ Version ต้องเป็น 24H2 ขึ้นไป · Mac: เมนู Apple › <span class="ui">About This Mac</span> ดูชิปและ<span class="nw">เวอร์ชัน</span> macOS</p></li>
<li><h3>เช็ก VRAM ของการ์ดจอ (Windows)</h3><p>เปิด Task Manager › แท็บ <span class="ui">Performance</span> › เลือก GPU แล้วดู Dedicated GPU memory ถ้าต่ำกว่า 4 GB อาจเปิด Premiere ไม่ได้หรือใช้งานไม่ไหว</p></li>
<li><h3>ติดตั้ง Creative Cloud desktop app</h3><p>ดาวน์โหลดจากเว็บ Adobe แล้วล็อกอินด้วย Adobe ID ต้องต่ออินเทอร์เน็ตเพื่อ activate</p></li>
<li><h3>ตั้งภาษาก่อนกดติดตั้ง</h3><p>ใน Creative Cloud desktop app เปิด Preferences › <span class="ui">Apps</span> แล้วเลือก <span class="ui">Default install language</span> ทั้งสองโปรแกรมมีภาษา 한국어 และ 简体中文 ให้เลือก</p>
<p class="note">ภาษาจะใช้กับโปรแกรมที่ติดตั้งหลังจากนี้ ถ้าอยากเปลี่ยนภาษาของโปรแกรมที่ติดตั้งไปแล้ว ต้องถอนการติดตั้งแล้วติดตั้งใหม่</p></li>
<li><h3>ติดตั้ง Premiere และ After Effects <span class="nw">เวอร์ชัน</span>เดียวกัน</h3><p>กด Install ทั้งสองตัวจากรายการ Apps ถ้าจะใช้ Dynamic Link ต้องเป็น<span class="nw">เวอร์ชัน</span>เดียวกัน</p></li>
</ol>

<h2 id="buy">ถ้ากำลังจะซื้อเครื่องใหม่</h2>
<ul class="check">
<li><span><b>RAM 32 GB</b> ถ้าตั้งใจทำ 4K หรือใช้ After Effects เป็นประจำ</span></li>
<li><span><b>การ์ดจอแยก VRAM 8 GB ขึ้นไป</b> บน Windows เพื่อ<span class="nw">เอฟเฟกต์</span>และฟีเจอร์ AI ที่ใช้ GPU</span></li>
<li><span><b>SSD สองลูก</b> ลูกหนึ่งสำหรับระบบและโปรแกรม อีกลูกสำหรับไฟล์งานและ cache</span></li>
<li><span><b>Mac ต้องเป็น Apple silicon</b> และเลือก unified memory ให้พอตั้งแต่ตอนซื้อ เพราะเพิ่มทีหลังไม่ได้</span></li>
</ul>

<h2 id="mistakes">ข้อผิดพลาดที่มือใหม่เจอบ่อย</h2>

<li><b>เก็บฟุตเทจบน HDD ภายนอกช้า ๆ</b>เล่นกระตุกได้แม้เครื่องแรง ย้ายไฟล์งานไปไว้บน SSD</li>

<h1>รู้จักหน้าจอและพาเนล</h1>
<p class="lead">หน้าจอ Premiere แบ่งเป็นพาเนลหลายช่อง แต่ละช่องมีหน้าที่ของตัวเอง ด้านบนสุดคือ header bar สำหรับสลับโหมดทำงาน ถ้าพาเนลหายหรือเลย์เอาต์เละ กดรีเซ็ตกลับได้เสมอ</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>เลย์เอาต์เละ?</b> ไปที่ <span class="ui">Window › Workspaces › Reset to Saved Layout</span> หรือดับเบิลคลิกชื่อ workspace บน header bar พาเนลจะกลับไปอยู่ที่เดิม</p></div>
<div class="demo" data-demo="workspace-tour"></div>

<h2 id="header">Header bar และโหมดทำงาน</h2>
<p>ตอนเปิดโปรแกรมจะเจอหน้า Home ก่อน เมื่อกด New Project โปรแกรมจะเปิดในโหมด <b>Import</b> พอสร้างหรือเปิด project แล้วจะเข้าโหมด <b>Edit</b> และเมื่อพร้อมส่งออกให้ไปที่โหมด <b>Export</b> <span class="nw">เวอร์ชัน</span> 27.0 มีโหมด <b>Color</b> สำหรับแต่งสีเพิ่มเข้ามาด้วย</p>
<p>ด้านขวาของ header bar มีชื่อ project, เมนู Workspaces, ปุ่ม Quick Export และปุ่มขยายวิดีโอเต็มจอ</p>

<h2 id="panels">พาเนลที่ใช้บ่อย</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>พาเนล</th><th>มีไว้ทำอะไร</th><th><span class="nw">คีย์ลัด</span></th></tr></thead>
<tbody>
<tr><td>Project</td><td>เก็บไฟล์ที่ import และ sequence จัดเป็น bin ได้</td><td><kbd>Shift</kbd>+<kbd>1</kbd></td></tr>
<tr><td>Source Monitor</td><td>ดูคลิปดิบและตั้งจุด In/Out</td><td><kbd>Shift</kbd>+<kbd>2</kbd></td></tr>
<tr><td>Timeline</td><td>ที่ตัดต่อจริง เรียงคลิปบน track</td><td><kbd>Shift</kbd>+<kbd>3</kbd></td></tr>
<tr><td>Program Monitor</td><td>แสดงผลของ sequence</td><td><kbd>Shift</kbd>+<kbd>4</kbd></td></tr>
<tr><td>Effect Controls</td><td>ค่าของ<span class="nw">เอฟเฟกต์</span>และ keyframe ของคลิปที่เลือก</td><td><kbd>Shift</kbd>+<kbd>5</kbd></td></tr>
<tr><td>Effects</td><td>รายการ<span class="nw">เอฟเฟกต์</span>และ<span class="nw">ทรานซิชัน</span>ทั้งหมด</td><td><kbd>Shift</kbd>+<kbd>7</kbd></td></tr>
<tr><td>Properties</td><td>ปรับค่าที่ใช้บ่อยของคลิปที่เลือกในที่เดียว เช่นขนาด ตำแหน่ง ความดังเสียง</td><td>เมนู Window</td></tr>
<tr><td>Essential Sound</td><td>ตั้งประเภทเสียง ปรับความดัง ducking</td><td>เมนู Window</td></tr>
</tbody></table></div>
<p class="note">กด <kbd>`</kbd> (ปุ่มซ้ายของเลข 1) เพื่อขยายพาเนลที่เลือกเต็มหน้าจอ กดอีกครั้งเพื่อกลับ</p>

<h2 id="steps">จัดหน้าจอให้ใช้ง่าย</h2>
<ol class="steps">
<li><h3>เลือก workspace ให้ตรงงาน</h3><p>เปิดเมนู Workspaces ทางขวาบน มี workspace สำเร็จรูปหลายแบบ เช่น Editing, Audio และ Captions and Graphics ซึ่งจัดพาเนลไว้ให้เหมาะกับงานนั้น</p></li>
<li><h3>ลากพาเนลไปวางใหม่</h3><p>ลากแท็บชื่อพาเนลไปวางที่ขอบของพาเนลอื่น จะเห็นพื้นที่ไฮไลต์ว่าจะไปวางตรงไหน</p></li>
<li><h3>บันทึกเลย์เอาต์ของตัวเอง</h3><p>เมื่อจัดเสร็จ เลือก <span class="ui">Window › Workspaces › Save as New Workspace</span> แล้วตั้งชื่อ</p></li>
<li><h3>หาพาเนลที่หายไป</h3><p>ทุกพาเนลเปิดได้จากเมนู <span class="ui">Window</span> ถ้าปิดไปโดยไม่ตั้งใจ เปิดจากตรงนั้นได้เลย</p></li>
</ol>

<h2 id="ae">หน้าจอ After Effects ต่างกันตรงไหน</h2>
<p>After Effects มีพาเนลคล้ายกัน แต่ใช้ชื่อต่าง: <b>Composition</b> แทน Program Monitor, <b>Timeline</b> แสดง layer ซ้อนกันแทน track และมี <b>Effects &amp; Presets</b> กับ <b>Properties</b> อยู่ด้านขวา ดูเพิ่มที่หน้า <a href="#th-ae-comp-layers">Composition และ Layer</a></p>

<h2 id="mistakes">ข้อผิดพลาดที่มือใหม่เจอบ่อย</h2>
<ul class="mist">
<li><b>เปิด project ของคนอื่นแล้วหน้าจอเปลี่ยน</b>ถ้าเปิด <span class="ui">Import Workspace From Projects</span> ไว้ Premiere จะใช้เลย์เอาต์ที่บันทึกมากับ project ปิดตัวเลือกนี้ในเมนู Window › Workspaces</li>
<li><b>Reset แล้วไม่กลับเป็นค่าเริ่มต้น</b>Reset to Saved Layout จะกลับไปที่เลย์เอาต์ที่บันทึกล่าสุดของ workspace นั้น ถ้าเคยบันทึกทับไว้ ให้เปลี่ยนไปใช้ workspace อื่นที่ยังไม่ได้แก้</li>
<li><b>พาเนลเล็กเกินจนอ่านไม่ออก</b>ใช้ <kbd>`</kbd> ขยายชั่วคราว หรือลากเส้นแบ่งระหว่างพาเนล</li>
</ul>

<template id="t-th-sequence">
<p class="crumb">Premiere › พื้นฐาน</p>
<h1>Sequence คืออะไร และควรตั้งค่าแบบไหน</h1>
<p class="lead">Sequence คือไทม์ไลน์ของงานหนึ่งชิ้น เก็บลำดับคลิป เสียง <span class="nw">เอฟเฟกต์</span> และกำหนดขนาดภาพกับ<span class="nw">เฟรมเรต</span>ของงาน ตั้งให้ตรงกับปลายทางตั้งแต่ต้น ภาพจะไม่ยืด ไม่กระตุก และ export ง่าย</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>ไม่แน่ใจว่าจะตั้งค่าอะไร?</b> ลากคลิปหลักไปวางบนไอคอน <span class="ui">New Item</span> ที่มุมล่างของ Project panel Premiere จะสร้าง sequence ที่ขนาดภาพและ<span class="nw">เฟรมเรต</span>ตรงกับคลิปนั้นให้ทันที</p></div>
<div class="demo" data-demo="sequence"></div>

<h2 id="what">Sequence คืออะไร</h2>
<ul class="check">
<li><span><span class="nw">โปรเจกต์</span>หนึ่งมีได้หลาย sequence เช่น ตัวเต็มแนวนอนสำหรับ YouTube กับตัวสั้นแนวตั้งสำหรับ Reels ใช้ฟุตเทจชุดเดียวกัน</span></li>
<li><span>Sequence เก็บสองอย่าง คือ <b>สิ่งที่ตัดต่อ</b> (คลิปบน track วิดีโอและเสียง <span class="nw">เอฟเฟกต์</span> กราฟิก) กับ <b>settings</b> (ขนาดภาพ <span class="nw">เฟรมเรต</span> รูปแบบเสียง)</span></li>
<li><span>Editing Mode ใน settings ไม่ได้กำหนดไฟล์สุดท้าย ไฟล์ที่ได้จริงเลือกตอน export</span></li>
</ul>

<h2 id="create">สร้าง sequence 3 วิธี</h2>
<ol class="steps">
<li><h3>สร้างจากคลิป (ง่ายที่สุด)</h3>
<p>ลากคลิปจาก Project panel ไปวางบนไอคอน <span class="ui">New Item</span> หรือคลิกขวาที่คลิปแล้วเลือก <span class="ui">New Sequence From Clip</span> ได้ sequence ที่ตรงกับคลิปทันที</p>
<p class="note">เหมาะเมื่อปลายทางเหมือนกับที่กล้องถ่ายมา เช่น ถ่าย 1920×1080 25p และจะลง YouTube แนวนอน</p></li>
<li><h3>สร้างจากเมนู แล้วตั้งเอง</h3>
<p>ไปที่ <span class="ui">File › New › Sequence</span> (<kbd>Ctrl</kbd>+<kbd>N</kbd> / <kbd>Cmd</kbd>+<kbd>N</kbd>) เลือก preset ที่ใกล้เคียง หรือไปแท็บ <span class="ui">Settings</span> เลือก Editing Mode เป็น <span class="ui">Custom</span> แล้วกรอกค่าเอง</p>
<p class="note">ตั้งเสร็จแล้วกด <span class="ui">Save Preset</span> ตั้งชื่อเช่น "Reels 1080x1920 25p" ครั้งหน้าเลือกได้เลย</p></li>
<li><h3>ลากคลิปแรกลง sequence ว่าง</h3>
<p>ถ้า settings ของคลิปไม่ตรงกับ sequence Premiere จะถามว่าจะเปลี่ยน sequence ให้ตรงกับคลิป หรือคง settings เดิมไว้ ถ้าตั้ง sequence ตามปลายทางไว้แล้ว (เช่น แนวตั้ง) ให้เลือกคงค่าเดิม</p></li>
</ol>

<h2 id="settings">ค่าสำคัญใน Sequence Settings</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Setting</th><th>คืออะไร</th><th>มือใหม่ตั้งยังไง</th></tr></thead>
<tbody>
<tr><td>Timebase</td><td>หน่วยเวลาของ sequence ก็คือ<span class="nw">เฟรมเรต</span></td><td>ให้ตรงกับกล้อง โดยทั่วไป 24 สำหรับลุคฟิล์ม 25 สำหรับระบบ PAL และ 29.97 สำหรับ NTSC</td></tr>
<tr><td>Frame Size</td><td>ขนาดภาพเป็น<span class="nw">พิกเซล</span></td><td>ตั้งตามปลายทาง เช่น 1920×1080 หรือ 1080×1920 ตั้งได้สูงสุด 10,240×8,192</td></tr>
<tr><td>Pixel Aspect Ratio</td><td>รูปทรงของแต่ละ<span class="nw">พิกเซล</span></td><td><span class="ui">Square Pixels (1.0)</span> ถ้าเลือกไม่ตรงกับไฟล์ ภาพจะยืดหรือบีบ</td></tr>
<tr><td>Fields</td><td>ภาพแบบ interlaced หรือ progressive</td><td><span class="ui">No Fields (Progressive Scan)</span> สำหรับกล้องและมือถือปัจจุบัน</td></tr>
<tr><td>Working color space / Auto Tone Map Media</td><td>การจัดการสีของ sequence</td><td>ใช้ค่าเริ่มต้นไปก่อน Auto Tone Map Media ช่วยให้ใส่ฟุตเทจ Log, HLG จาก iPhone หรือ HDR ปนกันใน sequence เดียวได้ง่ายขึ้น</td></tr>
<tr><td>Audio Sample Rate</td><td>ความละเอียดเสียง</td><td>48000 Hz ซึ่งเป็นมาตรฐานงานวิดีโอ</td></tr>
<tr><td>Video Previews</td><td>รูปแบบไฟล์ preview ตอนเรนเดอร์ดูในโปรแกรม</td><td>ใช้ค่าเริ่มต้น (หลาย preset ใช้ Apple ProRes 422 LT)</td></tr>
<tr><td>Maximum Bit Depth / Maximum Render Quality</td><td>คุณภาพการประมวลผลสูงสุด</td><td>เปิดเมื่อจำเป็น เพราะใช้ RAM และเวลามากขึ้น</td></tr>
</tbody></table></div>

<h2 id="jobs">ตั้งค่าตามประเภทงาน</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>งาน</th><th>Frame Size</th><th>Timebase</th><th>เหตุผล / ข้อควรรู้</th></tr></thead>
<tbody>
<tr><td>YouTube แนวนอน</td><td class="n">1920 × 1080<br>หรือ 3840 × 2160</td><td>ตามที่ถ่าย</td><td>YouTube แนะนำให้อัปโหลดด้วย<span class="nw">เฟรมเรต</span>เดียวกับที่ถ่าย และ 16:9 คือสัดส่วนมาตรฐานบนคอมพิวเตอร์</td></tr>
<tr><td>Shorts / Reels / TikTok</td><td class="n">1080 × 1920</td><td>ตามที่ถ่าย</td><td>ถ้าถ่ายแนวนอนมา ใช้ <span class="ui">Sequence › Auto Reframe Sequence</span> ช่วยครอปตามวัตถุในภาพ</td></tr>
<tr><td>Instagram feed</td><td class="n">1080 × 1350</td><td>ตามที่ถ่าย</td><td>สัดส่วน 4:5 กินพื้นที่จอมือถือมากกว่าแนวนอน เช็กสเปกล่าสุดของแพลตฟอร์มก่อนส่ง</td></tr>
<tr><td>อีเวนต์ / งานในอาคาร</td><td class="n">1920 × 1080</td><td>ตามไฟฟ้าของประเทศ</td><td>ประเทศที่ใช้ไฟ 50Hz เช่น ไทยและจีน ถ่ายและตัดที่ 25 หรือ 50 ส่วนประเทศที่ใช้ไฟ 60Hz เช่น เกาหลี ใช้ 29.97/30 หรือ 59.94/60 ช่วยลดอาการไฟกะพริบ</td></tr>
<tr><td>ส่งสถานีทีวี</td><td class="n">1920 × 1080</td><td>ตามสเปกสถานี</td><td>ไทยและจีนใช้ระบบ 50Hz (25/50) เกาหลีใช้ระบบ 60Hz (29.97/59.94) ทำตามสเปกที่สถานีส่งมาเสมอ</td></tr>
<tr><td>หนังสั้น / ส่งประกวด</td><td class="n">1920 × 1080<br>หรือ 4096 × 2160</td><td>24 หรือ 23.976</td><td>4096×2160 คือ 4K มาตรฐานโรงภาพยนตร์ ดูสเปกของเทศกาลก่อน</td></tr>

<h2 id="change">เปลี่ยน settings ทีหลัง</h2>
<p>ไปที่ <span class="ui">Sequence › Sequence Settings</span> หรือคลิกขวาที่ sequence ใน Project panel แล้วเลือก <span class="ui">Sequence Settings</span> ถ้าเปลี่ยน Frame Size ให้ติ๊ก <span class="ui">Scale motion effects proportionally when changing frame size</span> เพื่อให้ตำแหน่งและขนาดของคลิปปรับตามสัดส่วน</p>
<p>อย่าลด Frame Size เพื่อแก้เครื่องเล่นกระตุก ให้ลดความละเอียดตอนเล่น (playback resolution) ที่ Program Monitor แทน</p>

<h2 id="mistakes">จุดที่มือใหม่พลาดบ่อย</h2>
<ul class="mist">
<li><b>ใส่คลิป 4K ใน sequence 1080 แล้วภาพซูมเข้า</b>คลิกขวาที่คลิปใน timeline เลือก <span class="ui">Set to Frame Size</span> ภาพจะพอดีเฟรมและยังซูมกลับได้คมเพราะไฟล์ต้นฉบับใหญ่กว่า</li>
<li><b><span class="nw">เฟรมเรต</span>ของ sequence ไม่ตรงกับกล้อง</b>ภาพจะกระตุกหรือเฟรมซ้ำ ใช้วิธีสร้าง sequence จากคลิปหลักจะไม่พลาดเรื่องนี้</li>
<li><b>ตัดคลิปแนวตั้งใน sequence แนวนอน</b>จะมีขอบดำสองข้าง ทำ sequence แนวตั้งแยกไว้ต่างหาก</li>
<li><b>ตั้ง Fields หรือ Pixel Aspect Ratio ผิด</b>ภาพมีเส้นหวีหรือยืด เลือก No Fields และ Square Pixels สำหรับฟุตเทจทั่วไป</li>
</ul>

<template id="t-th-monitors">
<p class="crumb">Premiere › พื้นฐาน</p>
<h1>Source Monitor กับ Program Monitor ต่างกันยังไง</h1>
<p class="lead">Source Monitor ใช้ดูและเลือกช่วงจากคลิปดิบทีละคลิป ส่วน Program Monitor แสดงผลงานที่กำลังตัดอยู่ใน sequence จำง่าย ๆ ว่าจอซ้ายคือวัตถุดิบ จอขวาคือสิ่งที่คนดูจะเห็น</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 2 21 19H1Z" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/><path d="M11 8v5" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="16" r="1.2" fill="var(--acc)"/></svg>
<p><b>มีอะไรเปลี่ยนใน 27.0:</b> Clip Match และโหมดเทียบภาพ (Comparison Mode) ใน monitor ของ Edit mode ถูกถอดออกแล้ว การเทียบภาพเพื่อแต่งสีย้ายไปอยู่ใน Color Mode</p></div>
<div class="demo" data-demo="monitors"></div>

<h2 id="compare">เทียบกันชัด ๆ</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>หัวข้อ</th><th>Source Monitor</th><th>Program Monitor</th></tr></thead>
<tbody>
<tr><td>แสดงอะไร</td><td>คลิปเดี่ยว ๆ ที่เปิดจาก Project panel หรือจาก timeline</td><td>sequence ที่เปิดอยู่ใน Timeline panel</td></tr>
<tr><td>จุด In / Out</td><td>เลือกช่วงของคลิปที่จะเอาไปใช้</td><td>เลือกช่วงใน sequence ที่จะเพิ่มหรือเอาออก</td></tr>
<tr><td>Marker</td><td>clip marker ติดไปกับคลิป</td><td>sequence marker ติดอยู่กับ timeline</td></tr>
<tr><td>ปุ่มหลัก</td><td><span class="ui">Insert</span> และ <span class="ui">Overwrite</span></td><td><span class="ui">Lift</span> และ <span class="ui">Extract</span></td></tr>
<tr><td>ใช้ตอน</td><td>คัดฟุตเทจ เลือกเฉพาะภาพหรือเฉพาะเสียง</td><td>ดูผลงาน ย่อขยายหรือจัดตำแหน่งภาพ วางกราฟิก</td></tr>
</tbody></table></div>
<p class="note">ทั้งสองจอมีปุ่ม <span class="ui">Export Frame</span> ไว้เซฟภาพนิ่งจากเฟรมที่อยู่</p>

<h2 id="steps">ขั้นตอน: คัดคลิปจาก Source ไปลง timeline</h2>
<ol class="steps">
<li><h3>เปิดคลิปใน Source Monitor</h3><p>ดับเบิลคลิกคลิปใน Project panel คลิปจะขึ้นที่ Source Monitor โดยยังไม่ไปอยู่ใน sequence</p></li>
<li><h3>เลือกช่วงที่จะใช้</h3><p>เล่นหาจุดเริ่ม กด <kbd>I</kbd> เพื่อตั้ง In แล้วหาจุดจบ กด <kbd>O</kbd> เพื่อตั้ง Out ช่วงระหว่างสองจุดคือส่วนที่จะถูกวาง</p></li>
<li><h3>เลือกว่าจะเอาภาพ เสียง หรือทั้งคู่</h3><p>ลากไอคอน <span class="ui">Drag video</span> หรือ <span class="ui">Drag audio</span> ใต้จอ ไปวางใน timeline ถ้าต้องการแค่อย่างเดียว</p></li>
<li><h3>วาง playhead ใน timeline</h3><p>ย้าย playhead ไปจุดที่จะวางคลิป และเช็กว่า track ที่จะรับคลิปถูกเปิด target ไว้</p></li>
<li><h3>กด Insert หรือ Overwrite</h3>
<ul><li><span class="ui">Insert</span> <kbd>,</kbd> แทรกคลิปตรง playhead คลิปที่อยู่หลังจากนั้นถูกดันไปทางขวา sequence ยาวขึ้น</li>
<li><span class="ui">Overwrite</span> <kbd>.</kbd> วางทับของเดิมเท่าความยาวคลิป sequence ไม่ยาวขึ้นถ้าวางในช่วงที่มีคลิปอยู่แล้ว</li></ul></li>
<li><h3>ดูผลและเอาช่วงที่ไม่ใช้ออกใน Program Monitor</h3><p>ตั้ง In/Out ใน Program Monitor แล้วกด <span class="ui">Lift</span> <kbd>;</kbd> เพื่อยกออกโดยเหลือช่องว่าง หรือ <span class="ui">Extract</span> <kbd>'</kbd> เพื่อเอาออกแล้วปิดช่องว่างให้</p></li>
</ol>

<h2 id="keys"><span class="nw">คีย์ลัด</span>ที่ใช้บ่อย</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>ปุ่ม</th><th>ทำอะไร</th></tr></thead>
<tbody>
<tr><td><kbd>I</kbd> / <kbd>O</kbd></td><td>ตั้งจุด In / Out ในจอที่เลือกอยู่</td></tr>
<tr><td><kbd>,</kbd></td><td>Insert จาก Source ลง timeline</td></tr>
<tr><td><kbd>.</kbd></td><td>Overwrite จาก Source ลง timeline</td></tr>
<tr><td><kbd>;</kbd> / <kbd>'</kbd></td><td>Lift / Extract ช่วง In–Out ใน sequence</td></tr>
<tr><td><kbd>J</kbd> <kbd>K</kbd> <kbd>L</kbd></td><td>เล่นถอยหลัง / หยุด / เล่นไปข้างหน้า กดซ้ำเพื่อเร่งความเร็ว</td></tr>
<tr><td><kbd>F</kbd></td><td>Match Frame: เปิดคลิปต้นฉบับของเฟรมที่อยู่ใน timeline ขึ้นมาใน Source Monitor</td></tr>
</tbody></table></div>

<h2 id="mistakes">จุดที่มือใหม่พลาดบ่อย</h2>
<ul class="mist">
<li><b>กด Overwrite แล้วคลิปเดิมหายไป</b>Overwrite วางทับจริง ๆ กด <kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Cmd</kbd>+<kbd>Z</kbd> แล้วใช้ Insert แทนถ้าต้องการแทรก</li>
<li><b>Insert แล้วเสียงหลุด sync</b>ถ้าบาง track ถูกปิด Sync Lock ไว้ track นั้นจะไม่ถูกดันตาม เปิด Sync Lock ให้ทุก track ที่ต้องเลื่อนไปด้วยกัน</li>
<li><b>คลิปไปลง track ที่ไม่ได้ตั้งใจ</b>ดูปุ่ม source patching และ track targeting ทางซ้ายของ timeline ว่าเปิดไว้ที่ track ไหน</li>
<li><b>ภาพใน Program Monitor แตก เลยคิดว่าไฟล์เสีย</b>อาจเป็นเพราะตั้ง Resolution ของจอไว้ที่ 1/2 หรือ 1/4 เพื่อให้เล่นลื่น ไฟล์ที่ export ไม่เป็นไปด้วย</li>
<li><b>ใส่ marker ผิดที่</b>marker ที่ปักใน Source Monitor จะติดไปกับคลิป ถ้าอยากได้หมุดบน timeline ให้ปักใน Program Monitor หรือ timeline</li>
</ul>

<template id="t-th-timeline">
<p class="crumb">Premiere › พื้นฐาน</p>
<h1>ตัดต่อบน Timeline</h1>
<p class="lead">Timeline คือที่เรียงคลิปภาพไว้บน track วิดีโอ (V1, V2 …) และเสียงไว้บน track เสียง (A1, A2 …) เครื่องมือที่ใช้จริงทุกวันมีไม่กี่ตัว รู้จักตัด ลบ ripple และแยกภาพกับเสียง ก็ตัดต่องานส่วนใหญ่ได้แล้ว</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>รู้ไว้:</b> ใน 26.3 มีตัวเลือกใหม่ใน Timeline preferences ให้เลือกได้ว่าจะให้ Premiere สร้าง track เพิ่มเองหรือไม่ ตอนวางคลิปลง sequence ถ้า track งอกมาเองเยอะ ลองดูที่ตัวเลือกนี้</p></div>
<div class="demo" data-demo="timeline"></div>

<h2 id="tools">เครื่องมือที่ใช้บ่อย</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>เครื่องมือ</th><th>ปุ่ม</th><th>ทำอะไร</th></tr></thead>
<tbody>
<tr><td>Selection</td><td><kbd>V</kbd></td><td>เลือก ลาก และย้ายคลิป ใช้เป็นหลักแทบตลอดเวลา</td></tr>
<tr><td>Razor</td><td><kbd>C</kbd></td><td>ตัดคลิปเป็นสองท่อนตรงจุดที่คลิก กด <kbd>Shift</kbd> ค้างเพื่อตัดทุก track พร้อมกัน</td></tr>
<tr><td>Ripple Edit</td><td><kbd>B</kbd></td><td>ลากขอบคลิปให้สั้นหรือยาวขึ้น คลิปถัดไปขยับตามโดยไม่เกิดช่องว่าง</td></tr>
<tr><td>Rolling Edit</td><td><kbd>N</kbd></td><td>เลื่อนจุดต่อระหว่างสองคลิป ความยาวรวมไม่เปลี่ยน</td></tr>
<tr><td>Rate Stretch</td><td><kbd>R</kbd></td><td>ลากขอบคลิปเพื่อเปลี่ยนความเร็วให้พอดีช่วงเวลา</td></tr>
<tr><td>Track Select Forward</td><td><kbd>A</kbd></td><td>เลือกทุกคลิปที่อยู่ถัดจากจุดที่คลิกไปทางขวา ใช้ย้ายทั้งก้อน</td></tr>
</tbody></table></div>

<h2 id="steps">ขั้นตอนพื้นฐาน</h2>
<ol class="steps">
<li><h3>ตัดคลิป</h3><p>ใช้ Razor คลิกตรงจุดที่จะตัด หรือวาง playhead แล้วกด <kbd>Ctrl</kbd>+<kbd>K</kbd> / <kbd>Cmd</kbd>+<kbd>K</kbd> (Add Edit) ตัดเฉพาะ track ที่เลือกไว้ตรง playhead</p></li>
<li><h3>ลบแบบปกติหรือแบบ ripple</h3><p>เลือกคลิปแล้วกด <kbd>Delete</kbd> จะเหลือช่องว่าง ถ้าอยากให้คลิปถัดไปเลื่อนมาปิด ใช้ <span class="ui">Edit › Ripple Delete</span> (<kbd>Shift</kbd>+<kbd>Delete</kbd> บน Windows, <kbd>Shift</kbd>+<kbd>Forward Delete</kbd> บน Mac) หรือคลิกขวาที่ช่องว่างแล้วเลือก <span class="ui">Ripple Delete</span></p></li>
<li><h3>เล็มหัวท้ายให้กระชับ</h3><p>วาง playhead ตรงจุดที่ต้องการ กด <kbd>Q</kbd> เพื่อตัดส่วนหน้าของคลิปออกถึง playhead หรือ <kbd>W</kbd> ตัดส่วนท้ายออก คลิปที่เหลือเลื่อนมาชิดเอง</p></li>
<li><h3>แยกและรวมภาพกับเสียง</h3><p>คลิปจากกล้องมีภาพกับเสียงผูกกันอยู่ (link) เลือกคลิปแล้วกด <kbd>Ctrl</kbd>+<kbd>L</kbd> / <kbd>Cmd</kbd>+<kbd>L</kbd> เพื่อแยกหรือรวม ถ้าจะแยกชั่วคราว กด <kbd>Alt</kbd> / <kbd>Option</kbd> ค้างตอนคลิก</p></li>
<li><h3>ทำ J-cut และ L-cut</h3><p>ให้เสียงของช็อตถัดไปเริ่มก่อนภาพ (J-cut) หรือเสียงช็อตเดิมยังต่อไปทับภาพใหม่ (L-cut) กด <kbd>Alt</kbd> / <kbd>Option</kbd> ค้างแล้วลากขอบเฉพาะส่วนเสียง การตัดจะดูลื่นขึ้นมาก</p></li>
<li><h3>เปลี่ยนความเร็ว</h3><p>คลิกขวาที่คลิปเลือก <span class="ui">Speed/Duration</span> (<kbd>Ctrl</kbd>+<kbd>R</kbd> / <kbd>Cmd</kbd>+<kbd>R</kbd>) ใส่ % ความเร็ว ถ้าไม่อยากให้เกิดช่องว่าง ติ๊ก Ripple Edit, Shifting Trailing Clips</p></li>
</ol>

<h2 id="keys"><span class="nw">คีย์ลัด</span>ที่ใช้บ่อย</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>ปุ่ม</th><th>ทำอะไร</th></tr></thead>
<tbody>
<tr><td><kbd>Space</kbd></td><td>เล่น / หยุด</td></tr>
<tr><td><kbd>S</kbd></td><td>เปิดปิด Snap ให้คลิปเกาะ playhead marker และขอบคลิปอื่น</td></tr>
<tr><td><kbd>+</kbd> / <kbd>-</kbd></td><td>ซูมเข้าออก timeline</td></tr>
<tr><td><kbd>\</kbd></td><td>ซูมให้เห็นทั้ง sequence</td></tr>
<tr><td><kbd>↑</kbd> / <kbd>↓</kbd></td><td>กระโดดไปจุดตัดก่อนหน้า / ถัดไป</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Cmd</kbd>+<kbd>Z</kbd></td><td>ย้อนกลับ</td></tr>
</tbody></table></div>

<h2 id="mistakes">จุดที่มือใหม่พลาดบ่อย</h2>
<ul class="mist">
<li><b>มีช่องว่างดำเล็ก ๆ ระหว่างคลิป</b>เกิดจากการ Delete ธรรมดา เปิด Snap ไว้ และใช้ Ripple Delete กับช่องว่าง</li>
<li><b>ภาพกับเสียงไม่ตรงกัน</b>เกิดจากลากภาพหรือเสียงแยกกันตอนที่ unlink อยู่ Premiere จะแสดงตัวเลขสีแดงบนคลิปบอกว่าคลาดกันกี่เฟรม คลิกขวาที่ตัวเลขเพื่อดึงกลับให้ตรง</li>
<li><b>Razor ตัดแค่ track เดียว</b>คลิปไม่ได้ link กัน ใช้ <kbd>Shift</kbd> กับ Razor เพื่อตัดทุก track</li>
<li><b>คลิปลงผิด track</b>ดู track targeting และ source patching ทางซ้ายของ timeline</li>
<li><b>ลืมเปลี่ยนกลับเป็น Selection</b>ค้างอยู่ที่ Razor แล้วเผลอคลิกตัดคลิป กด <kbd>V</kbd> ทุกครั้งหลังตัดเสร็จ</li>
</ul>

<template id="t-th-markers">
<p class="crumb">Premiere › พื้นฐาน</p>
<h1>Marker: ปักหมุดบน timeline</h1>
<p class="lead">Marker คือหมุดที่ปักไว้บนเวลา ใช้จดโน้ตว่าต้องแก้อะไร แบ่งตอนของวิดีโอ หรือมาร์กจังหวะเพลงไว้ตัดตาม กด <kbd>M</kbd> ครั้งเดียวก็ปักได้</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>เปิด Markers panel ไว้ด้วย</b> ที่ <span class="ui">Window › Markers</span> จะเห็น marker ทั้งหมดเป็นรายการ ดับเบิลคลิกเพื่อดูรายละเอียด และรุ่นล่าสุดยังแสดงตำแหน่งจุด In/Out ปนอยู่ในรายการด้วย</p></div>
<div class="demo" data-demo="markers"></div>

<h2 id="types">ประเภทของ marker</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>ประเภท</th><th>ใช้ทำอะไร</th><th>ตัวอย่าง</th></tr></thead>
<tbody>
<tr><td>Comment</td><td>จดโน้ตตรงจุดนั้นของ timeline</td><td>"ตัดเสียงไอออก" "ลูกค้าขอเปลี่ยนเพลงตรงนี้"</td></tr>
<tr><td>Chapter</td><td>จุดแบ่งตอนให้คนดูกระโดดไปได้ในวิดีโอที่เสร็จแล้ว</td><td>เปิดเรื่อง วิธีทำ สรุป</td></tr>
<tr><td>Segmentation</td><td>กำหนดช่วงเวลาสำหรับงานอัตโนมัติ เช่น ช่วงพักโฆษณา</td><td>ช่วงโฆษณา 30 วินาที</td></tr>
<tr><td>Web Link</td><td>แนบ URL ที่ให้ข้อมูลเพิ่มเติมของช่วงนั้น</td><td>ลิงก์สินค้าที่พูดถึง</td></tr>
<tr><td>Flash Cue Point</td><td>ข้อมูลเวลาสำหรับงาน Adobe Animate รุ่นเก่า</td><td>มือใหม่ไม่ต้องใช้</td></tr>
</tbody></table></div>

<h2 id="kinds">Clip marker กับ Sequence marker</h2>
<p><b>Clip marker</b> ปักใน Source Monitor จะติดไปกับคลิปนั้น เอาคลิปไปวางที่ไหนก็เห็น marker ตามไปด้วย เหมาะกับการมาร์กช่วงดีในฟุตเทจ</p>
<p><b>Sequence marker</b> ปักใน Program Monitor หรือบน timeline จะอยู่บนเวลาของ sequence เหมาะกับโน้ตงานตัดต่อและ chapter</p>

<h2 id="steps">ขั้นตอน</h2>
<ol class="steps">
<li><h3>วาง playhead แล้วกด M</h3><p>ย้าย playhead ไปจุดที่ต้องการ กด <kbd>M</kbd> หรือคลิกปุ่ม <span class="ui">Add Marker</span> ใต้จอ จะได้ marker บนแถบเวลา</p>
<p class="note">กด <kbd>M</kbd> ระหว่างเล่นเพลงได้เลย ปักตามจังหวะกลองแล้วค่อยตัดคลิปให้ตรงหมุด คลิปจะ snap เข้าหา marker เอง</p></li>
<li><h3>ดับเบิลคลิก marker เพื่อแก้รายละเอียด</h3><p>ตั้งชื่อ ใส่คอมเมนต์ เปลี่ยนสี เลือกประเภท และใส่ Duration ถ้าอยากให้ marker เป็นช่วงเวลาแทนจุดเดียว</p></li>
<li><h3>กระโดดไปมาระหว่าง marker</h3><p>กด <kbd>Shift</kbd>+<kbd>M</kbd> ไป marker ถัดไป และ <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd> / <kbd>Cmd</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd> ย้อนกลับ หรือคลิกในรายการของ Markers panel</p></li>
<li><h3>จัดการหลาย marker พร้อมกัน</h3><p>ใน Markers panel เลือก track item ตั้งแต่สองอันขึ้นไปจะเห็น marker ของทุกอันรวมกัน และลบหลาย marker ที่เลือกได้ในครั้งเดียว</p></li>
</ol>

<h2 id="uses">เอา marker ไปใช้ทำอะไรได้บ้าง</h2>
<ul class="check">
<li><span><b>รับคอมเมนต์จากลูกค้า</b> ปัก Comment ตามจุดที่ต้องแก้ แล้วไล่ทีละหมุดด้วย <kbd>Shift</kbd>+<kbd>M</kbd></span></li>
<li><span><b>ตัดตามจังหวะเพลง</b> ปักตามบีตก่อน แล้วลากคลิปให้ snap กับหมุด</span></li>
<li><span><b>ทำ chapter ให้ YouTube</b> ใช้เวลาของ Chapter marker ไปเขียนเป็นรายการเวลาในคำอธิบายวิดีโอ (ทำตามกติกา chapter ของ YouTube) เดโมด้านบนแสดงตัวอย่างข้อความ</span></li>
<li><span><b>แบ่งช่วงโฆษณา</b> ใช้ Segmentation marker ทำเป็นช่วงเวลา ให้คนรับไฟล์รู้ว่าตรงไหนแทรกโฆษณาได้</span></li>
</ul>

<h2 id="keys"><span class="nw">คีย์ลัด</span></h2>
<div class="tbl"><table class="stack">
<thead><tr><th>ปุ่ม</th><th>ทำอะไร</th></tr></thead>
<tbody>
<tr><td><kbd>M</kbd></td><td>เพิ่ม marker ตรง playhead</td></tr>
<tr><td><kbd>Shift</kbd>+<kbd>M</kbd></td><td>ไป marker ถัดไป</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd> / <kbd>Cmd</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd></td><td>ไป marker ก่อนหน้า</td></tr>
<tr><td>ดับเบิลคลิก marker</td><td>เปิดหน้าต่างแก้ชื่อ คอมเมนต์ สี และประเภท</td></tr>
</tbody></table></div>

<h2 id="mistakes">จุดที่มือใหม่พลาดบ่อย</h2>
<ul class="mist">
<li><b>ปัก marker แล้วหาไม่เจอใน timeline</b>เพราะไปปักใน Source Monitor มันเลยกลายเป็น clip marker อยู่บนคลิป ไม่ใช่บนแถบเวลาของ sequence</li>
<li><b>ลบช่วงใน timeline แล้ว marker ไม่ขยับตาม</b>sequence marker อยู่กับเวลา ไม่ได้อยู่กับคลิป เมื่อ ripple delete ให้เปิดตัวเลือก Ripple Sequence Markers ในเมนู Markers ถ้าต้องการให้ขยับตาม</li>
<li><b>ใช้สีมั่วจนทีมงง</b>ตกลงความหมายของสีในทีมก่อน เช่น แดงคือต้องแก้ เขียวคือผ่าน และตั้งสีเริ่มต้นของ marker ได้ในการตั้งค่า</li>
<li><b>คิดว่า Chapter marker จะไปขึ้นเป็น chapter ใน YouTube เอง</b>YouTube ทำ chapter จากรายการเวลาในคำอธิบายวิดีโอ ต้องคัดลอกไปใส่เอง</li>
</ul>

<template id="t-th-effects-keyframes">
<p class="crumb">Premiere › <span class="nw">เอฟเฟกต์</span>และกราฟิก</p>
<h1>Effects และ Keyframe</h1>
<p class="lead">Effect เปลี่ยนหน้าตาของคลิป เช่น เบลอ บิดภาพ หรือเปลี่ยนสี ส่วน keyframe บอกว่าค่าไหนต้องเปลี่ยนเมื่อไร ใช้สองอย่างนี้คู่กันก็ได้ภาพเคลื่อนไหว เช่น ตัวหนังสือเลื่อนเข้า หรือภาพค่อย ๆ ชัดขึ้น</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>มีของใหม่ให้ลอง:</b> Premiere เพิ่ม<span class="nw">เอฟเฟกต์</span> <span class="nw">ทรานซิชัน</span> และ<span class="nw">แอนิเมชัน</span>แบบใหม่กว่า 90 ตัว ฟรีในโปรแกรม ทุกตัวใช้ GPU จึงเล่นดูได้ทันทีโดยไม่ต้อง render และมีปุ่ม <span class="ui">Surprise Me</span> สุ่มรูปแบบใหม่ให้ทุกครั้งที่กด</p></div>
<div class="demo" data-demo="effects-keyframes"></div>

<h2 id="panels">3 พาเนลที่ต้องรู้จัก</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>พาเนล</th><th>มีไว้ทำอะไร</th><th>เปิดที่</th></tr></thead>
<tbody>
<tr><td>Effects</td><td>คลัง<span class="nw">เอฟเฟกต์</span>และ<span class="nw">ทรานซิชัน</span>ทั้งหมด ค้นหาด้วยชื่อแล้วลากไปใส่คลิป</td><td><span class="ui">Window › Effects</span></td></tr>
<tr><td>Effect Controls</td><td>ปรับค่าของ<span class="nw">เอฟเฟกต์</span>ที่ใส่ในคลิปที่เลือก และสร้าง keyframe</td><td><span class="ui">Window › Effect Controls</span></td></tr>
<tr><td>Properties</td><td>ค่าที่ใช้บ่อยของคลิปที่เลือก เช่น ตำแหน่ง ขนาด ความโปร่งใส ปรับเร็วโดยไม่ต้องเปิดหลายพาเนล</td><td><span class="ui">Window › Properties</span></td></tr>
</tbody></table></div>
<p class="note">ทุกคลิปมี<span class="nw">เอฟเฟกต์</span>พื้นฐานติดมาแล้ว ได้แก่ Motion (ตำแหน่ง ขนาด การหมุน), Opacity และ Time Remapping ไม่ต้องไปหาใน Effects panel</p>

<h2 id="apply">ใส่<span class="nw">เอฟเฟกต์</span></h2>
<ol class="steps">
<li><h3>หา<span class="nw">เอฟเฟกต์</span></h3><p>เปิด Effects panel พิมพ์ชื่อในช่องค้นหา เช่น <span class="ui">Gaussian Blur</span></p></li>
<li><h3>ใส่ลงคลิป</h3><p>ลาก<span class="nw">เอฟเฟกต์</span>ไปวางบนคลิปใน timeline หรือเลือกคลิปก่อนแล้วดับเบิลคลิกที่<span class="nw">เอฟเฟกต์</span></p></li>
<li><h3>ปรับค่า</h3><p>เลือกคลิป แล้วปรับค่าใน Effect Controls คลิกไอคอน <span class="ui">fx</span> หน้าชื่อ<span class="nw">เอฟเฟกต์</span>เพื่อเปิดปิดเทียบก่อนและหลัง</p></li>
<li><h3>เก็บไว้ใช้ซ้ำ</h3><p>คลิกขวาที่ชื่อ<span class="nw">เอฟเฟกต์</span>ใน Effect Controls เลือก <span class="ui">Save Preset</span> หรือก๊อป<span class="nw">เอฟเฟกต์</span>ทั้งหมดไปคลิปอื่นด้วย <span class="ui">Paste Attributes</span> (<kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>V</kbd> / <kbd>Cmd</kbd>+<kbd>Opt</kbd>+<kbd>V</kbd>)</p></li>
</ol>

<h2 id="keyframes">สร้าง keyframe</h2>
<p>keyframe อย่างน้อย 2 ตัวทำให้เกิดการเปลี่ยนแปลง ตัวแรกบอกค่าเริ่ม ตัวที่สองบอกค่าปลายทาง Premiere จะเติมค่าระหว่างกลางให้เอง</p>
<ol class="steps">
<li><h3>เลือกคลิปและเปิด Effect Controls</h3><p>กาง<span class="nw">เอฟเฟกต์</span>ที่จะทำให้เคลื่อนไหว เช่น Motion › Position</p></li>
<li><h3>วาง playhead ที่จุดเริ่ม แล้วกดนาฬิกา</h3><p>คลิกไอคอนนาฬิกา <span class="ui">Toggle Animation</span> หน้าชื่อค่านั้น จะได้ keyframe แรกตรง playhead</p></li>
<li><h3>ย้าย playhead แล้วเปลี่ยนค่า</h3><p>เลื่อน playhead ไปจุดจบ แล้วเปลี่ยนตัวเลข keyframe ตัวที่สองจะถูกสร้างเอง หรือกดปุ่ม <span class="ui">Add/Remove Keyframe</span></p></li>
<li><h3>ดูและแก้ keyframe บน timeline</h3><p>คลิกไอคอนประแจใน timeline เลือก <span class="ui">Show Video Keyframes</span> แล้วเลือกค่าที่จะแสดงจากเมนู<span class="nw">เอฟเฟกต์</span>ข้างชื่อคลิป</p></li>
</ol>

<h2 id="interp">Interpolation: ความเร็วระหว่าง keyframe</h2>
<p>คลิกขวาที่ keyframe ใน Effect Controls หรือ timeline แล้วเลือก <span class="ui">Temporal Interpolation</span> ลองเทียบแต่ละแบบได้ในเดโมด้านบน</p>
<div class="tbl"><table class="stack">
<thead><tr><th>แบบ</th><th>ผลที่ได้</th><th>ใช้เมื่อ</th></tr></thead>
<tbody>
<tr><td>Linear</td><td>เปลี่ยนด้วยความเร็วคงที่ (ค่าเริ่มต้น)</td><td>งานกราฟิกที่ต้องการความเร็วสม่ำเสมอ</td></tr>
<tr><td>Ease In / Ease Out</td><td>ค่อย ๆ ช้าลงตอนเข้า keyframe / ค่อย ๆ เร่งตอนออก</td><td>ทำให้การเคลื่อนไหวดูเป็นธรรมชาติ มือใหม่ใช้แบบนี้บ่อยที่สุด</td></tr>
<tr><td>Bezier</td><td>ดึง handle ปรับโค้งความเร็วได้เอง</td><td>อยากคุมจังหวะละเอียด</td></tr>
<tr><td>Auto Bezier / Continuous Bezier</td><td>โค้งเรียบผ่าน keyframe อัตโนมัติ / แบบที่ยังปรับ handle ได้</td><td>มี keyframe หลายตัวต่อเนื่องกัน</td></tr>
<tr><td>Hold</td><td>ค่าค้างไว้แล้วกระโดดทันทีเมื่อถึง keyframe ถัดไป</td><td><span class="nw">เอฟเฟกต์</span>กระตุก หรือเปลี่ยนแบบตัดฉับ</td></tr>
</tbody></table></div>
<p class="note">Ease In และ Ease Out เป็นโค้ง Bezier อยู่แล้ว จึงเห็นเมนูขึ้นว่า Bezier หลังเลือก ไม่ได้ตั้งผิด</p>

<h2 id="mistakes">จุดที่มือใหม่พลาดบ่อย</h2>
<ul class="mist">
<li><b>กดนาฬิกาซ้ำแล้ว keyframe หายหมด</b>การปิด Toggle Animation จะลบ keyframe ทั้งหมดของค่านั้น ถ้าจะเพิ่ม keyframe ให้ใช้ปุ่ม Add/Remove Keyframe แทน</li>
<li><b>เปลี่ยนค่าแต่ไม่ได้ keyframe ใหม่</b>playhead ยังอยู่ที่ keyframe เดิม ค่าเลยไปแก้ตัวเดิม ย้าย playhead ก่อนเปลี่ยนค่า</li>
<li><b>สับสน Effects กับ Effect Controls</b>Effects คือคลังสำหรับเลือก Effect Controls คือที่ปรับค่า คนละพาเนลกัน</li>
<li><b>ใส่<span class="nw">เอฟเฟกต์</span>หนักหลายตัวแล้วเล่นกระตุก</b>ลด Resolution ของ Program Monitor หรือ render ช่วงนั้นก่อน <span class="nw">เอฟเฟกต์</span>รุ่นใหม่ที่ใช้ GPU จะเล่นได้ลื่นกว่า</li>
<li><b>ตัดคลิปแล้ว<span class="nw">แอนิเมชัน</span>เพี้ยน</b>keyframe ติดอยู่กับคลิป ถ้าตัดช่วงที่มี keyframe ออก ค่าในท่อนที่เหลือจะเปลี่ยนตาม ทำ<span class="nw">แอนิเมชัน</span>หลังตัดต่อเสร็จ</li>
</ul>

<details class="old"><summary>Premiere 25.x–26.x</summary><ul>
<li>การสร้าง keyframe และ interpolation เหมือนเดิมทั้งหมด</li>
<li>ชุด<span class="nw">เอฟเฟกต์</span>และ<span class="nw">ทรานซิชัน</span>รุ่นใหม่ทยอยมาตั้งแต่รุ่น 26.x บางตัวแทนที่ตัวเก่า เช่น Gradient แทน Ramp และ Channel Blur ตัวใหม่แทนตัวเดิม ถ้าหาไม่เจอให้เช็ก<span class="nw">เวอร์ชัน</span></li></ul></details>

<template id="t-th-mogrt">
<p class="crumb">Premiere › <span class="nw">เอฟเฟกต์</span>และกราฟิก</p>
<h1>MOGRT (Motion Graphics Template)</h1>
<p class="lead">ไฟล์ .mogrt คือกราฟิกเคลื่อนไหวสำเร็จรูปที่แก้ได้ เช่น แถบชื่อคนพูด ไตเติลเปิดเรื่อง หรือโลโก้เคลื่อนไหว คนออกแบบทำไว้ครั้งเดียว คนตัดต่อแค่เปลี่ยนข้อความ สี หรือรูป งานทั้งเรื่องจึงหน้าตาไปในทางเดียวกัน</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 2 21 19H1Z" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/><path d="M11 8v5" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="16" r="1.2" fill="var(--acc)"/></svg>
<p><b>ดูคลิปสอนเก่าแล้วหาเมนูไม่เจอ?</b> คลิปเก่ามักใช้แท็บ Browse และ Edit ใน Essential Graphics panel ปัจจุบันหา template ที่พาเนล <span class="ui">Graphics Templates</span> และแก้ค่าใน <span class="ui">Properties</span> panel</p></div>
<div class="demo" data-demo="mogrt"></div>

<h2 id="why">ทำไมต้องใช้ MOGRT</h2>
<ul class="check">
<li><span><b>ใช้ซ้ำได้ทั้งเรื่อง</b> แถบชื่อ 20 คนหน้าตาเหมือนกันหมด แก้แค่ชื่อ</span></li>
<li><span><b>แก้ได้เฉพาะที่คนออกแบบเปิดไว้</b> เช่น ข้อความ สี ตัวเลือก<span class="nw">แอนิเมชัน</span> ส่วนที่เหลือถูกล็อก งานจึงไม่หลุดแบรนด์</span></li>
<li><span><b>ทำของยาก ๆ จาก After Effects ได้</b> template ที่ทำใน After Effects ใส่ particle <span class="nw">เอฟเฟกต์</span>พิเศษ หรือ 3D ได้ คนตัดต่อใช้ใน Premiere โดยไม่ต้องเปิด After Effects เอง</span></li>
<li><span><b>มีแบบพิเศษ</b> เช่น template ที่ดึงข้อมูลจากไฟล์ CSV/TSV มาทำกราฟ และ template ที่เปลี่ยนรูปหรือวิดีโอข้างในได้ (Media Replacement)</span></li>
</ul>

<h2 id="use">ใช้ template ใน Premiere</h2>
<ol class="steps">
<li><h3>เปิด Graphics Templates panel</h3><p>ไปที่ <span class="ui">Window › Graphics Templates</span> แล้วเลือกแท็บ <span class="ui">My Templates</span> จะเห็น template ที่ติดตั้งไว้ รวมถึงชุดที่มากับโปรแกรม</p></li>
<li><h3>ลากลง timeline</h3><p>ลาก template ไปวางบน track วิดีโอที่อยู่เหนือฟุตเทจ เช่น V2</p></li>
<li><h3>แก้ค่าใน Properties panel</h3><p>เลือกคลิป template ใน timeline แล้วดูที่ Properties panel จะมีช่องให้แก้ตามที่คนออกแบบกำหนด เช่น ข้อความ สี ตัวเลือก<span class="nw">แอนิเมชัน</span> และบางตัวแก้ฟอนต์ ขนาด หรือ faux style ได้</p></li>
<li><h3>ปรับความยาว</h3><p>ลากขอบซ้ายหรือขวาของคลิป template ใน timeline เพื่อให้สั้นหรือยาวขึ้น</p></li>
</ol>

<h2 id="install">ติดตั้งไฟล์ .mogrt ที่ได้มา</h2>
<ul class="check">
<li><span>กดปุ่ม <span class="ui">Install Motion Graphics template</span> ใน Graphics Templates panel แล้วเลือกไฟล์ .mogrt</span></li>
<li><span>หา template เพิ่มจาก Adobe Stock ได้จากในโปรแกรม</span></li>
<li><span>ใช้ร่วมกันในทีม: คลิกขวาที่ template เลือก <span class="ui">Copy to Library</span> เพื่อเก็บไว้ใน Creative Cloud Libraries</span></li>
</ul>

<h2 id="make">ทำ template เองใน After Effects (ภาพรวม)</h2>
<ol class="steps">
<li><h3>เปิด workspace สำหรับทำ template</h3><p>ใน After Effects ไปที่ <span class="ui">Window › Workspace › Essential Graphics</span> แล้วเลือก composition หลักใส่ใน Essential Graphics panel</p></li>
<li><h3>ลาก property ที่จะให้แก้ได้</h3><p>ลาก property จาก timeline ไปวางใน Essential Graphics panel เช่น Source Text หรือสีของ shape ทุกอย่างที่ลากมาคือช่องที่คนตัดต่อจะเห็นใน Premiere</p></li>
<li><h3>จัดกลุ่มและตั้งชื่อให้เข้าใจง่าย</h3><p>ใช้เมนู <span class="ui">Add Formatting › Add Group</span> ที่มุมล่างซ้ายของพาเนล เพื่อรวมช่องที่เกี่ยวกันไว้ด้วยกัน</p></li>
<li><h3>Export</h3><p>กด Export Motion Graphics Template ไฟล์ภาพ วิดีโอ และ pre-comp ที่จำเป็นจะถูกแพ็กไปกับ template</p></li>
</ol>
<p class="note">กราฟิกที่สร้างใน Premiere เองก็ export เป็น .mogrt ได้เหมือนกัน เหมาะกับ title ง่าย ๆ ที่ใช้ซ้ำบ่อย</p>

<h2 id="mistakes">จุดที่มือใหม่พลาดบ่อย</h2>
<ul class="mist">
<li><b>ฟอนต์ใน template หาย ตัวหนังสือเพี้ยน</b>เครื่องไม่มีฟอนต์ที่คนออกแบบใช้ ติดตั้งหรือเปิดใช้ฟอนต์นั้นก่อน โดยเฉพาะฟอนต์ไทยที่ไม่ได้มากับระบบ</li>
<li><b>หาช่องแก้ไม่เจอ</b>template แก้ได้เฉพาะช่องที่คนออกแบบเปิดไว้ ถ้าต้องแก้มากกว่านั้นต้องกลับไปแก้ใน After Effects</li>
<li><b>template จาก After Effects เล่นกระตุก</b>ตัวที่ซับซ้อนประมวลผลหนัก ให้ render ช่วงนั้นก่อนดู</li>
<li><b>ยืดความยาวแล้ว<span class="nw">แอนิเมชัน</span>เข้าออกผิดจังหวะ</b>ถ้าคนออกแบบตั้ง Responsive Design ไว้ <span class="nw">แอนิเมชัน</span>ช่วงเข้าและออกจะคงเดิมเมื่อยืด ถ้าไม่ได้ตั้ง ให้ใช้ความยาวใกล้กับค่าเดิม</li>
</ul>

<h2 id="older">ถ้าใช้<span class="nw">เวอร์ชัน</span>เก่า</h2>
<details class="old"><summary>Premiere รุ่นเก่าที่ยังมี Essential Graphics panel</summary><ul>
<li>รุ่นเก่าใช้แท็บ Browse สำหรับหา template และแท็บ Edit สำหรับแก้ค่า ขั้นตอนเหมือนกัน ต่างแค่ที่อยู่ของเมนู</li>
<li>Legacy Titler ถูกยกเลิกไปแล้ว title เก่าควรอัปเกรดเป็น Source Graphics</li></ul></details>

<template id="t-th-object-mask">
<p class="crumb">Premiere › <span class="nw">เอฟเฟกต์</span>และกราฟิก</p>
<h1>Object Mask: เลือกคนหรือวัตถุด้วยคลิกเดียว</h1>
<p class="lead">Object Mask ใช้ AI หาคนหรือวัตถุในภาพให้อัตโนมัติ คลิกครั้งเดียวได้ mask แล้วสั่งให้ mask วิ่งตามวัตถุตลอดช็อต จากนั้นใส่<span class="nw">เอฟเฟกต์</span>เฉพาะในหรือนอก mask ได้ ไม่ต้องไปทำ rotoscope ใน After Effects</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>ใช้ครั้งแรกต้องรอแป๊บหนึ่ง</b> Premiere จะดาวน์โหลดโมเดล AI ก่อน ระหว่างนั้นยังใช้ Object Mask ไม่ได้ ดูความคืบหน้าได้ที่ Progress panel</p></div>
<div class="demo" data-demo="object-mask"></div>

<h2 id="why">เอาไปใช้ทำอะไรได้</h2>
<ul class="check">
<li><span><b>เบลอหน้าคน ทะเบียนรถ หรือโลโก้</b> ที่ไม่ได้รับอนุญาตให้เผยแพร่ ช่วยเรื่องความเป็นส่วนตัวของคนในภาพ</span></li>
<li><span><b>เบลอหรือทำพื้นหลังเป็นขาวดำ</b> ให้คนในภาพเด่นขึ้น โดยใช้ Inverted</span></li>
<li><span><b>ปรับแสงหรือสีเฉพาะคน</b> เช่น หน้ามืดเพราะย้อนแสง ทำให้สว่างขึ้นโดยฉากหลังไม่เปลี่ยน</span></li>
<li><span><b>วางตัวหนังสือไว้หลังคน</b> ทำสำเนาคลิปไว้ track บน เปลี่ยน mask เป็น Opacity Mask แล้ววางตัวหนังสือไว้ระหว่างสอง track</span></li>
</ul>

<h2 id="steps">ขั้นตอน: เบลอพื้นหลังให้คนเด่น</h2>
<ol class="steps">
<li><h3>เลือก Object Mask Tool</h3><p>ในแถบเครื่องมือ (toolbar) กดค้างที่กลุ่มเครื่องมือ mask จะเห็น Object Mask อยู่รวมกับ Ellipse, Rectangle และ Pen</p></li>
<li><h3>ชี้แล้วคลิกที่วัตถุ</h3><p>เลือกคลิปใน timeline แล้วชี้เมาส์ใน Program Monitor วัตถุที่ตรวจเจอจะมีไฮไลต์ขึ้น คลิกเพื่อเลือก</p>
<p class="note">เริ่มจากเฟรมที่เห็นวัตถุชัดที่สุด mask จะออกมาแม่นกว่า</p></li>
<li><h3>ถ้าไม่ไฮไลต์ ให้วาดคร่าว ๆ</h3><p>สลับเป็นโหมด Rectangle หรือ Lasso จากเมนูด้านล่างของ Program Monitor แล้ววาดล้อมวัตถุ ใช้ปุ่ม <span class="ui">+</span> และ <span class="ui">−</span> เพิ่มหรือลบส่วน กด <kbd>Alt</kbd> / <kbd>Option</kbd> ค้างเพื่อสลับชั่วคราว</p></li>
<li><h3>Track ให้ mask วิ่งตาม</h3><p>ใน Effect Controls จะเห็น mask ใหม่อยู่ในส่วน Unassigned Masks ใช้ปุ่ม track ไปข้างหน้าและย้อนหลังเพื่อให้ mask ตามวัตถุทั้งคลิป เลือกคุณภาพได้สองแบบคือ <span class="ui">Faster</span> และ <span class="ui">Better</span></p></li>
<li><h3>ใส่<span class="nw">เอฟเฟกต์</span></h3><p>เปิด Effects panel ลาก <span class="ui">Gaussian Blur</span> ไปใส่คลิป mask จะไปผูกกับ<span class="nw">เอฟเฟกต์</span>นั้นเอง <span class="nw">เอฟเฟกต์</span>จึงมีผลแค่ในพื้นที่ mask</p></li>
<li><h3>กลับด้านและเกลี่ยขอบ</h3><p>ติ๊ก <span class="ui">Inverted</span> เพื่อให้เบลอเฉพาะนอก mask คือพื้นหลัง แล้วปรับ <span class="ui">Feather</span> ให้ขอบนุ่ม และ <span class="ui">Expansion</span> ขยายหรือหด mask</p></li>
<li><h3>ยกเลิกการเลือก mask ก่อนดูผล</h3><p>ระหว่างที่ mask ยังถูกเลือก จะมีสีแดงทับในจอ คลิกที่อื่นใน Effect Controls ก่อนเล่นดูผลจริง</p></li>
</ol>

<h2 id="modes">ตั้งค่าที่ควรรู้</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>ค่า</th><th>ทำอะไร</th><th>ใช้เมื่อ</th></tr></thead>
<tbody>
<tr><td>Sharp / Smooth</td><td>Sharp ให้ขอบคมชัด Smooth ให้ขอบนุ่ม</td><td>ผม ขนสัตว์ ผ้าบาง หรือของกึ่งโปร่งใส ใช้ Smooth</td></tr>
<tr><td>Sharpness</td><td>ปรับว่าขอบนุ่มของโหมด Smooth จะกินเข้ามาแค่ไหน เลือกปรับแบบ S-Curve หรือ Levels</td><td>ดึงเส้นผมที่หลุดกลับมา หรือตัดขอบพื้นหลังที่ติดมา</td></tr>
<tr><td>Feather</td><td>ทำขอบ mask ให้นุ่ม</td><td>ให้<span class="nw">เอฟเฟกต์</span>กลืนกับภาพ</td></tr>
<tr><td>Expansion</td><td>ค่าลบหด mask ค่าบวกขยาย</td><td>mask เล็กหรือใหญ่กว่าวัตถุเล็กน้อย</td></tr>
<tr><td>Opacity</td><td>ความเข้มของ mask</td><td>ลดความแรงของ<span class="nw">เอฟเฟกต์</span></td></tr>
<tr><td>Inverted</td><td>สลับให้<span class="nw">เอฟเฟกต์</span>มีผลนอก mask</td><td>เบลอหรือแต่งพื้นหลัง</td></tr>
</tbody></table></div>

<h2 id="storage">ไฟล์ mask เก็บที่ไหน</h2>
<p>ข้อมูล mask ถูกเก็บในโฟลเดอร์ชื่อ <code>&lt;ชื่อ<span class="nw">โปรเจกต์</span>&gt; Masks</code> ข้างไฟล์<span class="nw">โปรเจกต์</span> ย้าย<span class="nw">โปรเจกต์</span>ไปเครื่องอื่นต้องย้ายโฟลเดอร์นี้ไปด้วย ถ้าหาไม่เจอ Object Mask จะขึ้นว่า offline ใน Effect Controls ให้กด <span class="ui">Locate</span> ชี้ไปที่โฟลเดอร์ mask อื่น ๆ ที่ไม่ใช่ Object Mask ไม่ได้รับผลกระทบ</p>
<p class="note">Premiere ลบไฟล์ mask ที่ไม่ได้ใช้แล้วให้เองเมื่อปิด<span class="nw">โปรเจกต์</span> ช่วยประหยัดพื้นที่ดิสก์</p>

<h2 id="mistakes">จุดที่มือใหม่พลาดบ่อย</h2>
<ul class="mist">
<li><b>ส่ง<span class="nw">โปรเจกต์</span>ให้คนอื่นแล้ว mask หาย</b>ลืมส่งโฟลเดอร์ Masks ไปด้วย</li>
<li><b>เห็นภาพเป็นสีแดง เลยคิดว่า<span class="nw">เอฟเฟกต์</span>ผิด</b>คือ overlay ตอนที่ mask ถูกเลือกอยู่ ยกเลิกการเลือกก่อนดู</li>
<li><b>mask ไม่ตามวัตถุ</b>ยังไม่ได้กด track หรือเริ่ม track จากเฟรมที่วัตถุถูกบัง ลองเริ่มจากเฟรมที่เห็นชัดแล้ว track ทั้งสองทาง</li>
<li><b>mask ไปค้างอยู่ใน Unassigned Masks</b>ยังไม่ได้ใส่<span class="nw">เอฟเฟกต์</span>ให้ mask ลาก<span class="nw">เอฟเฟกต์</span>ลงคลิป หรือใส่<span class="nw">เอฟเฟกต์</span>ไว้ก่อนแล้วค่อยสร้าง mask</li>
<li><b>ขอบผมดูแข็งเป็นก้อน</b>เปลี่ยนเป็นโหมด Smooth แล้วปรับ Sharpness</li>
</ul>

<h2 id="older">ถ้าใช้<span class="nw">เวอร์ชัน</span>เก่ากว่า 27.0</h2>
<details class="old"><summary>ประวัติ<span class="nw">เวอร์ชัน</span>ของ Object Mask</summary><ul>
<li>Object Mask มาครั้งแรกใน Premiere 26.0 (ม.ค. 2569) <span class="nw">เวอร์ชัน</span> 25.x ไม่มีเครื่องมือนี้ ต้องวาด mask ด้วยมือแล้ว track เอง</li>
<li>โหมด Smooth ออกมาทีหลังในช่วงต้นปี 2569 และ 26.5 ตรวจจับวัตถุได้มากขึ้น ขอบแม่นขึ้น</li>
<li>Mac ชิป Intel และ Windows ที่ใช้ไดรเวอร์การ์ดจอ AMD รุ่นเก่า จะใช้โมเดลรุ่นก่อนหน้า และ Premiere 27.0 เลิกรองรับ Mac ชิป Intel แล้ว</li></ul></details>
