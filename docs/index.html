<template id="t-en-monitors">
<p class="crumb">Premiere › Basics</p>
<h1>Source Monitor vs Program Monitor</h1>
<p class="lead">The Source Monitor is where you watch raw clips one at a time and choose the part you want. The Program Monitor shows the sequence you are building. Think of the left screen as your ingredients and the right screen as what the audience will see.</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 2 21 19H1Z" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/><path d="M11 8v5" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="16" r="1.2" fill="var(--acc)"/></svg>
<p><b>Changed in 27.0:</b> Clip Match and the clip Comparison Mode in Edit-mode monitoring have been removed. Comparing shots for colour now happens in Color Mode.</p></div>
<div class="demo" data-demo="monitors"></div>

<h2 id="compare">Side by side</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Topic</th><th>Source Monitor</th><th>Program Monitor</th></tr></thead>
<tbody>
<tr><td>Shows</td><td>A single clip opened from the Project panel or the timeline</td><td>The active sequence in the Timeline panel</td></tr>
<tr><td>In / Out points</td><td>Choose the part of the clip to use</td><td>Choose a range of the sequence to add or remove</td></tr>
<tr><td>Markers</td><td>Clip markers, which travel with the clip</td><td>Sequence markers, which sit on the timeline</td></tr>
<tr><td>Main buttons</td><td><span class="ui">Insert</span> and <span class="ui">Overwrite</span></td><td><span class="ui">Lift</span> and <span class="ui">Extract</span></td></tr>
<tr><td>Use it to</td><td>Pick takes; take only picture or only sound</td><td>Review the edit, position or scale shots, place graphics</td></tr>
</tbody></table></div>
<p class="note">Both monitors have an <span class="ui">Export Frame</span> button for saving a still from the current frame.</p>

<h2 id="steps">Steps: from Source to timeline</h2>
<ol class="steps">
<li><h3>Open a clip in the Source Monitor</h3><p>Double-click a clip in the Project panel. It opens in the Source Monitor without being added to the sequence.</p></li>
<li><h3>Mark the part you want</h3><p>Play to the start, press <kbd>I</kbd> for an In point, play to the end and press <kbd>O</kbd> for an Out point. Everything between them is what gets placed.</p></li>
<li><h3>Choose picture, sound or both</h3><p>To take only one, drag the <span class="ui">Drag video</span> or <span class="ui">Drag audio</span> icon under the monitor into the timeline.</p></li>
<li><h3>Park the playhead in the timeline</h3><p>Move the playhead to where the clip should go, and check that the right tracks are targeted.</p></li>
<li><h3>Press Insert or Overwrite</h3>
<ul><li><span class="ui">Insert</span> <kbd>,</kbd> adds the clip at the playhead and pushes everything after it to the right. The sequence gets longer.</li>
<li><span class="ui">Overwrite</span> <kbd>.</kbd> lays the clip over what is already there. The sequence doesn't grow if there was material under it.</li></ul></li>
<li><h3>Review and trim in the Program Monitor</h3><p>Set In and Out in the Program Monitor, then press <span class="ui">Lift</span> <kbd>;</kbd> to remove the range and leave a gap, or <span class="ui">Extract</span> <kbd>'</kbd> to remove it and close the gap.</p></li>
</ol>

<h2 id="keys">Useful shortcuts</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Key</th><th>What it does</th></tr></thead>
<tbody>
<tr><td><kbd>I</kbd> / <kbd>O</kbd></td><td>Set In / Out in the active monitor</td></tr>
<tr><td><kbd>,</kbd></td><td>Insert from Source into the timeline</td></tr>
<tr><td><kbd>.</kbd></td><td>Overwrite from Source into the timeline</td></tr>
<tr><td><kbd>;</kbd> / <kbd>'</kbd></td><td>Lift / Extract the In–Out range in the sequence</td></tr>
<tr><td><kbd>J</kbd> <kbd>K</kbd> <kbd>L</kbd></td><td>Play backwards / stop / play forwards; press again to go faster</td></tr>
<tr><td><kbd>F</kbd></td><td>Match Frame: opens the source clip of the frame under the playhead in the Source Monitor</td></tr>
</tbody></table></div>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>Overwrite wiped out a clip</b>Overwrite really does replace what is there. Undo with <kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Cmd</kbd>+<kbd>Z</kbd> and use Insert if you meant to add.</li>
<li><b>Insert knocked audio out of sync</b>Tracks with Sync Lock turned off don't shift with the insert. Turn Sync Lock on for every track that should move together.</li>
<li><b>The clip landed on the wrong track</b>Check source patching and track targeting on the left of the timeline.</li>
<li><b>The Program Monitor looks soft, so the file seems broken</b>Its Resolution may be set to 1/2 or 1/4 for smoother playback. Your export is not affected.</li>
<li><b>A marker went to the wrong place</b>Markers added in the Source Monitor stick to the clip. For a marker on the timeline, add it in the Program Monitor or the timeline.</li>
</ul>

<h2 id="older">Using a version older than 27.0</h2>
<details class="old"><summary>Premiere 26.x and earlier</summary><ul>
<li>The Program Monitor still has Comparison mode and Clip Match for comparing colour between shots. 27.0 moved that job to Color Mode.</li>
<li>Insert, Overwrite, Lift and Extract buttons and shortcuts work the same.</li></ul></details>

<h2 id="sources">Sources</h2>
<ul class="src">
<li><a href="https://helpx.adobe.com/premiere-pro/using/source-monitor-program-monitor.html">Overview of Source Monitor and Program Monitor</a></li>
<li><a href="https://helpx.adobe.com/premiere/desktop/correct-color/color-mode-fundamentals/color-mode-basics.html">Color Mode in Premiere (Changes to Lumetri Color)</a></li>
</ul>
</template>
<template id="t-en-timeline">
<p class="crumb">Premiere › Basics</p>
<h1>Editing in the Timeline</h1>
<p class="lead">The Timeline holds your picture on video tracks (V1, V2 …) and your sound on audio tracks (A1, A2 …). You only need a handful of tools day to day: cutting, deleting, rippling, and separating picture from sound cover most edits.</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>Good to know:</b> since 26.3, a Timeline preference controls whether Premiere adds tracks automatically when you edit clips into a sequence. If tracks keep multiplying, check that setting.</p></div>
<div class="demo" data-demo="timeline"></div>

<h2 id="tools">The tools you'll use most</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Tool</th><th>Key</th><th>What it does</th></tr></thead>
<tbody>
<tr><td>Selection</td><td><kbd>V</kbd></td><td>Select, drag and move clips. You'll be on this most of the time.</td></tr>
<tr><td>Razor</td><td><kbd>C</kbd></td><td>Cuts a clip in two where you click. Hold <kbd>Shift</kbd> to cut every track at once.</td></tr>
<tr><td>Ripple Edit</td><td><kbd>B</kbd></td><td>Drag a clip edge to shorten or lengthen it; later clips move with it, so no gap appears.</td></tr>
<tr><td>Rolling Edit</td><td><kbd>N</kbd></td><td>Moves the cut point between two clips without changing the total length.</td></tr>
<tr><td>Rate Stretch</td><td><kbd>R</kbd></td><td>Drag a clip edge to change its speed so it fits a length.</td></tr>
<tr><td>Track Select Forward</td><td><kbd>A</kbd></td><td>Selects every clip to the right of where you click, for moving a whole block.</td></tr>
</tbody></table></div>

<h2 id="steps">The basics</h2>
<ol class="steps">
<li><h3>Cut a clip</h3><p>Click with the Razor where you want the cut, or park the playhead and press <kbd>Ctrl</kbd>+<kbd>K</kbd> / <kbd>Cmd</kbd>+<kbd>K</kbd> (Add Edit) to cut the targeted tracks at the playhead.</p></li>
<li><h3>Delete, or ripple delete</h3><p>Select a clip and press <kbd>Delete</kbd> to leave a gap. To have the following clips slide over and close it, use <span class="ui">Edit › Ripple Delete</span> (<kbd>Shift</kbd>+<kbd>Delete</kbd> on Windows, <kbd>Shift</kbd>+<kbd>Forward Delete</kbd> on Mac), or right-click the gap and choose <span class="ui">Ripple Delete</span>.</p></li>
<li><h3>Trim heads and tails fast</h3><p>Park the playhead, then press <kbd>Q</kbd> to remove the part of the clip before it, or <kbd>W</kbd> to remove the part after it. The rest closes up automatically.</p></li>
<li><h3>Separate and rejoin picture and sound</h3><p>Camera clips have linked picture and sound. Select a clip and press <kbd>Ctrl</kbd>+<kbd>L</kbd> / <kbd>Cmd</kbd>+<kbd>L</kbd> to unlink or relink them. Hold <kbd>Alt</kbd> / <kbd>Option</kbd> while clicking to unlink just for that action.</p></li>
<li><h3>Make J-cuts and L-cuts</h3><p>Let the next shot's sound start before its picture (J-cut), or let the current shot's sound carry on over the new picture (L-cut). Hold <kbd>Alt</kbd> / <kbd>Option</kbd> and drag only the audio edge. Edits feel much smoother.</p></li>
<li><h3>Change speed</h3><p>Right-click a clip and choose <span class="ui">Speed/Duration</span> (<kbd>Ctrl</kbd>+<kbd>R</kbd> / <kbd>Cmd</kbd>+<kbd>R</kbd>), then enter a percentage. Tick Ripple Edit, Shifting Trailing Clips to avoid leaving a gap.</p></li>
</ol>

<h2 id="keys">Useful shortcuts</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Key</th><th>What it does</th></tr></thead>
<tbody>
<tr><td><kbd>Space</kbd></td><td>Play / stop</td></tr>
<tr><td><kbd>S</kbd></td><td>Toggle snapping to the playhead, markers and clip edges</td></tr>
<tr><td><kbd>+</kbd> / <kbd>-</kbd></td><td>Zoom the timeline in and out</td></tr>
<tr><td><kbd>\</kbd></td><td>Zoom to show the whole sequence</td></tr>
<tr><td><kbd>↑</kbd> / <kbd>↓</kbd></td><td>Jump to the previous / next edit point</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Cmd</kbd>+<kbd>Z</kbd></td><td>Undo</td></tr>
</tbody></table></div>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>Tiny black gaps between clips</b>Left by plain Delete. Keep snapping on and ripple delete the gaps.</li>
<li><b>Picture and sound out of sync</b>Caused by dragging one without the other while unlinked. Premiere shows red numbers on the clip with the offset; right-click them to pull it back into sync.</li>
<li><b>The Razor cut only one track</b>The clips weren't linked. Hold <kbd>Shift</kbd> with the Razor to cut all tracks.</li>
<li><b>Clips land on the wrong track</b>Check track targeting and source patching on the left of the timeline.</li>
<li><b>Forgetting to switch back to Selection</b>You stay on the Razor and slice a clip by accident. Press <kbd>V</kbd> after every cut.</li>
</ul>

<h2 id="older">Using a version older than 27.0</h2>
<details class="old"><summary>Premiere 25.x–26.x</summary><ul>
<li>The tools and shortcuts are the same.</li>
<li>The Timeline preference for automatic track creation arrived in 26.3.</li></ul></details>

<h2 id="sources">Sources</h2>
<ul class="src">
<li><a href="https://helpx.adobe.com/mena_en/premiere-pro/using/default-keyboard-shortcuts.html">Default keyboard shortcuts in Premiere</a></li>
<li><a href="https://helpx.adobe.com/sa_en/premiere/desktop/whats-new/release-notes.html">Adobe Premiere desktop release notes</a></li>
</ul>

<template id="t-en-markers">
<p class="crumb">Premiere › Basics</p>
<h1>Markers: pins on your timeline</h1>
<p class="lead">A marker is a pin on a point in time. Use markers to note what needs fixing, split a video into chapters, or tap out the beat of a song to cut to. One press of <kbd>M</kbd> adds one.</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>Keep the Markers panel open.</b> <span class="ui">Window › Markers</span> lists every marker; double-click one to see its details. The latest version also shows where the In and Out points fall among the markers.</p></div>
<div class="demo" data-demo="markers"></div>

<h2 id="types">Marker types</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Type</th><th>What it is for</th><th>Example</th></tr></thead>
<tbody>
<tr><td>Comment</td><td>A note at that point in the timeline</td><td>"Cut the cough" or "Client wants a different song here"</td></tr>
<tr><td>Chapter</td><td>Navigation points viewers can jump to in the finished video</td><td>Intro, how it works, wrap-up</td></tr>
<tr><td>Segmentation</td><td>Ranges for automated workflows, such as commercial breaks</td><td>A 30-second ad break</td></tr>
<tr><td>Web Link</td><td>Attaches a URL with more information about that part</td><td>A link to the product being discussed</td></tr>
<tr><td>Flash Cue Point</td><td>Timed metadata for older Adobe Animate projects</td><td>Beginners can ignore it</td></tr>
</tbody></table></div>

<h2 id="kinds">Clip markers vs sequence markers</h2>
<p><b>Clip markers</b> are added in the Source Monitor and stay with the clip wherever you place it. They are good for flagging the best moments in your footage.</p>
<p><b>Sequence markers</b> are added in the Program Monitor or on the timeline and sit on the sequence's time. Use them for edit notes and chapters.</p>

<h2 id="steps">Steps</h2>
<ol class="steps">
<li><h3>Park the playhead and press M</h3><p>Move the playhead where you want the marker, then press <kbd>M</kbd> or click <span class="ui">Add Marker</span> under the monitor.</p>
<p class="note">You can press <kbd>M</kbd> while a song plays to tap out the beat, then cut clips to the pins. Clips snap to markers.</p></li>
<li><h3>Double-click a marker to edit it</h3><p>Give it a name, add a comment, change its colour or type, and set a Duration if you want a range rather than a single point.</p></li>
<li><h3>Jump between markers</h3><p>Press <kbd>Shift</kbd>+<kbd>M</kbd> for the next marker and <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd> / <kbd>Cmd</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd> for the previous one, or click an entry in the Markers panel.</p></li>
<li><h3>Handle many markers at once</h3><p>In the Markers panel, selecting two or more track items shows all their markers together, and you can delete several selected markers in one go.</p></li>
</ol>

<h2 id="uses">What markers are good for</h2>
<ul class="check">
<li><span><b>Client feedback.</b> Drop a Comment at each fix, then work through them with <kbd>Shift</kbd>+<kbd>M</kbd>.</span></li>
<li><span><b>Cutting to music.</b> Mark the beats first, then drag clips so they snap to the pins.</span></li>
<li><span><b>YouTube chapters.</b> Copy the times of your Chapter markers into the video description as a list of timestamps (following YouTube's chapter rules). The demo above shows the kind of text you'd paste.</span></li>
<li><span><b>Ad breaks.</b> Use Segmentation markers as ranges so whoever receives the file knows where ads can go.</span></li>
</ul>

<h2 id="keys">Shortcuts</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Key</th><th>What it does</th></tr></thead>
<tbody>
<tr><td><kbd>M</kbd></td><td>Add a marker at the playhead</td></tr>
<tr><td><kbd>Shift</kbd>+<kbd>M</kbd></td><td>Go to the next marker</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd> / <kbd>Cmd</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd></td><td>Go to the previous marker</td></tr>
<tr><td>Double-click a marker</td><td>Edit its name, comment, colour and type</td></tr>
</tbody></table></div>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>The marker isn't on the timeline</b>It was added in the Source Monitor, so it became a clip marker on the clip rather than a pin on the sequence.</li>
<li><b>Deleting a section leaves markers behind</b>Sequence markers belong to time, not clips. Turn on Ripple Sequence Markers in the Markers menu if you want them to move with ripple edits.</li>
<li><b>Colours mean different things to different people</b>Agree on meanings with your team (red to fix, green approved, for example). You can also set default marker colours.</li>
<li><b>Expecting Chapter markers to become YouTube chapters on their own</b>YouTube builds chapters from timestamps in the description, so you need to paste them in.</li>
</ul>

<h2 id="older">Using a version older than 27.0</h2>
<details class="old"><summary>Premiere 25.x–26.x</summary><ul>
<li>Adding and editing markers works the same.</li>
<li>Older Markers panels may lack filters and won't show In/Out points in the list.</li></ul></details>

<h2 id="sources">Sources</h2>
<ul class="src">
<li><a href="https://helpx.adobe.com/premiere-pro/using/markers.html">Overview of markers</a></li>
<li><a href="https://helpx.adobe.com/premiere-pro/using/source-monitor-program-monitor.html">Overview of Source Monitor and Program Monitor</a></li>
</ul>
</template>
<template id="t-en-effects-keyframes">
<p class="crumb">Premiere › Effects and graphics</p>
<h1>Effects and keyframes</h1>
<p class="lead">An effect changes how a clip looks, such as a blur, a distortion or a colour shift. A keyframe says when a value should change. Together they make things move: a title sliding in, or a shot slowly coming into focus.</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>New to try:</b> Premiere now includes more than 90 modern effects, transitions and animations at no extra cost. All of them are GPU-accelerated, so they play back in real time without rendering, and a <span class="ui">Surprise Me</span> button generates a new variation each time you click it.</p></div>
<div class="demo" data-demo="effects-keyframes"></div>

<h2 id="panels">Three panels to know</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Panel</th><th>What it is for</th><th>Open it from</th></tr></thead>
<tbody>
<tr><td>Effects</td><td>The library of effects and transitions. Search by name and drag onto a clip.</td><td><span class="ui">Window › Effects</span></td></tr>
<tr><td>Effect Controls</td><td>Adjusts the effects on the selected clip and creates keyframes</td><td><span class="ui">Window › Effect Controls</span></td></tr>
<tr><td>Properties</td><td>Common settings for the selected clip, such as position, scale and opacity, in one place</td><td><span class="ui">Window › Properties</span></td></tr>
</tbody></table></div>
<p class="note">Every clip already has the built-in Motion (position, scale, rotation), Opacity and Time Remapping effects. You don't need to find them in the Effects panel.</p>

<h2 id="apply">Adding an effect</h2>
<ol class="steps">
<li><h3>Find the effect</h3><p>Open the Effects panel and type its name, such as <span class="ui">Gaussian Blur</span>.</p></li>
<li><h3>Apply it</h3><p>Drag it onto a clip in the timeline, or select the clip first and double-click the effect.</p></li>
<li><h3>Adjust it</h3><p>Select the clip and change values in Effect Controls. Click the <span class="ui">fx</span> icon next to the effect name to toggle it and compare before and after.</p></li>
<li><h3>Reuse it</h3><p>Right-click the effect name in Effect Controls and choose <span class="ui">Save Preset</span>, or copy all effects to another clip with <span class="ui">Paste Attributes</span> (<kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>V</kbd> / <kbd>Cmd</kbd>+<kbd>Opt</kbd>+<kbd>V</kbd>).</p></li>
</ol>

<h2 id="keyframes">Creating keyframes</h2>
<p>You need at least two keyframes for a change: the first holds the starting value, the second the end value. Premiere fills in everything between them.</p>
<ol class="steps">
<li><h3>Select the clip and open Effect Controls</h3><p>Expand the effect you want to animate, for example Motion › Position.</p></li>
<li><h3>Park the playhead at the start and click the stopwatch</h3><p>Click the <span class="ui">Toggle Animation</span> stopwatch next to the property. That creates the first keyframe at the playhead.</p></li>
<li><h3>Move the playhead and change the value</h3><p>Move to the end point and type a new value; the second keyframe is created for you. You can also click <span class="ui">Add/Remove Keyframe</span>.</p></li>
<li><h3>See and edit keyframes in the timeline</h3><p>Click the wrench icon in the timeline and choose <span class="ui">Show Video Keyframes</span>, then pick the property from the effect menu next to the clip name.</p></li>
</ol>

<h2 id="interp">Interpolation: the speed between keyframes</h2>
<p>Right-click a keyframe in Effect Controls or the timeline and choose <span class="ui">Temporal Interpolation</span>. Compare the types in the demo above.</p>
<div class="tbl"><table class="stack">
<thead><tr><th>Type</th><th>What happens</th><th>Use it for</th></tr></thead>
<tbody>
<tr><td>Linear</td><td>Changes at a constant speed (the default)</td><td>Graphics that should move evenly</td></tr>
<tr><td>Ease In / Ease Out</td><td>Slows down into a keyframe / speeds up out of it</td><td>Natural-looking motion; the one beginners use most</td></tr>
<tr><td>Bezier</td><td>Drag handles to shape the speed curve yourself</td><td>Precise control of timing</td></tr>
<tr><td>Auto Bezier / Continuous Bezier</td><td>A smooth curve through the keyframe, automatic / with adjustable handles</td><td>Several keyframes in a row</td></tr>
<tr><td>Hold</td><td>Keeps the value, then jumps at the next keyframe</td><td>Stepped or sudden changes</td></tr>
</tbody></table></div>
<p class="note">Ease In and Ease Out are Bezier curves, so the menu shows Bezier after you pick them. You didn't do anything wrong.</p>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>Clicking the stopwatch again deleted every keyframe</b>Turning Toggle Animation off removes all keyframes for that property. Use Add/Remove Keyframe to add more.</li>
<li><b>Changing a value didn't make a new keyframe</b>The playhead was still on the old keyframe, so you edited it. Move the playhead first.</li>
<li><b>Mixing up Effects and Effect Controls</b>Effects is where you choose; Effect Controls is where you adjust. They are different panels.</li>
<li><b>Several heavy effects make playback stutter</b>Lower the Program Monitor's Resolution or render that section. The new GPU-accelerated effects play back more smoothly.</li>
<li><b>Trimming a clip broke the animation</b>Keyframes live on the clip; trimming away part of the animation changes what is left. Animate after the edit is locked.</li>
</ul>

<h2 id="older">Using a version older than 27.0</h2>
<details class="old"><summary>Premiere 25.x–26.x</summary><ul>
<li>Keyframes and interpolation work the same.</li>
<li>The modern effects and transitions arrived during 26.x, and some replace older ones (Gradient replaces Ramp, for example, and a new Channel Blur replaces the legacy one). If you can't find one, check your version.</li></ul></details>

<h2 id="sources">Sources</h2>
<ul class="src">
<li><a href="https://helpx.adobe.com/premiere-pro/using/adding-navigating-setting-keyframes.html">Add keyframes</a></li>
<li><a href="https://helpx.adobe.com/premiere/desktop/add-video-effects/control-effects-and-transitions-using-keyframes/control-effect-changes-using-bezier-keyframe-interpolation.html">Control change using Bezier keyframe interpolation</a></li>
<li><a href="https://helpx.adobe.com/ie/premiere/desktop/add-video-effects/types-of-effects/effects.html">Modern effects in Premiere</a></li>
</ul>
</template>
<template id="t-en-mogrt">
<p class="crumb">Premiere › Effects and graphics</p>
<h1>MOGRT (Motion Graphics templates)</h1>
<p class="lead">A .mogrt file is a ready-made, editable motion graphic: a lower third, an opening title, an animated logo. A designer builds it once; editors just change the text, colours or images, so the whole project stays consistent.</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 2 21 19H1Z" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/><path d="M11 8v5" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="16" r="1.2" fill="var(--acc)"/></svg>
<p><b>Can't find the menus from an older tutorial?</b> Older videos use the Browse and Edit tabs of the Essential Graphics panel. Today you find templates in the <span class="ui">Graphics Templates</span> panel and edit them in the <span class="ui">Properties</span> panel.</p></div>
<div class="demo" data-demo="mogrt"></div>

<h2 id="why">Why use MOGRTs</h2>
<ul class="check">
<li><span><b>Reuse across a whole project.</b> Twenty name straps that all look the same; only the names change.</span></li>
<li><span><b>Editors change only what the designer exposed,</b> such as text, colours or animation options. Everything else is locked, so the brand stays intact.</span></li>
<li><span><b>Bring in complex After Effects work.</b> Templates built in After Effects can include particles, special effects and 3D, and editors use them in Premiere without opening After Effects themselves.</span></li>
<li><span><b>Special kinds exist,</b> such as data-driven templates that build charts from CSV/TSV files, and templates whose images or videos can be swapped (Media Replacement).</span></li>
</ul>

<h2 id="use">Using a template in Premiere</h2>
<ol class="steps">
<li><h3>Open the Graphics Templates panel</h3><p>Choose <span class="ui">Window › Graphics Templates</span> and go to the <span class="ui">My Templates</span> tab to see installed templates, including the ones that come with Premiere.</p></li>
<li><h3>Drag it into the timeline</h3><p>Drop the template on a video track above your footage, such as V2.</p></li>
<li><h3>Edit it in the Properties panel</h3><p>Select the template clip in the timeline and look at the Properties panel. You'll see the fields the designer set up: text, colour, animation options, and on some templates fonts, size or faux styles.</p></li>
<li><h3>Change its length</h3><p>Drag the left or right edge of the template clip in the timeline to shorten or lengthen it.</p></li>
</ol>

<h2 id="install">Installing a .mogrt file</h2>
<ul class="check">
<li><span>Click <span class="ui">Install Motion Graphics template</span> in the Graphics Templates panel and choose the .mogrt file.</span></li>
<li><span>Find more templates from Adobe Stock inside the app.</span></li>
<li><span>To share with a team, right-click a template and choose <span class="ui">Copy to Library</span> to keep it in Creative Cloud Libraries.</span></li>
</ul>

<h2 id="make">Making your own in After Effects (overview)</h2>
<ol class="steps">
<li><h3>Open the template workspace</h3><p>In After Effects, choose <span class="ui">Window › Workspace › Essential Graphics</span> and add your main composition to the Essential Graphics panel.</p></li>
<li><h3>Drag in the properties editors may change</h3><p>Drag properties from the timeline into the Essential Graphics panel, such as Source Text or a shape's colour. Everything you add becomes a field editors see in Premiere.</p></li>
<li><h3>Group and name fields clearly</h3><p>Use <span class="ui">Add Formatting › Add Group</span> at the lower left of the panel to keep related fields together.</p></li>
<li><h3>Export</h3><p>Export the Motion Graphics template. The images, videos and pre-comps it needs are packaged with it.</p></li>
</ol>
<p class="note">Graphics made in Premiere can be exported as .mogrt files too, which suits simple titles you reuse often.</p>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>Fonts are missing and the text looks wrong</b>Your computer doesn't have the designer's font. Install or activate it first, especially Thai fonts that don't ship with the system.</li>
<li><b>Can't find the field to change</b>You can only edit what the designer exposed. Anything else has to be changed in After Effects.</li>
<li><b>An After Effects template plays back choppy</b>Complex templates are heavy to process. Render that section before reviewing.</li>
<li><b>Stretching it throws off the in and out animations</b>If the designer used Responsive Design, the intro and outro keep their timing when you stretch it. If not, keep close to the original length.</li>
</ul>

<h2 id="older">Using an older version</h2>
<details class="old"><summary>Premiere versions with the Essential Graphics panel</summary><ul>
<li>Older versions use the Browse tab to find templates and the Edit tab to change them. The workflow is the same; only the menus moved.</li>
<li>The Legacy Titler has been retired; upgrade old titles to Source Graphics.</li></ul></details>

<h2 id="sources">Sources</h2>
<ul class="src">
<li><a href="https://helpx.adobe.com/premiere/desktop/add-text-images/use-motion-graphics-templates/customize-motion-graphics-templates.html">Customize Motion Graphics templates</a></li>
<li><a href="https://helpx.adobe.com/premiere/desktop/add-text-images/use-motion-graphics-templates/organize-motion-graphics-templates.html">Organize Motion Graphics templates</a></li>
<li><a href="https://helpx.adobe.com/after-effects/using/creating-motion-graphics-templates.html">Work with Motion Graphics templates in After Effects</a></li>
</ul>
</template>
<template id="t-en-object-mask">
<p class="crumb">Premiere › Effects and graphics</p>
<h1>Object Mask: select a person or object in one click</h1>
<p class="lead">Object Mask uses AI to find people and objects in your shot. One click gives you a mask, tracking keeps it on the subject through the shot, and then you apply effects inside or outside it. No rotoscoping in After Effects.</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>The first use takes a moment.</b> Premiere downloads its AI models first and Object Masking is unavailable until they finish. Watch progress in the Progress panel.</p></div>
<div class="demo" data-demo="object-mask"></div>

<h2 id="why">What it is good for</h2>
<ul class="check">
<li><span><b>Blurring faces, licence plates or logos</b> you don't have permission to show, which protects people's privacy.</span></li>
<li><span><b>Blurring the background or making it black and white</b> so the subject stands out, using Inverted.</span></li>
<li><span><b>Fixing light or colour on the subject only,</b> such as a backlit face, without touching the background.</span></li>
<li><span><b>Putting text behind a person.</b> Duplicate the clip onto a higher track, change its mask to an Opacity Mask, and place the text between the two tracks.</span></li>
</ul>

<h2 id="steps">Steps: blur the background behind a person</h2>
<ol class="steps">
<li><h3>Choose the Object Mask Tool</h3><p>In the toolbar, click and hold the mask tools group. Object Mask sits with the Ellipse, Rectangle and Pen tools.</p></li>
<li><h3>Hover, then click the subject</h3><p>Select the clip in the timeline and move the pointer over the Program Monitor. Detected objects highlight; click to select one.</p>
<p class="note">Start from the frame where the subject is most clearly visible for the best mask.</p></li>
<li><h3>If nothing highlights, draw roughly</h3><p>Switch to Rectangle or Lasso from the menu at the bottom of the Program Monitor and draw around the subject. Use the <span class="ui">+</span> and <span class="ui">−</span> buttons to add or subtract parts; hold <kbd>Alt</kbd> / <kbd>Option</kbd> to switch temporarily.</p></li>
<li><h3>Track the mask</h3><p>The new mask appears under Unassigned Masks in Effect Controls. Use the forward and backward track buttons so it follows the subject through the clip. Tracking quality can be <span class="ui">Faster</span> or <span class="ui">Better</span>.</p></li>
<li><h3>Add the effect</h3><p>Open the Effects panel and drag <span class="ui">Gaussian Blur</span> onto the clip. The mask attaches to that effect, so the blur applies only inside the mask.</p></li>
<li><h3>Invert and soften</h3><p>Tick <span class="ui">Inverted</span> to blur everything outside the mask, the background. Then adjust <span class="ui">Feather</span> for softer edges and <span class="ui">Expansion</span> to grow or shrink the mask.</p></li>
<li><h3>Deselect the mask before reviewing</h3><p>While the mask is selected you see a red overlay. Click elsewhere in Effect Controls before playing back.</p></li>
</ol>

<h2 id="modes">Settings worth knowing</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Setting</th><th>What it does</th><th>Use it when</th></tr></thead>
<tbody>
<tr><td>Sharp / Smooth</td><td>Sharp gives crisp edges; Smooth gives soft edges</td><td>Use Smooth for hair, fur, thin fabric or semi-transparent things</td></tr>
<tr><td>Sharpness</td><td>How much of Smooth mode's soft fringe is kept, adjusted with S-Curve or Levels</td><td>Recovering flyaway hair, or trimming background that crept in</td></tr>
<tr><td>Feather</td><td>Softens the mask edge</td><td>Blending the effect into the shot</td></tr>
<tr><td>Expansion</td><td>Negative values shrink the mask; positive values grow it</td><td>The mask is slightly too small or too big</td></tr>
<tr><td>Opacity</td><td>How strong the mask is</td><td>Toning the effect down</td></tr>
<tr><td>Inverted</td><td>Applies the effect outside the mask instead</td><td>Blurring or grading the background</td></tr>
</tbody></table></div>

<h2 id="storage">Where mask files live</h2>
<p>Mask data is saved in a folder named <code>&lt;Project Name&gt; Masks</code> next to the project file. Move that folder whenever you move the project. If Premiere can't find it, Object Masks show as offline in Effect Controls; click <span class="ui">Locate</span> and point to the folder. Other kinds of masks are not affected.</p>
<p class="note">Premiere removes unused Object Mask files when you close the project, which saves disk space.</p>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>Masks disappear when someone else opens the project</b>The Masks folder wasn't sent with it.</li>
<li><b>The picture turns red, so the effect seems wrong</b>That is the overlay shown while the mask is selected. Deselect it first.</li>
<li><b>The mask doesn't follow the subject</b>It hasn't been tracked, or tracking started on a frame where the subject is blocked. Start from a clear frame and track in both directions.</li>
<li><b>The mask is stuck under Unassigned Masks</b>It isn't attached to an effect yet. Drag an effect onto the clip, or apply the effect first and then create the mask.</li>
<li><b>Hair edges look blocky</b>Switch to Smooth mode and adjust Sharpness.</li>
</ul>

<h2 id="older">Using a version older than 27.0</h2>
<details class="old"><summary>Object Mask version history</summary><ul>
<li>Object Mask first shipped in Premiere 26.0 (January 2026). 25.x doesn't have it; you draw masks by hand and track them.</li>
<li>Smooth mode arrived later in early 2026, and 26.5 detects more objects with more accurate edges.</li>
<li>Intel Macs and Windows PCs with older AMD graphics drivers fall back to the previous model, and Premiere 27.0 no longer supports Intel Macs.</li></ul></details>

<h2 id="sources">Sources</h2>
<ul class="src">
<li><a href="https://helpx.adobe.com/premiere/desktop/add-video-effects/work-with-masks/object-masking.html">Object masking in Premiere</a></li>
<li><a href="https://www.adobe.com/learn/premiere-pro/web/track-mask-blur-effect">Track a mask and blur a face (Adobe tutorial)</a></li>
</ul>
</template>
<template id="t-en-color-mode">
<p class="crumb">Premiere › Color, audio and captions</p>
<h1>Color grading with Color Mode</h1>
<p class="lead">Fix clips that look too dark, flat or tinted, using Premiere's new grading workspace: open Color Mode, pick a clip, then adjust one value at a time in order.</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 2 21 19H1Z" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/><path d="M11 8v5" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="16" r="1.2" fill="var(--acc)"/></svg>
<p><b>Following a tutorial that uses the Lumetri Color panel?</b> Premiere 27.0 retires that panel. The Lumetri Color <i>effect</i> is still there and older projects graded with Lumetri open as before, but for new work use Color Mode as shown here.</p></div>
<div class="demo" data-demo="color-mode"></div>

<h2 id="before">Before you start</h2>
<ul class="check">
<li><span>Use <b>Premiere 27.0</b> or later. Check under About Premiere (Help menu on Windows, Premiere menu on Mac).</span></li>
<li><span>Finish the edit first, so you don't grade clips that get cut later.</span></li>
<li><span><b>Set the sequence's Color Management before grading.</b> The default is Direct Rec. 709 (SDR), which suits ordinary social and YouTube videos. Choose Rec. 2100 HLG or PQ only for HDR work. Changing it after grading changes how every clip looks.</span></li>
</ul>

<h2 id="steps">Steps</h2>
<ol class="steps">
<li><h3>Open Color Mode</h3>
<p>In Edit mode, open the sequence in the Timeline, then click the <span class="ui">Color</span> tab in the header bar at the top of the window. Premiere opens the grading workspace.</p>
<p class="note">The Project Browser is still available in Color Mode, so you can switch sequences without going back to Edit mode.</p></li>
<li><h3>Pick a clip in the Clip Grid</h3>
<p>The <span class="ui">Clip Grid</span> shows every clip in the sequence as a thumbnail, in timeline order. Click the clip you want to fix. The one outlined in white is the <b>Current Clip</b>, and every adjustment goes to it.</p></li>
<li><h3>Make sure you are changing one clip</h3>
<p>At the top of the <span class="ui">Color Controls</span> panel, choose an operation:</p>
<ul><li><span class="ui">Clip Operation</span> changes only the selected clip. It is chosen for you whenever you pick a new clip.</li>
<li><span class="ui">Sequence Style</span> applies a look to the whole sequence. Beginners should leave it until the individual clips are done.</li></ul></li>
<li><h3>Try Auto Color first</h3>
<p>The <span class="ui">Auto Color</span> button sits at the bottom left of the <span class="ui">Adjust</span> controls and sets Exposure, Temperature and Tint for you. To fix just one thing, right-click or click and hold it, then choose <span class="ui">Auto Exposure</span> or <span class="ui">Auto White Balance</span>.</p>
<p class="note">Auto Color works from the frame under the playhead, so park the playhead on a frame that represents the clip.</p></li>
<li><h3>Adjust by clicking and dragging</h3>
<p>Most controls change two values at once: drag up or down for the main value, left or right for the second one.</p>
<ol><li>Click once inside a control to <b>latch</b> it. A HUD appears with a graph for that control.</li>
<li>Drag, or use the arrow keys for fine steps.</li>
<li>Click again, or press <kbd>Enter</kbd> / <kbd>Esc</kbd>, to accept and unlatch.</li></ol>
<p>You can also press, drag and release without latching. Work through the <a href="#order">order Adobe recommends</a>.</p></li>
<li><h3>Compare, then move to the next clip</h3>
<p>Select several clips in the Clip Grid and turn on <span class="ui">Comparison View</span> in the <span class="ui">Color Monitor</span> for a split screen. Press <kbd>↓</kbd> for the next clip or <kbd>↑</kbd> for the previous one, until every clip that needs work is done.</p></li>
</ol>

<h2 id="controls">The basic Adjust controls</h2>
<p>Start with the <span class="ui">Color &amp; Contrast</span> group, which works on the whole image. These five controls fix most beginner problems.</p>
<div class="tbl"><table class="stack">
<thead><tr><th>Control</th><th>Main value (drag up/down)</th><th>Second value (drag left/right)</th><th>Fixes</th></tr></thead>
<tbody>
<tr><td>Contrast</td><td>Difference between the brightest and darkest pixels</td><td>Moves the contrast pivot point</td><td>Flat images with no depth</td></tr>
<tr><td>Exposure</td><td>Overall brightness</td><td>Black: crush or lift the shadows</td><td>Too dark, too bright, washed out</td></tr>
<tr><td>Temperature</td><td>Warmer or cooler</td><td>Tint: removes a green or magenta cast</td><td>Orange, blue or green casts</td></tr>
<tr><td>Balance</td><td colspan="2">Remixes the red, green and blue channels to push colour in any direction</td><td>Use instead of Temperature when the cast is not orange or blue</td></tr>
<tr><td>Saturation</td><td colspan="2">Raises or lowers the intensity of all colours at once</td><td>Dull or overly strong colour</td></tr>
</tbody></table></div>
<h3 id="order">The order Adobe suggests for beginners</h3>
<ol class="order">
<li><b>Contrast</b> and <b>Exposure</b>, adjusting Black as needed</li>
<li><b>Temperature</b> or <b>Balance</b>, choose one</li>
<li>Global <b>Saturation</b></li>
<li><b>Zones</b>, if some tonal range still needs work. Shadows and Highlights are there by default.</li>
<li><b>Saturation/Hue/Lum Shift</b> for one specific colour, such as the sky</li>
<li><b>Texture</b> and <b>Sharpness</b></li>
<li><b>Style</b>, for a stylised look</li>
</ol>

<h2 id="keys">Useful shortcuts</h2>
<p class="note">Color Mode has its own shortcut set, so the same key can do different things in Edit mode and Color Mode.</p>
<div class="tbl"><table class="stack">
<thead><tr><th>Key</th><th>What it does</th><th>When</th></tr></thead>
<tbody>
<tr><td><kbd>H</kbd> held</td><td>Hides the HUD until you let go</td><td>While adjusting, to see the whole image</td></tr>
<tr><td><kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd></td><td>Fine adjustments</td><td>While a control is latched</td></tr>
<tr><td><kbd>Enter</kbd> / <kbd>Esc</kbd></td><td>Accept and unlatch</td><td>When you are done adjusting</td></tr>
<tr><td><kbd>↓</kbd> / <kbd>↑</kbd></td><td>Next / previous clip</td><td>After finishing the current clip</td></tr>
</tbody></table></div>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>Can't find the Lumetri Color panel</b>It is retired in 27.0. Use Color Mode, or for a quick fix without leaving Edit mode, use the Color section of the Properties panel.</li>
<li><b>Changing Color Management after grading</b>Every clip shifts. Set it correctly before you start.</li>
<li><b>Fixing one clip changes them all</b>You are in Sequence Style. Check the operation name at the top of Color Controls before dragging.</li>
<li><b>Stacking the Lumetri Color effect on top of Color Mode</b>Adobe recommends Color Mode alone for new projects: mixing them limits your options, and Lumetri can clip out-of-range values that can't be recovered later.</li>
<li><b>Pushing Zones or Hue Shift too far</b>The image starts to look fake. Use them sparingly and watch the HUD graph for clipping at the top or bottom.</li>
</ul>

<h2 id="older">Using a version older than 27.0</h2>
<details class="old"><summary>Premiere 26.x and the 25.6.x LTS line</summary><ul>
<li>These versions still have the Lumetri Color panel and no released Color Mode, so the steps on this page don't apply. See "Grading with Lumetri Color" instead.</li>
<li>Color Mode was a public beta in the Premiere (beta) app from April 2026. Its screens may differ from 27.0.</li>
<li>After updating to 27.0, projects graded with Lumetri still open, and their grades stay editable in Effect Controls.</li></ul></details>

<template id="t-en-captions">
<p class="crumb">Premiere › Color, audio and captions</p>
<h1>Korean and Simplified Chinese captions</h1>
<p class="lead">Premiere can transcribe speech with Speech to Text and turn it into captions on the timeline, and both Korean and Simplified Chinese are supported. CJK languages need different line lengths from English, though, and a font that actually contains their characters.</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe and Netflix guidelines</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>Install the language pack first.</b> Premiere includes an English language pack; Korean and Simplified Chinese (Mandarin) are separate downloads. Once installed, transcription works without an internet connection.</p></div>
<div class="demo" data-demo="captions"></div>

<h2 id="steps">Steps</h2>
<ol class="steps">
<li><h3>Open the Text panel and transcribe</h3><p>Choose <span class="ui">Window › Text</span>, go to the <span class="ui">Transcript</span> tab, pick the spoken language (Korean or Simplified Chinese), and click <span class="ui">Transcribe</span>.</p></li>
<li><h3>Clean up the transcript first</h3><p>Read it through and fix mistakes, names, product names and jargon in the Transcript tab. Fixing it once here beats fixing every caption later.</p></li>
<li><h3>Create captions and set the line length</h3><p>Open the menu (three-line icon) in the Transcript tab and choose <span class="ui">Create Captions</span>. <span class="ui">Maximum length in characters</span> defaults to 42, which suits English; for Korean and Simplified Chinese, lower it to about 16 (see the table below). Then choose single or double lines.</p>
<p class="note">Other settings, such as Minimum duration in seconds (default 3) and Gap between captions, depend on the job.</p></li>
<li><h3>Choose a font that supports the language</h3><p>Select the caption track and set a font in the Properties panel that has Korean or Chinese characters, such as the Source Han Sans family. Fonts without them show boxes instead.</p></li>
<li><h3>Translate (optional)</h3><p>In the <span class="ui">Captions</span> tab of the Text panel, click <span class="ui">Translate Captions</span> at the top, choose the target languages, and click Translate. Have someone who reads that language review the result.</p></li>
<li><h3>Export the captions</h3><p>In the Captions section of Export, choose whether to burn them into the picture (<span class="ui">Burn Captions Into Video</span>) or deliver a separate file (<span class="ui">Create Sidecar File</span>) such as SRT, which viewers can switch on and off on most platforms.</p></li>
</ol>

<h2 id="limits">Line length and reading speed</h2>
<p>These values come from Netflix's Timed Text Style Guides, a standard many subtitlers reference. They make a good starting point even if your work isn't going to Netflix.</p>
<div class="tbl"><table class="stack">
<thead><tr><th>Language</th><th>Characters per line</th><th>Max reading speed (adult)</th><th>Notes</th></tr></thead>
<tbody>
<tr><td>Korean</td><td class="n">16</td><td class="n">12 chars/s</td><td>Latin letters, spaces and punctuation count as 0.5 character</td></tr>
<tr><td>Simplified Chinese</td><td class="n">16</td><td class="n">9 chars/s</td><td>Usually one line; if it must be two, make the bottom line the longer one</td></tr>
<tr><td>English (for comparison)</td><td class="n">42</td><td>–</td><td>Applies to most Latin-script languages</td></tr>
</tbody></table></div>
<p class="note">Netflix's automated QC enforces a hard ceiling of 23 characters per line for Korean and Chinese; files above it fail. 16 is the value the guides ask for.</p>

<h2 id="import">Already have a caption file?</h2>
<p>If a translator or another transcription service gives you an SRT file, import it into the Project panel and drag it into the sequence as a caption track. Then set the font and check timing just as you would for captions made in Premiere.</p>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>Characters show as boxes</b>The font has no Korean or Chinese glyphs. Switch to a font with CJK support.</li>
<li><b>Keeping the 42-character setting for Korean or Chinese</b>Lines run off screen or go by too fast to read. Lower it to about 16 in Create Captions.</li>
<li><b>Wrong language at transcription</b>The result is gibberish. Check the language in Transcript before clicking Transcribe, and make sure the language pack is installed.</li>
<li><b>Line breaks don't match the settings</b>Premiere also splits captions by speech rhythm, so some come out longer or shorter. Always review them.</li>
<li><b>Burning in captions, then finding a typo</b>You have to export the whole video again. If the platform supports it, a separate SRT is easier to fix.</li>
</ul>

<h2 id="older">Using an older version</h2>
<details class="old"><summary>About supported languages</summary><ul>
<li>The languages available for Speech to Text and Translate Captions change between versions. Check Adobe's "Languages supported by Speech-to-Text" page before starting a job.</li>
<li>Since Premiere 22.2, transcription works offline once the language pack is installed.</li></ul></details>

<h2 id="sources">Sources</h2>
<ul class="src">
<li><a href="https://www.adobe.com/qa_en/products/premiere/speech-to-text.html">Adobe Premiere Speech to Text</a></li>
<li><a href="https://helpx.adobe.com/sea/premiere-pro/using/speech-to-text-faq.html">Speech to Text in Premiere FAQ</a></li>
<li><a href="https://helpx.adobe.com/premiere/desktop/render-and-export/export-files/overview-of-export-settings.html">Overview of export settings (Captions)</a></li>
<li><a href="https://backlothelp.netflix.com/hc/en-us/articles/216001127">Netflix Korean Timed Text Style Guide</a></li>
<li><a href="https://backlothelp.netflix.com/hc/en-us/articles/215986007-Chinese-Simplified-Timed-Text-Style-Guide">Netflix Simplified Chinese Timed Text Style Guide</a></li>
<li><a href="https://backlothelp.netflix.com/hc/en-us/articles/215274938-What-is-the-maximum-number-of-characters-per-line-allowed-in-Timed-Text-assets">Netflix: maximum characters per line</a></li>
</ul>

<template id="t-en-audio">
<p class="crumb">Premiere › Color, audio and captions</p>
<h1>Audio and music</h1>
<p class="lead">Viewers forgive rough pictures far more easily than sound they can't follow. The basics: dialogue clear, music underneath, and nothing over 0 dB. You can do most of it from the Essential Sound panel.</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>Tell Premiere what each clip is first.</b> Select clips and click Dialogue, Music, SFX or Ambience in the Essential Sound panel. The rest of the panel adapts to the type you choose.</p></div>
<div class="demo" data-demo="audio"></div>

<h2 id="types">Audio types in Essential Sound</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Type</th><th>Use for</th><th>Common options</th></tr></thead>
<tbody>
<tr><td>Dialogue</td><td>Speech, interviews, voice-over</td><td>Loudness Auto-Match, Enhance Speech, Repair, Clarity</td></tr>
<tr><td>Music</td><td>Background music</td><td>Loudness Auto-Match, Ducking</td></tr>
<tr><td>SFX</td><td>Sound effects such as doors or whooshes</td><td>Loudness, left/right position</td></tr>
<tr><td>Ambience</td><td>Room tone, crowds, wind</td><td>Loudness, Reverb</td></tr>
</tbody></table></div>

<h2 id="steps">A basic mix, step by step</h2>
<ol class="steps">
<li><h3>Keep tracks tidy</h3><p>Dialogue on A1–A2, music on A3, effects on A4, so you can select each type at once. For a layout suited to sound, switch to the <span class="ui">Audio</span> workspace.</p></li>
<li><h3>Set the type and Auto-Match</h3><p>Select all dialogue clips, click <span class="ui">Dialogue</span>, then <span class="ui">Auto-Match</span> under Loudness so every clip sits at a similar level. Do the same for music with <span class="ui">Music</span>.</p></li>
<li><h3>Clean up speech with Enhance Speech</h3><p>On the Dialogue tab, click <span class="ui">Enhance</span> under Enhance Speech. When processing finishes, adjust <span class="ui">Mix Amount</span>; if the voice sounds unnatural, lower it to blend some of the original back in.</p>
<p class="note">Enhance Speech is for speech only, not music or sound effects.</p></li>
<li><h3>Duck the music under dialogue</h3><p>Select the music, turn on <span class="ui">Ducking</span>, choose which audio types should trigger it (for example Dialogue), set Sensitivity, Reduce By and Fades, then click <span class="ui">Generate Keyframes</span>. Premiere adds keyframes that lower the music where people speak.</p>
<p class="note">You can click Generate Keyframes again any time; the old keyframes are replaced with a new set based on the current settings.</p></li>
<li><h3>Watch the Audio Meters through the whole piece</h3><p>Play from start to finish and watch the meters beside the timeline. Never touch the red at the top (0 dB). If you do, lower that clip with <span class="ui">Audio Gain</span> (<kbd>G</kbd>).</p></li>
</ol>

<h2 id="tips">More tips</h2>
<ul class="check">
<li><span><b>Check on headphones and speakers.</b> Headphones catch noise; speakers show whether the music is too loud.</span></li>
<li><span><b>Change volume over time with keyframes.</b> <kbd>Ctrl</kbd>-click (Windows) or <kbd>Cmd</kbd>-click (Mac) the volume line on a clip in the timeline to add a keyframe.</span></li>
<li><span><b>Generate music or sound effects in 27.0.</b> Premiere 27.0 can generate music, sound effects and soundscapes with AI. Check the usage terms and the credits it uses first.</span></li>
<li><span><b>Use music you have rights to.</b> Songs from music apps or YouTube can trigger copyright claims. Use a licensed library such as Adobe Stock.</span></li>
</ul>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>Music drowns out the dialogue</b>Turn on Ducking or bring the music down further; under speech it should be clearly quieter than the voice.</li>
<li><b>Distorted sound</b>The mix goes over 0 dB. Lower the Audio Gain of the loudest clip, not your computer's volume.</li>
<li><b>Adjusting every clip by hand</b>Auto-Match on all clips of one type at once is faster and more consistent.</li>
<li><b>Too much Enhance Speech</b>Voices can sound robotic or words can change. Lower Mix Amount and listen again.</li>
</ul>

<h2 id="older">Using a version older than 27.0</h2>
<details class="old"><summary>Premiere 25.x–26.x</summary><ul>
<li>Essential Sound, Auto-Match, Ducking and Enhance Speech work the same way.</li>
<li>AI generation of music, sound effects and soundscapes isn't available.</li></ul></details>

<h2 id="sources">Sources</h2>
<ul class="src">
<li><a href="https://helpx.adobe.com/premiere-pro/using/premiere-essential-sound-panel.html">Edit, repair, and improve audio using Essential Sound panel</a></li>
<li><a href="https://www.adobe.com/learn/premiere-pro/web/automatic-audio-ducking">Automatic audio ducking</a></li>
<li><a href="https://helpx.adobe.com/premiere-pro/using/enhance-speech.html">Enhance Speech</a></li>
<li><a href="https://helpx.adobe.com/sa_en/premiere/desktop/whats-new/release-notes.html">Adobe Premiere release notes</a></li>
</ul>

<template id="t-en-presets-resolution">
<p class="crumb">Premiere › Export</p>
<h1>Common presets and resolutions</h1>
<p class="lead">Resolution is the image size in pixels, frame rate is how many images play per second, and a preset is a saved set of values you can pick when creating a sequence or exporting. This page lists the values that suit everyday work, with the reasons behind them.</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center and YouTube Help</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>A rule that works for most jobs:</b> set up the sequence for its destination, then export with a Match Source preset, which takes its values from the sequence automatically. Change only what you need to.</p></div>
<div class="demo" data-demo="presets-resolution"></div>

<h2 id="res">Resolutions you will meet</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Name</th><th>Size (pixels)</th><th>Ratio</th><th>Use it for</th></tr></thead>
<tbody>
<tr><td>HD / 720p</td><td class="n">1280 × 720</td><td>16:9</td><td>Light web video. YouTube recommends at least this for 16:9 video.</td></tr>
<tr><td>Full HD / 1080p</td><td class="n">1920 × 1080</td><td>16:9</td><td>The everyday standard: YouTube, client delivery, TV playback</td></tr>
<tr><td>QHD / 1440p</td><td class="n">2560 × 1440</td><td>16:9</td><td>YouTube when you want sharper than 1080p with smaller files than 4K</td></tr>
<tr><td>UHD / 4K</td><td class="n">3840 × 2160</td><td>16:9</td><td>4K TVs and YouTube 4K; needs a capable computer</td></tr>
<tr><td>DCI 4K</td><td class="n">4096 × 2160</td><td>≈1.9:1</td><td>The cinema 4K standard, different from TV's UHD</td></tr>
<tr><td>Vertical 9:16</td><td class="n">1080 × 1920</td><td>9:16</td><td>YouTube Shorts, Instagram Reels, TikTok</td></tr>
<tr><td>4:5</td><td class="n">1080 × 1350</td><td>4:5</td><td>Videos in the Instagram feed</td></tr>
<tr><td>Square</td><td class="n">1080 × 1080</td><td>1:1</td><td>General social posts</td></tr>
</tbody></table></div>
<p class="note">Social platform specs change. Check the platform's help pages before an important delivery.</p>

<h2 id="fps">Choosing a frame rate</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Frame rate</th><th>Feel</th><th>Use it for</th></tr></thead>
<tbody>
<tr><td class="n">23.976 / 24</td><td>Cinematic</td><td>Short films, music videos, anything after a film look</td></tr>
<tr><td class="n">25</td><td>Smooth, PAL-style TV</td><td>50 Hz countries such as Thailand and China; reduces indoor light flicker there, good for events and TV delivery</td></tr>
<tr><td class="n">29.97 / 30</td><td>Smooth, NTSC-style TV</td><td>60 Hz countries such as Korea; many phones and cameras also default to it</td></tr>
<tr><td class="n">50</td><td>Very smooth</td><td>Sport, or 2× slow motion in a 25 fps sequence</td></tr>
<tr><td class="n">59.94 / 60</td><td>Very smooth</td><td>Gaming, or 2× slow motion in a 30 fps sequence</td></tr>
</tbody></table></div>
<p>YouTube recommends exporting at the frame rate you recorded. Avoid converting 25 to 30 or the reverse unless you must, because it causes stutter.</p>

<h2 id="export">Exporting with a preset</h2>
<ol class="steps">
<li><h3>Open Export</h3><p>Select the sequence and click the <span class="ui">Export</span> tab in the header bar at the top of the window.</p></li>
<li><h3>Choose Format and Preset</h3><p><span class="ui">H.264</span> works almost everywhere. For the preset, choose <span class="ui">Match Source – Adaptive High Bitrate</span>, which uses the sequence's frame size and frame rate.</p></li>
<li><h3>Check the key values</h3><p>Confirm Frame Size and Frame Rate are what you expect. Leave Export Color Space at its Rec. 709 default for ordinary SDR work.</p></li>
<li><h3>Adjust the bitrate if needed</h3><p>VBR 1 pass is quick; VBR 2 pass takes longer but is usually higher quality. Hardware Accelerated encoding is the default and speeds up exports.</p></li>
<li><h3>Save your own preset</h3><p>Once your usual settings are in place, save them as a preset such as "Reels 1080x1920 25p" and pick it next time.</p></li>
</ol>

<h2 id="bitrate">YouTube's recommended bitrates (SDR video)</h2>
<div class="tbl"><table>
<thead><tr><th>Resolution</th><th>24, 25, 30 fps</th><th>48, 50, 60 fps</th></tr></thead>
<tbody>
<tr><td>1440p</td><td class="n">20 Mbps</td><td class="n">30 Mbps</td></tr>
<tr><td>1080p</td><td class="n">10 Mbps</td><td class="n">15 Mbps</td></tr>
<tr><td>720p</td><td class="n">6.5 Mbps</td><td class="n">9.5 Mbps</td></tr>
</tbody></table></div>
<p class="note">Values for 4K and HDR are on YouTube's page in the sources below. Export audio at the sample rate it was recorded at; a higher rate doesn't improve quality.</p>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>Exporting larger than the sequence to make it sharper</b>A 1080p sequence exported as 4K isn't sharper, only bigger. When you must scale, turn on Use Maximum Render Quality to reduce jagged edges.</li>
<li><b>Bitrate too low</b>Busy, fast-moving scenes break into blocks. Start from YouTube's table.</li>
<li><b>Frame rate doesn't match the sequence</b>Stutter. Match Source avoids this.</li>
<li><b>Delivering a vertical video as a landscape file</b>Black bars on both sides. Set up a vertical sequence from the start.</li>
<li><b>4K editing is sluggish</b>Edit with proxies, then export from the original files.</li>
</ul>

<h2 id="older">Using an older version</h2>
<details class="old"><summary>Tutorials that still show the Export Settings window</summary><ul>
<li>Since version 22.0 (late 2021), exporting happens in the Export tab at the top. Older tutorials use the former Export Settings window; preset names and values are similar.</li></ul></details>

<h2 id="sources">Sources</h2>
<ul class="src">
<li><a href="https://helpx.adobe.com/premiere/desktop/render-and-export/export-files/overview-of-export-settings.html">Overview of export settings</a></li>
<li><a href="https://helpx.adobe.com/premiere/desktop/edit-projects/change-clip-sequence/sequence-settings-reference.html">Sequence settings reference</a></li>
<li><a href="https://support.google.com/youtube/answer/1722171">YouTube recommended upload encoding settings</a></li>
<li><a href="https://support.google.com/youtube/answer/4603579">YouTube video and audio formatting specifications</a></li>
</ul>

<template id="t-en-export">
<p class="crumb">Premiere › Export</p>
<h1>Exporting video</h1>
<p class="lead">Exporting turns a sequence into a video file that plays anywhere. In Premiere, start by asking where the file is going, then pick the preset that suits that destination.</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>Always check Range.</b> If In/Out points are left on the sequence, Premiere may export only that part. Set Range to <span class="ui">Entire Source</span> when you want everything.</p></div>
<div class="demo" data-demo="export"></div>

<h2 id="ways">Three ways to export</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Way</th><th>Good for</th><th>Where</th></tr></thead>
<tbody>
<tr><td>Export mode</td><td>Everyday jobs, full control</td><td>The Export tab in the header bar, or <kbd>Ctrl</kbd>+<kbd>M</kbd> / <kbd>Cmd</kbd>+<kbd>M</kbd></td></tr>
<tr><td>Quick Export</td><td>A fast file with a ready-made preset</td><td>Button at the top right of the header bar</td></tr>
<tr><td>Send to Media Encoder</td><td>Several files or specs, or editing while it exports</td><td>Button at the bottom right of Export mode</td></tr>
</tbody></table></div>

<h2 id="steps">Steps in Export mode</h2>
<ol class="steps">
<li><h3>Select the sequence and open Export mode</h3><p>Click in the timeline or select the sequence in the Project panel, then click the <span class="ui">Export</span> tab.</p></li>
<li><h3>Choose a destination</h3><p>On the left, <span class="ui">Media File</span> makes an ordinary file, and some social destinations can upload for you.</p></li>
<li><h3>Set the file name, location and preset</h3><p>Give the file a name and location you'll find again, then choose a Preset such as <span class="ui">Match Source – Adaptive High Bitrate</span>, which uses H.264 at the sequence's frame size and frame rate.</p></li>
<li><h3>Check Range and Captions</h3><p>Range, under the preview, offers Entire Source, Source In/Out, Work Area and Custom. If you have captions, choose in <span class="ui">Captions</span> whether to leave them out, export a sidecar file or burn them into the picture.</p></li>
<li><h3>Check the estimated size and export</h3><p>Estimated File Size is at the bottom right. If it's too big to send, try a Medium Bitrate preset. Click <span class="ui">Export</span> and wait for it to finish.</p></li>
<li><h3>Watch the file you made</h3><p>Open the actual file and watch it through: picture, sound, captions, and no extra black at the end.</p></li>
</ol>

<h2 id="settings">Settings worth knowing</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Setting</th><th>Meaning</th></tr></thead>
<tbody>
<tr><td>Format</td><td>The file type and codec, such as H.264 (MP4), HEVC or QuickTime (ProRes)</td></tr>
<tr><td>Match Source</td><td>Automatically uses the source's frame size and frame rate</td></tr>
<tr><td>Bitrate</td><td>Data per second; higher is sharper but bigger. VBR adapts to how complex the picture is; CBR stays constant.</td></tr>
<tr><td>Use Maximum Render Quality</td><td>Helps quality when scaling down, but takes longer</td></tr>
<tr><td>Content Credentials</td><td>Optionally embeds who created and edited the file</td></tr>
</tbody></table></div>
<p class="note">For frame sizes and presets per destination, see <a href="#en-presets-resolution">Common presets and resolutions</a>.</p>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>Only part of the video exported</b>Range was set to Source In/Out by leftover In/Out points. Switch to Entire Source.</li>
<li><b>Can't find the file</b>Check Location before you click Export, and put a date or version in the file name.</li>
<li><b>Captions missing from the file</b>Open Captions and choose to burn them in or export a sidecar file. With None there are no captions.</li>
<li><b>Black or frozen frames at the end</b>A clip or graphic runs past the end of the edit. Remove it or set Range precisely.</li>
<li><b>File too big to send</b>Lower the bitrate with a Medium or Low preset rather than shrinking the frame below what the destination needs.</li>
</ul>

<h2 id="older">Using a version older than 27.0</h2>
<details class="old"><summary>Premiere 25.x–26.x</summary><ul>
<li>Export mode and Quick Export work the same way.</li>
<li>The Content Credentials option at export arrived in 26.2.</li></ul></details>

<li><a href="https://helpx.adobe.com/premiere-pro/using/export-settings-reference-premiere-pro.html">Overview of export settings</a></li>
<li><a href="https://helpx.adobe.com/uk/premiere/desktop/render-and-export/export-files/quickly-export-a-video-file.html">Quickly export a video file</a></li>
</ul>
