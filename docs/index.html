<template id="t-th-color-mode">
<p class="crumb">Premiere › สี เสียง และซับไตเติล</p>
<h1>แต่งสีคลิปด้วย Color Mode</h1>
<p class="lead">แก้ภาพมืด ภาพจาง หรือภาพอมสี ให้ดูเป็นธรรมชาติ ด้วยหน้าแต่งสีใหม่ของ Premiere: เปิด Color Mode เลือกคลิป แล้วปรับทีละค่าตามลำดับ</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 2 21 19H1Z" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/><path d="M11 8v5" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="16" r="1.2" fill="var(--acc)"/></svg>
<p><b>ดูคลิปสอนที่ใช้ Lumetri Color panel อยู่?</b> Premiere 27.0 เลิกใช้พาเนลนี้แล้ว แต่ Lumetri Color <i>effect</i> ยังมีอยู่ และ<span class="nw">โปรเจกต์</span>เก่าที่แต่งด้วย Lumetri ยังเปิดได้ตามเดิม งานใหม่ให้ใช้ Color Mode ตามหน้านี้</p></div>
<div class="demo" data-demo="color-mode"></div>

<h2 id="before">ก่อนเริ่ม</h2>
<ul class="check">
<li><span>ใช้ <b>Premiere 27.0</b> ขึ้นไป เช็ก<span class="nw">เวอร์ชัน</span>ได้ที่ About Premiere (Windows อยู่ในเมนู Help, Mac อยู่ในเมนู Premiere)</span></li>
<li><span>ตัดต่อ sequence ให้เสร็จก่อน จะได้ไม่เสียเวลาแต่งสีคลิปที่ถูกตัดทิ้งทีหลัง</span></li>
<li><span><b>ตั้ง Color Management ของ sequence ให้ถูกตั้งแต่แรก</b> ค่าเริ่มต้นคือ Direct Rec. 709 (SDR) ถ้าทำคลิปลงโซเชียลหรือ YouTube แบบทั่วไป ใช้ค่านี้ได้เลย งาน HDR ค่อยเลือก Rec. 2100 HLG หรือ PQ ถ้าไปเปลี่ยนหลังแต่งสีแล้ว สีของคลิปจะเปลี่ยนตาม</span></li>
</ul>

<h2 id="steps">ขั้นตอน</h2>
<ol class="steps">
<li><h3>เปิด Color Mode</h3>
<p>ใน Edit mode เปิด sequence ที่จะแต่งสีใน Timeline แล้วคลิกแท็บ <span class="ui">Color</span> บนแถบด้านบนสุดของหน้าต่าง Premiere จะเปิด workspace สำหรับแต่งสีให้ทันที</p>
<p class="note">ใน Color Mode ยังเปิด Project Browser ได้ อยากสลับไปแต่ง sequence อื่นก็ไม่ต้องกลับไป Edit mode</p></li>
<li><h3>เลือกคลิปใน Clip Grid</h3>
<p><span class="ui">Clip Grid</span> แสดงทุกคลิปใน sequence เป็นภาพย่อ เรียงตามลำดับใน timeline คลิกภาพย่อของคลิปที่จะแก้ คลิปที่มีกรอบสีขาวคือ <b>Current Clip</b> ทุกค่าที่ปรับจะลงที่คลิปนี้</p></li>
<li><h3>เช็กว่ากำลังแก้คลิปเดียว</h3>
<p>ด้านบนของพาเนล <span class="ui">Color Controls</span> มีให้เลือก operation</p>
<ul><li><span class="ui">Clip Operation</span> แก้เฉพาะคลิปที่เลือก ถูกเลือกไว้ให้เองทุกครั้งที่คลิกคลิปใหม่</li>
<li><span class="ui">Sequence Style</span> ใส่ลุคให้ทั้ง sequence มือใหม่ค่อยใช้ตอนท้าย หลังแก้รายคลิปเสร็จ</li></ul></li>
<li><h3>ลองกด Auto Color ก่อน</h3>
<p>ปุ่ม <span class="ui">Auto Color</span> อยู่มุมล่างซ้ายของคอนโทรล <span class="ui">Adjust</span> จะปรับ Exposure, Temperature และ Tint ให้อัตโนมัติ ถ้าอยากให้แก้อย่างเดียว คลิกขวาหรือคลิกค้างที่ปุ่ม แล้วเลือก <span class="ui">Auto Exposure</span> หรือ <span class="ui">Auto White Balance</span></p>
<p class="note">Auto Color คำนวณจากเฟรมที่ playhead อยู่ ให้วาง playhead บนเฟรมที่เป็นตัวแทนของคลิปก่อนกด</p></li>
<li><h3>ปรับเองด้วยการคลิกแล้วลาก</h3>
<p>คอนโทรลส่วนใหญ่ปรับได้สองค่าพร้อมกัน ลากขึ้นลงคือค่าหลัก ลากซ้ายขวาคือค่ารอง</p>
<ol><li>คลิกในคอนโทรล 1 ครั้งเพื่อ <b>ล็อก (latch)</b> จะมี HUD ขึ้นมาแสดงกราฟของค่านั้น</li>
<li>ลากเมาส์ หรือกดปุ่มลูกศรเพื่อปรับทีละนิด</li>
<li>คลิกอีกครั้ง หรือกด <kbd>Enter</kbd> / <kbd>Esc</kbd> เพื่อยืนยันและปลดล็อก</li></ol>
<p>ถ้าไม่อยากล็อก ให้กดเมาส์ค้าง ลาก แล้วปล่อยก็ได้ ปรับตาม<a href="#order">ลำดับที่ Adobe แนะนำ</a></p></li>
<li><h3>เทียบภาพ แล้วไปคลิปถัดไป</h3>
<p>เลือกหลายคลิปใน Clip Grid แล้วเปิด <span class="ui">Comparison View</span> ใน <span class="ui">Color Monitor</span> จะเห็นภาพแบ่งครึ่งเทียบกัน เสร็จแล้วกด <kbd>↓</kbd> ไปคลิปถัดไป หรือ <kbd>↑</kbd> ย้อนกลับ ทำจนครบทุกคลิปที่ต้องแก้</p></li>
</ol>

<h2 id="controls">คอนโทรลพื้นฐานใน Adjust</h2>
<p>เริ่มจากคอนโทรลกลุ่ม <span class="ui">Color &amp; Contrast</span> ซึ่งปรับทั้งภาพ ห้าตัวนี้แก้ปัญหาส่วนใหญ่ของมือใหม่ได้</p>
<div class="tbl"><table class="stack">
<thead><tr><th>คอนโทรล</th><th>ค่าหลัก (ลากขึ้นลง)</th><th>ค่ารอง (ลากซ้ายขวา)</th><th>ใช้แก้</th></tr></thead>
<tbody>
<tr><td>Contrast</td><td>ความต่างระหว่างส่วนสว่างสุดกับมืดสุด</td><td>เลื่อนจุด pivot ของคอนทราสต์ได้</td><td>ภาพแบน ไม่มีมิติ</td></tr>
<tr><td>Exposure</td><td>ความสว่างโดยรวม</td><td>Black: กดส่วนมืดให้ดำขึ้น หรือยกให้จางลง</td><td>ภาพมืดหรือสว่างเกิน ภาพจาง</td></tr>
<tr><td>Temperature</td><td>อุ่นขึ้นหรือเย็นลง</td><td>Tint: ลดอาการอมเขียวหรืออมม่วงแดง</td><td>ภาพอมส้ม อมฟ้า อมเขียว</td></tr>
<tr><td>Balance</td><td colspan="2">ผสมช่องสีแดง เขียว น้ำเงินใหม่ ดันสีไปทิศไหนก็ได้</td><td>ใช้แทน Temperature เมื่อสีเพี้ยนไปทางอื่นที่ไม่ใช่ส้มหรือฟ้า</td></tr>
<tr><td>Saturation</td><td colspan="2">เพิ่มหรือลดความสดของทุกสีพร้อมกัน</td><td>สีซีดหรือจัดเกิน</td></tr>
</tbody></table></div>
<h3 id="order">ลำดับที่ Adobe แนะนำสำหรับมือใหม่</h3>
<ol class="order">
<li><b>Contrast</b> และ <b>Exposure</b> ปรับ Black ตามต้องการ</li>
<li><b>Temperature</b> หรือ <b>Balance</b> เลือกอย่างใดอย่างหนึ่ง</li>
<li><b>Saturation</b> ทั้งภาพ</li>
<li><b>Zones</b> ถ้ายังมีบางช่วงแสงต้องแก้ เริ่มต้นมีให้ 2 โซนคือ Shadows กับ Highlights</li>
<li><b>Saturation/Hue/Lum Shift</b> แก้เฉพาะสีใดสีหนึ่ง เช่น สีท้องฟ้า</li>
<li><b>Texture</b> และ <b>Sharpness</b> ปรับความคมของรายละเอียด</li>
<li><b>Style</b> ถ้าต้องการลุคเฉพาะตัว</li>
</ol>

<h2 id="keys"><span class="nw">คีย์ลัด</span>ที่ใช้บ่อย</h2>
<p class="note">Color Mode มีชุด<span class="nw">คีย์ลัด</span>แยกจาก Edit mode ปุ่มเดียวกันอาจทำงานต่างกันในสองโหมด</p>
<div class="tbl"><table class="stack">
<thead><tr><th>ปุ่ม</th><th>ทำอะไร</th><th>ใช้ตอนไหน</th></tr></thead>
<tbody>
<tr><td><kbd>H</kbd> กดค้าง</td><td>ซ่อน HUD ชั่วคราว ปล่อยแล้วกลับมา</td><td>ระหว่างปรับ อยากเห็นภาพเต็ม</td></tr>
<tr><td><kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd></td><td>ปรับทีละนิด</td><td>ขณะคอนโทรลถูกล็อกอยู่</td></tr>
<tr><td><kbd>Enter</kbd> / <kbd>Esc</kbd></td><td>ยืนยันค่าและปลดล็อก</td><td>ปรับเสร็จแล้ว</td></tr>
<tr><td><kbd>↓</kbd> / <kbd>↑</kbd></td><td>ไปคลิปถัดไป / คลิปก่อนหน้า</td><td>แก้คลิปปัจจุบันเสร็จแล้ว</td></tr>
</tbody></table></div>

<h2 id="mistakes">จุดที่มือใหม่พลาดบ่อย</h2>
<ul class="mist">
<li><b>หา Lumetri Color panel ไม่เจอ</b>Premiere 27.0 เลิกใช้แล้ว ใช้ Color Mode แทน ถ้าแค่อยากแก้นิดหน่อยโดยไม่ออกจาก Edit mode ใช้ส่วน Color ใน Properties panel</li>
<li><b>แต่งเสร็จแล้วค่อยไปเปลี่ยน Color Management</b>สีทุกคลิปจะเปลี่ยนตาม ตั้งให้ถูกก่อนเริ่มแต่ง</li>
<li><b>ตั้งใจแก้คลิปเดียว แต่ทุกคลิปเปลี่ยน</b>เพราะกำลังอยู่ที่ Sequence Style ดูชื่อ operation ด้านบน Color Controls ก่อนลาก</li>
<li><b>ใส่ Lumetri Color effect ซ้อนกับ Color Mode</b>Adobe แนะนำให้<span class="nw">โปรเจกต์</span>ใหม่ใช้ Color Mode อย่างเดียว เพราะใช้ร่วมกันจะจำกัดการแต่งสี และ Lumetri อาจตัดค่าที่เกินช่วงทิ้ง (clip) ซึ่งกู้คืนทีหลังไม่ได้</li>
<li><b>ดัน Zones หรือ Hue Shift หนักเกิน</b>ภาพจะดูปลอม ใช้เท่าที่จำเป็น และดูกราฟใน HUD ว่าค่าชนขอบบนหรือล่างหรือยัง</li>
</ul>

<p class="crumb">Premiere › สี เสียง และซับไตเติล</p>
<h1>ซับไตเติลภาษาเกาหลีและจีนตัวย่อ</h1>
<p class="lead">Premiere ถอดเสียงเป็นข้อความด้วย Speech to Text แล้วสร้างเป็น captions บน timeline ได้ ใช้กับภาษาเกาหลีและจีนตัวย่อได้ทั้งคู่ แต่ภาษากลุ่ม CJK ต้องตั้งความยาวบรรทัดคนละแบบกับภาษาอังกฤษ และต้องใช้ฟอนต์ที่มีตัวอักษรของภาษานั้น</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe และ Netflix</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>ติดตั้ง language pack ก่อน</b> Premiere มี language pack ภาษาอังกฤษมาให้ ส่วนภาษาเกาหลี (Korean) และจีนกลางตัวย่อ (Simplified Chinese, Mandarin) ต้องดาวน์โหลดแยก ติดตั้งแล้วถอดเสียงได้โดยไม่ต้องต่ออินเทอร์เน็ต</p></div>
<div class="demo" data-demo="captions"></div>

<h2 id="steps">ขั้นตอน</h2>
<ol class="steps">
<li><h3>เปิด Text panel และถอดเสียง</h3><p>ไปที่ <span class="ui">Window › Text</span> แท็บ <span class="ui">Transcript</span> เลือกภาษาให้ตรงกับเสียงพูด (Korean หรือ Simplified Chinese) แล้วกด <span class="ui">Transcribe</span></p></li>
<li><h3>ตรวจ transcript ก่อน</h3><p>อ่านทวนและแก้คำผิด ชื่อคน ชื่อสินค้า ศัพท์เฉพาะ ในแท็บ Transcript ให้เรียบร้อย แก้ตรงนี้ครั้งเดียวดีกว่าไปแก้ทีละซับ</p></li>
<li><h3>สร้าง captions และตั้งความยาวบรรทัด</h3><p>เปิดเมนู (ไอคอนสามขีด) ในแท็บ Transcript เลือก <span class="ui">Create Captions</span> ช่อง <span class="ui">Maximum length in characters</span> มีค่าเริ่มต้น 42 ซึ่งเหมาะกับภาษาอังกฤษ สำหรับเกาหลีและจีนตัวย่อให้ลดลงประมาณ 16 (ดูตารางด้านล่าง) แล้วเลือกบรรทัดเดียวหรือสองบรรทัด</p>
<p class="note">ค่าอื่นในหน้าต่างนี้ เช่น Minimum duration in seconds (ค่าเริ่มต้น 3) และ Gap between captions ปรับตามงาน</p></li>
<li><h3>เลือกฟอนต์ที่รองรับภาษา</h3><p>เลือก caption track แล้วตั้งฟอนต์ใน Properties panel ให้เป็นฟอนต์ที่มีตัวอักษรเกาหลีหรือจีน เช่น ตระกูล Source Han Sans ถ้าฟอนต์ไม่มีตัวอักษร จะขึ้นเป็นกล่องสี่เหลี่ยมแทน</p></li>
<li><h3>แปลซับ (ถ้าต้องการ)</h3><p>ในแท็บ <span class="ui">Captions</span> ของ Text panel กดปุ่ม <span class="ui">Translate Captions</span> ด้านบน เลือกภาษาปลายทางแล้วกด Translate ซับที่แปลแล้วต้องให้คนที่อ่านภาษานั้นได้ตรวจอีกรอบ</p></li>
<li><h3>Export ซับ</h3><p>ในหน้า Export ส่วน Captions เลือกว่าจะฝังซับลงภาพ (<span class="ui">Burn Captions Into Video</span>) หรือส่งเป็นไฟล์แยก (<span class="ui">Create Sidecar File</span>) เช่น SRT สำหรับอัปโหลดขึ้นแพลตฟอร์มให้คนดูเปิดปิดเองได้</p></li>
</ol>

<h2 id="limits">ความยาวบรรทัดและความเร็วในการอ่าน</h2>
<p>ค่าด้านล่างมาจาก Timed Text Style Guide ของ Netflix ซึ่งเป็นมาตรฐานที่คนทำซับใช้อ้างอิงกันมาก แม้งานจะไม่ได้ส่ง Netflix ก็ใช้เป็นจุดเริ่มได้</p>
<div class="tbl"><table class="stack">
<thead><tr><th>ภาษา</th><th>ตัวอักษรต่อบรรทัด</th><th>ความเร็วอ่านสูงสุด (ผู้ใหญ่)</th><th>หมายเหตุ</th></tr></thead>
<tbody>
<tr><td>เกาหลี</td><td class="n">16</td><td class="n">12 ตัว/วินาที</td><td>อักษรละติน เว้นวรรค และเครื่องหมายวรรคตอนนับเป็น 0.5 ตัว</td></tr>
<tr><td>จีนตัวย่อ</td><td class="n">16</td><td class="n">9 ตัว/วินาที</td><td>ปกติให้อยู่บรรทัดเดียว ถ้าต้องขึ้นสองบรรทัด ให้บรรทัดล่างยาวกว่าบรรทัดบน</td></tr>
<tr><td>อังกฤษ (เทียบ)</td><td class="n">42</td><td>–</td><td>ใช้กับภาษาที่เขียนด้วยอักษรละตินส่วนใหญ่</td></tr>
</tbody></table></div>
<p class="note">ระบบตรวจอัตโนมัติของ Netflix บังคับเพดานไว้ที่ 23 ตัวต่อบรรทัดสำหรับเกาหลีและจีน ถ้าเกินนี้ไฟล์จะไม่ผ่าน ส่วน 16 คือค่าที่ควรใช้ตามคู่มือ</p>

<h2 id="import">มีไฟล์ซับจากที่อื่นอยู่แล้ว</h2>
<p>ถ้าได้ไฟล์ SRT จากนักแปลหรือบริการถอดเสียงอื่น import เข้า Project panel ได้เลย แล้วลากลง sequence เป็น caption track จากนั้นตั้งฟอนต์และตรวจเวลาเหมือนซับที่สร้างใน Premiere</p>

<h2 id="mistakes">จุดที่มือใหม่พลาดบ่อย</h2>
<ul class="mist">
<li><b>ตัวอักษรเป็นกล่องสี่เหลี่ยม</b>ฟอนต์ไม่มีตัวอักษรเกาหลีหรือจีน เปลี่ยนเป็นฟอนต์ที่รองรับ CJK</li>
<li><b>ใช้ค่า 42 ตัวกับภาษาเกาหลีหรือจีน</b>บรรทัดยาวจนล้นจอหรืออ่านไม่ทัน ลดลงประมาณ 16 ตอน Create Captions</li>
<li><b>เลือกภาษาผิดตอนถอดเสียง</b>ผลออกมาเป็นคำมั่ว ๆ เช็กภาษาใน Transcript ก่อนกด Transcribe และติดตั้ง language pack ให้ครบ</li>
<li><b>ผลการแบ่งบรรทัดไม่ตรงกับค่าที่ตั้ง</b>Premiere แบ่งซับตามจังหวะการพูดด้วย บางซับอาจยาวหรือสั้นกว่าที่ตั้ง ต้องไล่ตรวจเองเสมอ</li>
<li><b>ฝังซับลงภาพแล้วต้องแก้คำผิด</b>ต้อง export ใหม่ทั้งไฟล์ ถ้าแพลตฟอร์มรองรับ ส่งเป็นไฟล์ SRT แยกจะแก้ง่ายกว่า</li>
</ul>

<template id="t-th-audio">
<p class="crumb">Premiere › สี เสียง และซับไตเติล</p>
<h1>เสียงและเพลง</h1>
<p class="lead">คนดูให้อภัยภาพไม่สวยได้มากกว่าเสียงที่ฟังไม่รู้เรื่อง หลักง่าย ๆ คือเสียงพูดต้องชัด เพลงอยู่ข้างหลัง และไม่มีจุดไหนดังเกิน 0 dB งานส่วนใหญ่ทำได้จาก Essential Sound panel</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>บอก Premiere ก่อนว่าคลิปไหนเป็นเสียงอะไร</b> เลือกคลิปแล้วกด Dialogue, Music, SFX หรือ Ambience ใน Essential Sound panel ตัวเลือกที่เหลือจะปรับตามประเภทที่เลือก</p></div>
<div class="demo" data-demo="audio"></div>

<h2 id="types">ประเภทเสียงใน Essential Sound</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>ประเภท</th><th>ใช้กับ</th><th>ตัวเลือกที่ใช้บ่อย</th></tr></thead>
<tbody>
<tr><td>Dialogue</td><td>เสียงพูด สัมภาษณ์ voice-over</td><td>Loudness Auto-Match, Enhance Speech, Repair, Clarity</td></tr>
<tr><td>Music</td><td>เพลงประกอบ</td><td>Loudness Auto-Match, Ducking</td></tr>
<tr><td>SFX</td><td>เสียง<span class="nw">เอฟเฟกต์</span> เช่นเสียงประตู เสียง whoosh</td><td>Loudness, ปรับตำแหน่งซ้ายขวา</td></tr>
<tr><td>Ambience</td><td>เสียงบรรยากาศ เช่นเสียงคน เสียงลม</td><td>Loudness, Reverb</td></tr>
</tbody></table></div>

<h2 id="steps">ขั้นตอนมิกซ์เสียงพื้นฐาน</h2>
<ol class="steps">
<li><h3>แยก track ให้เป็นระเบียบ</h3><p>วางเสียงพูดไว้ A1–A2 เพลงไว้ A3 เสียง<span class="nw">เอฟเฟกต์</span>ไว้ A4 จะเลือกคลิปประเภทเดียวกันได้ทีเดียว ถ้าอยากทำงานในเลย์เอาต์ที่เหมาะ เลือก workspace <span class="ui">Audio</span></p></li>
<li><h3>ตั้งประเภทและกด Auto-Match</h3><p>เลือกคลิปเสียงพูดทั้งหมด กด <span class="ui">Dialogue</span> แล้วกด <span class="ui">Auto-Match</span> ในส่วน Loudness ทุกคลิปจะดังใกล้เคียงกัน ทำแบบเดียวกันกับเพลงโดยเลือก <span class="ui">Music</span></p></li>
<li><h3>ทำเสียงพูดให้ชัดด้วย Enhance Speech</h3><p>ในแท็บ Dialogue กด <span class="ui">Enhance</span> ใต้ Enhance Speech รอประมวลผลเสร็จแล้วปรับ <span class="ui">Mix Amount</span> ถ้าเสียงฟังดูไม่เป็นธรรมชาติ ให้ลดลงเพื่อผสมเสียงต้นฉบับกลับเข้าไป</p>
<p class="note">Enhance Speech ใช้กับเสียงพูดเท่านั้น ไม่เหมาะกับเพลงหรือเสียง<span class="nw">เอฟเฟกต์</span></p></li>
<li><h3>ให้เพลงหลบเสียงพูดด้วย Ducking</h3><p>เลือกคลิปเพลง เปิด <span class="ui">Ducking</span> เลือกประเภทเสียงที่จะให้เพลงหลบ (เช่น Dialogue) ตั้ง Sensitivity, Reduce By และ Fades แล้วกด <span class="ui">Generate Keyframes</span> Premiere จะใส่ keyframe ลดเสียงเพลงตรงที่มีคนพูด</p>
<p class="note">กด Generate Keyframes ซ้ำได้ทุกเมื่อ keyframe เดิมจะถูกแทนด้วยชุดใหม่ตามค่าที่ตั้ง</p></li>
<li><h3>ดู Audio Meter ตอนเล่นทั้งเรื่อง</h3><p>เล่นตั้งแต่ต้นจนจบแล้วดูแถบ Audio Meter ข้าง timeline ห้ามแตะสีแดงด้านบน (0 dB) ถ้าแตะ ให้ลดความดังของคลิปนั้นด้วย <span class="ui">Audio Gain</span> (<kbd>G</kbd>)</p></li>
</ol>

<h2 id="tips">เคล็ดลับเพิ่มเติม</h2>
<ul class="check">
<li><span><b>ฟังทั้งหูฟังและลำโพง</b> หูฟังช่วยจับเสียงรบกวน ลำโพงช่วยบอกว่าเพลงดังเกินไหม</span></li>
<li><span><b>ปรับความดังเป็นช่วงด้วย keyframe</b> กด <kbd>Ctrl</kbd> (Windows) หรือ <kbd>Cmd</kbd> (Mac) แล้วคลิกบนเส้นระดับเสียงของคลิปใน timeline เพื่อเพิ่ม keyframe</span></li>
<li><span><b>สร้างเพลงหรือเสียง<span class="nw">เอฟเฟกต์</span>ได้ใน 27.0</b> Premiere 27.0 สร้างเพลง เสียง<span class="nw">เอฟเฟกต์</span> และเสียงบรรยากาศด้วย AI ได้ ควรเช็กเงื่อนไขการใช้งานและเครดิตที่ใช้ก่อน</span></li>
<li><span><b>ใช้เพลงที่มีสิทธิ์</b> เพลงจากแอปฟังเพลงหรือ YouTube อาจทำให้วิดีโอโดนลิขสิทธิ์ ใช้เพลงจากคลังที่มีใบอนุญาต เช่น Adobe Stock</span></li>
</ul>

<h2 id="mistakes">ข้อผิดพลาดที่มือใหม่เจอบ่อย</h2>
<ul class="mist">
<li><b>เพลงกลบเสียงพูด</b>เปิด Ducking หรือลดระดับเพลงลงอีก ช่วงที่มีคนพูดเพลงควรเบากว่าเสียงพูดชัดเจน</li>
<li><b>เสียงแตก</b>ระดับเสียงรวมเกิน 0 dB ลด Audio Gain ของคลิปที่ดังที่สุด ไม่ใช่ลดเสียงลำโพงของตัวเอง</li>
<li><b>ปรับความดังทีละคลิปด้วยมือ</b>ใช้ Auto-Match กับคลิปประเภทเดียวกันพร้อมกันจะเร็วและสม่ำเสมอกว่า</li>
<li><b>ใช้ Enhance Speech แรงเกิน</b>เสียงอาจฟังเหมือนหุ่นยนต์หรือคำเพี้ยน ลด Mix Amount ลงและฟังซ้ำ</li>
</ul>

<h2 id="older">ถ้าใช้<span class="nw">เวอร์ชัน</span>เก่ากว่า 27.0</h2>
<details class="old"><summary>Premiere 25.x–26.x</summary><ul>

<p class="lead">Resolution คือขนาดภาพเป็น<span class="nw">พิกเซล</span> frame rate คือจำนวนภาพต่อวินาที ส่วน preset คือชุดค่าที่ตั้งไว้ล่วงหน้าให้เลือกใช้ ทั้งตอนสร้าง sequence และตอน export หน้านี้สรุปค่าที่ใช้กับงานทั่วไปพร้อมเหตุผล</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center และ YouTube Help</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>หลักง่าย ๆ ที่ใช้ได้เกือบทุกงาน:</b> ตั้ง sequence ให้ตรงกับปลายทาง แล้วตอน export ใช้ preset แบบ Match Source ซึ่งดึงค่าจาก sequence มาให้อัตโนมัติ ปรับเพิ่มเฉพาะที่จำเป็น</p></div>

<h2 id="res">Resolution ที่เจอบ่อย</h2>

<tr><td>แนวตั้ง 9:16</td><td class="n">1080 × 1920</td><td>9:16</td><td>YouTube Shorts, Instagram Reels, TikTok</td></tr>
<tr><td>4:5</td><td class="n">1080 × 1350</td><td>4:5</td><td>โพสต์วิดีโอใน feed ของ Instagram</td></tr>

<h2 id="fps">Frame rate เลือกยังไง</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Frame rate</th><th>ให้ความรู้สึก</th><th>ใช้กับ</th></tr></thead>
<tbody>
<tr><td class="n">23.976 / 24</td><td>ลุคภาพยนตร์</td><td>หนังสั้น MV งานที่อยากได้อารมณ์ฟิล์ม</td></tr>
<tr><td class="n">25</td><td>ลื่นแบบทีวีระบบ PAL</td><td>ประเทศที่ใช้ไฟ 50Hz เช่น ไทยและจีน ถ่าย 25 ช่วยลดไฟกะพริบในที่ร่ม เหมาะกับงานอีเวนต์และส่งทีวี</td></tr>
<tr><td class="n">29.97 / 30</td><td>ลื่นแบบทีวีระบบ NTSC</td><td>ประเทศที่ใช้ไฟ 60Hz เช่น เกาหลี และฟุตเทจจากมือถือหลายรุ่นตั้งมาเป็นค่านี้</td></tr>
<tr><td class="n">50</td><td>ลื่นมาก</td><td>กีฬา หรือถ่ายไว้ทำสโลว์ 2 เท่าใน sequence 25</td></tr>
<tr><td class="n">59.94 / 60</td><td>ลื่นมาก</td><td>เกม ทำสโลว์ 2 เท่าใน sequence 30</td></tr>
</tbody></table></div>
<p>YouTube แนะนำให้ export ด้วย frame rate เดียวกับที่ถ่ายมา อย่าแปลงจาก 25 เป็น 30 หรือกลับกันถ้าไม่จำเป็น เพราะภาพจะกระตุก</p>

<h2 id="export">Export ด้วย preset</h2>
<ol class="steps">
<li><h3>เปิดหน้า Export</h3><p>เลือก sequence แล้วคลิกแท็บ <span class="ui">Export</span> บนแถบด้านบนของหน้าต่าง</p></li>
<li><h3>เลือก Format และ Preset</h3><p>Format <span class="ui">H.264</span> ใช้ได้กับเกือบทุกที่ แล้วเลือก Preset <span class="ui">Match Source – Adaptive High Bitrate</span> ซึ่งใช้ขนาดภาพและ frame rate เดียวกับ sequence</p></li>
<li><h3>ตรวจค่าที่สำคัญ</h3><p>ดู Frame Size และ Frame Rate ให้ตรงกับที่ตั้งใจ Export Color Space ปล่อยเป็น Rec. 709 ตามค่าเริ่มต้นสำหรับงาน SDR ทั่วไป</p></li>
<li><h3>ปรับ bitrate ถ้าจำเป็น</h3><p>VBR 1 pass เร็ว VBR 2 pass ช้ากว่าแต่มักได้คุณภาพดีกว่า ส่วน Hardware Accelerated encoding เปิดไว้เป็นค่าเริ่มต้นเพื่อให้ export เร็วขึ้น</p></li>
<li><h3>เก็บเป็น preset ของตัวเอง</h3><p>ตั้งค่าที่ใช้ประจำเสร็จแล้วบันทึกเป็น preset เช่น "Reels 1080x1920 25p" ครั้งหน้าเลือกได้ทันที</p></li>
</ol>

<h2 id="mistakes">จุดที่มือใหม่พลาดบ่อย</h2>
<ul class="mist">
<li><b>export ใหญ่กว่า sequence แล้วหวังว่าจะคมขึ้น</b>ภาพจาก sequence 1080p ที่ export เป็น 4K ไม่ได้คมขึ้น แค่ไฟล์ใหญ่ขึ้น ถ้าต้องย่อหรือขยายภาพ เปิด Use Maximum Render Quality ช่วยลดรอยหยัก</li>
<li><b>bitrate ต่ำเกินไป</b>ฉากที่มีการเคลื่อนไหวเยอะจะแตกเป็นบล็อก ใช้ค่าตามตาราง YouTube เป็นจุดเริ่ม</li>
<li><b>frame rate ไม่ตรงกับ sequence</b>ภาพกระตุก ใช้ Match Source จะไม่พลาด</li>
<li><b>ส่งงานแนวตั้งเป็นไฟล์แนวนอน</b>มีขอบดำซ้ายขวา ตั้ง sequence แนวตั้งตั้งแต่แรก</li>
<li><b>ตัด 4K แล้วเครื่องหน่วง</b>สร้าง proxy เพื่อตัดต่อ แล้ว export จากไฟล์ต้นฉบับ</li>
</ul>

<template id="t-th-export">
<p class="crumb">Premiere › ส่งออก</p>
<h1>Export วิดีโอ</h1>
<p class="lead">Export คือการเปลี่ยน sequence ให้เป็นไฟล์วิดีโอที่เปิดดูได้ทุกที่ ใน Premiere ให้เริ่มจากถามตัวเองว่าจะเอาไฟล์ไปไว้ที่ไหน แล้วเลือก preset ที่เหมาะกับปลายทางนั้น</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>ดู Range ทุกครั้ง</b> ถ้ามีจุด In/Out ค้างอยู่ใน sequence Premiere อาจ export แค่ช่วงนั้น ตั้ง Range เป็น <span class="ui">Entire Source</span> ถ้าต้องการทั้งเรื่อง</p></div>
<div class="demo" data-demo="export"></div>

<h2 id="ways">สามทางในการ export</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>วิธี</th><th>เหมาะกับ</th><th>อยู่ตรงไหน</th></tr></thead>
<tbody>
<tr><td>Export mode</td><td>งานทั่วไป ตั้งค่าได้ครบ</td><td>แท็บ Export บน header bar หรือ <kbd>Ctrl</kbd>+<kbd>M</kbd> / <kbd>Cmd</kbd>+<kbd>M</kbd></td></tr>
<tr><td>Quick Export</td><td>ส่งไฟล์ด่วนด้วย preset สำเร็จรูป</td><td>ปุ่มมุมขวาบนของ header bar</td></tr>
<tr><td>Send to Media Encoder</td><td>หลายไฟล์ หลายสเปก หรืออยากตัดต่อต่อระหว่าง export</td><td>ปุ่มล่างขวาของ Export mode</td></tr>
</tbody></table></div>

<h2 id="steps">ขั้นตอนใน Export mode</h2>
<ol class="steps">
<li><h3>เลือก sequence แล้วเข้า Export mode</h3><p>คลิกที่ timeline หรือ sequence ใน Project panel ก่อน แล้วกดแท็บ <span class="ui">Export</span></p></li>
<li><h3>เลือกปลายทาง</h3><p>ด้านซ้ายมี <span class="ui">Media File</span> สำหรับไฟล์ทั่วไป และปลายทางโซเชียลบางแห่งที่อัปโหลดให้ได้เลย</p></li>
<li><h3>ตั้งชื่อไฟล์ ที่เก็บ และ preset</h3><p>ตั้ง File Name และ Location ให้หาเจอง่าย แล้วเลือก Preset เช่น <span class="ui">Match Source – Adaptive High Bitrate</span> ซึ่งใช้ codec H.264 ขนาดและ frame rate ตาม sequence</p></li>
<li><h3>เช็ก Range และ Captions</h3><p>Range ใต้ภาพตัวอย่างมี Entire Source, Source In/Out, Work Area และ Custom ถ้ามีซับ ให้เลือกในส่วน <span class="ui">Captions</span> ว่าจะไม่ใส่ ส่งเป็นไฟล์แยก (sidecar) หรือฝังลงในภาพ</p></li>
<li><h3>ดูขนาดไฟล์โดยประมาณแล้วกด Export</h3><p>ด้านล่างขวาบอก Estimated File Size ถ้าใหญ่เกินที่ส่งได้ ลอง preset Medium Bitrate กด <span class="ui">Export</span> แล้วรอจนเสร็จ</p></li>
<li><h3>เปิดดูไฟล์ที่ได้</h3><p>เปิดไฟล์จริงดูตั้งแต่ต้นจนจบ เช็กภาพ เสียง ซับ และช่วงท้ายว่าไม่มีภาพดำเกิน</p></li>
</ol>

<h2 id="settings">ค่าที่ควรรู้จัก</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>ค่า</th><th>ความหมาย</th></tr></thead>
<tbody>
<tr><td>Format</td><td>ชนิดไฟล์และ codec เช่น H.264 (MP4), HEVC, QuickTime (ProRes)</td></tr>
<tr><td>Match Source</td><td>ใช้ขนาดภาพและ frame rate ตามต้นฉบับอัตโนมัติ</td></tr>
<tr><td>Bitrate</td><td>ปริมาณข้อมูลต่อวินาที ยิ่งสูงยิ่งคมแต่ไฟล์ใหญ่ VBR ปรับตามความซับซ้อนของภาพ ส่วน CBR คงที่ตลอด</td></tr>
<tr><td>Use Maximum Render Quality</td><td>ช่วยคุณภาพตอนย่อขนาดภาพ แต่ใช้เวลานานขึ้น</td></tr>
<tr><td>Content Credentials</td><td>แนบข้อมูลว่าใครสร้างและแก้ไขไฟล์ไว้ในไฟล์ (เลือกเปิดได้)</td></tr>
</tbody></table></div>
<p class="note">ขนาดภาพและ preset สำหรับปลายทางต่าง ๆ ดูเพิ่มที่หน้า <a href="#th-presets-resolution">Preset และ Resolution ที่ใช้บ่อย</a></p>

<h2 id="mistakes">ข้อผิดพลาดที่มือใหม่เจอบ่อย</h2>
<ul class="mist">
<li><b>ได้วิดีโอแค่บางช่วง</b>Range ถูกตั้งเป็น Source In/Out จากจุด In/Out ที่ค้างไว้ เปลี่ยนเป็น Entire Source</li>
<li><b>หาไฟล์ไม่เจอ</b>ดู Location ก่อนกด Export และตั้งชื่อไฟล์ให้มีวันที่หรือ<span class="nw">เวอร์ชัน</span></li>
<li><b>ซับหายในไฟล์ที่ได้</b>เปิดส่วน Captions แล้วเลือกฝังลงภาพหรือส่งเป็นไฟล์แยก ถ้าเลือก None จะไม่มีซับ</li>
<li><b>ภาพดำหรือภาพค้างตอนท้าย</b>มีคลิปหรือกราฟิกเกินจุดจบของเรื่อง ลบออกหรือตั้ง Range ให้ตรง</li>
<li><b>ไฟล์ใหญ่เกินส่งไม่ได้</b>ลด bitrate ด้วย preset Medium หรือ Low อย่าลดขนาดภาพจนเล็กกว่าที่ปลายทางต้องการ</li>
</ul>

<p class="crumb">After Effects</p>
<h1>Composition และ Layer</h1>
<p class="lead">ใน After Effects งานหนึ่งชิ้นเรียกว่า <b>composition</b> มีขนาดภาพ frame rate และความยาวของตัวเอง ข้างในประกอบด้วย <b>layer</b> ที่ซ้อนกันเหมือนแผ่นใส layer ที่อยู่บนจะบังของที่อยู่ข้างล่าง</p>
<ul class="meta"><li class="ver">After Effects 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>ต่างจาก Premiere ตรงนี้:</b> track ใน Premiere วางได้หลายคลิปต่อกัน แต่ layer ใน After Effects มีต้นฉบับได้แค่ชิ้นเดียว งานหนึ่งจึงมักมี layer หลายสิบชั้น</p></div>
<div class="demo" data-demo="ae-comp-layers"></div>

<h2 id="comp">สร้าง composition</h2>
<ol class="steps">
<li><h3>สร้างจากฟุตเทจ (ง่ายสุด)</h3><p>ลากไฟล์วิดีโอจาก Project panel ไปวางบนไอคอน New Composition ด้านล่างของพาเนล composition จะได้ขนาดและ frame rate ตามไฟล์นั้น</p></li>
<li><h3>หรือสร้างเอง</h3><p>เลือก <span class="ui">Composition › New Composition</span> (<kbd>Ctrl</kbd>+<kbd>N</kbd> / <kbd>Cmd</kbd>+<kbd>N</kbd>) เลือก Preset หรือพิมพ์ Width, Height, Frame Rate และ Duration เอง</p></li>
<li><h3>แก้ค่าทีหลังได้</h3><p>เลือก <span class="ui">Composition › Composition Settings</span> (<kbd>Ctrl</kbd>+<kbd>K</kbd> / <kbd>Cmd</kbd>+<kbd>K</kbd>) เปลี่ยนความยาวหรือขนาดได้ตลอด</p></li>
</ol>

<h2 id="types">ชนิดของ layer</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Layer</th><th>คืออะไร</th><th>สร้างจาก</th></tr></thead>
<tbody>
<tr><td>Footage</td><td>วิดีโอ ภาพนิ่ง หรือเสียงที่ import มา</td><td>ลากจาก Project panel</td></tr>
<tr><td>Text</td><td>ตัวหนังสือที่แก้และ animate ได้</td><td><span class="ui">Layer › New › Text</span></td></tr>
<tr><td>Shape</td><td>รูปทรงเวกเตอร์ คมทุกขนาด</td><td>Shape tools หรือ Pen tool</td></tr>
<tr><td>Solid</td><td>พื้นสีเรียบ ใช้เป็นพื้นหลังหรือที่ใส่<span class="nw">เอฟเฟกต์</span></td><td><kbd>Ctrl</kbd>+<kbd>Y</kbd> / <kbd>Cmd</kbd>+<kbd>Y</kbd></td></tr>
<tr><td>Adjustment</td><td>ใส่<span class="nw">เอฟเฟกต์</span>แล้วมีผลกับทุก layer ข้างล่าง</td><td><span class="ui">Layer › New › Adjustment Layer</span></td></tr>
<tr><td>Null Object</td><td>layer ที่มองไม่เห็น ใช้คุมการเคลื่อนไหวของ layer อื่น</td><td><span class="ui">Layer › New › Null Object</span></td></tr>
<tr><td>Precomp</td><td>composition ที่ถูกวางเป็น layer ในอีก composition</td><td><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd> / <kbd>Cmd</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd></td></tr>
</tbody></table></div>

<h2 id="transform">Transform: ห้าค่าที่ทุก layer มี</h2>
<p>กดตัวอักษรเพื่อเปิดดูค่านั้นของ layer ที่เลือก: <kbd>A</kbd> Anchor Point · <kbd>P</kbd> Position · <kbd>S</kbd> Scale · <kbd>R</kbd> Rotation · <kbd>T</kbd> Opacity กด <kbd>Shift</kbd> ค้างแล้วกดตัวอื่นเพื่อเปิดหลายค่าพร้อมกัน</p>

<h2 id="preview">ดูผลงาน</h2>
<ul class="check">
<li><span><b>กด Spacebar เพื่อ preview</b> แถบสีเขียวบน timeline คือช่วงที่ cache ไว้แล้ว จะเล่นลื่น</span></li>
<li><span><b>ลด Resolution ของ Composition panel</b> เลือก Half หรือ Quarter ตอนทำงานเพื่อให้ preview เร็วขึ้น ค่านี้ไม่ได้เปลี่ยนขนาดของ composition</span></li>
<li><span><b>ตั้ง work area</b> กด <kbd>B</kbd> และ <kbd>N</kbd> เพื่อตั้งจุดเริ่มและจุดจบของช่วงที่จะ preview</span></li>
</ul>

<h2 id="mistakes">ข้อผิดพลาดที่มือใหม่เจอบ่อย</h2>
<ul class="mist">
<li><b>ใส่ของแล้วมองไม่เห็น</b>layer อาจอยู่ล่าง layer พื้นทึบ ลาก layer ขึ้นไปข้างบนใน Timeline</li>
<li><b>งงระหว่าง Resolution กับขนาด composition</b>Resolution ใน Composition panel คือคุณภาพตอน preview ส่วนขนาดจริงอยู่ใน Composition Settings</li>
<li><b>composition สั้นกว่าที่ต้องการ</b>เปลี่ยน Duration ใน Composition Settings ไม่ใช่ลากปลาย layer</li>
<li><b>แก้ผิด composition</b>ดูชื่อแท็บด้านบนของ Timeline ก่อนแก้ทุกครั้ง โดยเฉพาะเมื่อมี precomp หลายชั้น</li>
</ul>

<li>การสร้าง composition และ layer เหมือนเดิมทั้งหมด</li>
<li>Adobe Stock panel และ AI Assistant เพิ่มเข้ามาใน 27.0</li></ul></details>

<template id="t-th-ae-keyframes">
<p class="crumb">After Effects</p>
<h1>Keyframe ใน After Effects</h1>
<p class="lead">keyframe คือจุดที่บอกว่า ณ เวลานี้ค่านี้ต้องเป็นเท่าไร After Effects จะเติมค่าระหว่าง keyframe ให้เอง สิ่งที่ทำให้งานดูเป็นมืออาชีพคือ <b>จังหวะ</b> ระหว่าง keyframe ซึ่งคุมได้ด้วย Easy Ease และ Graph Editor</p>
<ul class="meta"><li class="ver">After Effects 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>เลือก keyframe แล้วกด <kbd>F9</kbd></b> การเคลื่อนไหวจะค่อย ๆ เร่งออกและค่อย ๆ ช้าลงก่อนหยุด แทนที่จะพุ่งแล้วหยุดทันที ลองเทียบในเดโมด้านล่าง</p></div>
<div class="demo" data-demo="ae-keyframes"></div>

<h2 id="steps">ขั้นตอนทำ keyframe แรก</h2>
<ol class="steps">
<li><h3>เปิดค่าที่จะขยับ</h3><p>เลือก layer แล้วกด <kbd>P</kbd> เพื่อเปิด Position (หรือ <kbd>S</kbd> Scale, <kbd>R</kbd> Rotation, <kbd>T</kbd> Opacity)</p></li>
<li><h3>กดนาฬิกาจับเวลา</h3><p>เลื่อน playhead ไปที่จุดเริ่ม แล้วคลิกไอคอนนาฬิกา (stopwatch) หน้าชื่อค่า จะได้ keyframe แรก</p>
<p class="note"><span class="nw">คีย์ลัด</span>เพิ่ม keyframe Position: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> (Windows) หรือ <kbd>Option</kbd>+<kbd>P</kbd> (Mac)</p></li>
<li><h3>เลื่อนเวลาแล้วเปลี่ยนค่า</h3><p>เลื่อน playhead ไปข้างหน้า แล้วลาก layer ใน Composition panel หรือพิมพ์ค่าใหม่ After Effects สร้าง keyframe ที่สองให้เอง</p></li>
<li><h3>ใส่ Easy Ease</h3><p>ลากคลุม keyframe ทั้งสองแล้วกด <kbd>F9</kbd> ไอคอน keyframe จะเปลี่ยนจากสี่เหลี่ยมขนมเปียกปูนเป็นรูปนาฬิกาทราย</p></li>
<li><h3>ปรับจังหวะใน Graph Editor</h3><p>กด <kbd>Shift</kbd>+<kbd>F3</kbd> เพื่อเปิด Graph Editor ลากด้ามจับ (handle) ของ keyframe ออกห่างเพื่อเพิ่ม influence การเร่งและชะลอจะชัดขึ้น</p></li>
</ol>

<h2 id="graphs">Value graph กับ Speed graph</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>กราฟ</th><th>แสดงอะไร</th><th>ใช้ตอนไหน</th></tr></thead>
<tbody>
<tr><td>Value Graph</td><td>ค่าจริงของ property ในแต่ละเวลา (X สีแดง, Y สีเขียว)</td><td>อยากเห็นว่าค่าวิ่งไปถึงไหน หรือทำ overshoot</td></tr>
<tr><td>Speed Graph</td><td>ความเร็วของการเปลี่ยนค่า</td><td>อยากคุมความเร็ว เช่นให้เร่งแรงตอนออกตัว</td></tr>
</tbody></table></div>
<p>ใน Composition panel เส้นทางการเคลื่อนที่ (motion path) มีจุดเล็ก ๆ หนึ่งจุดต่อหนึ่งเฟรม จุดห่างกันแปลว่าเร็ว จุดชิดกันแปลว่าช้า</p>

<h2 id="types">ชนิดของ interpolation</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>ชนิด</th><th>ผลลัพธ์</th></tr></thead>
<tbody>
<tr><td>Linear</td><td>ความเร็วคงที่ เปลี่ยนจังหวะทันทีที่ keyframe ดูแข็ง</td></tr>
<tr><td>Bezier / Easy Ease</td><td>เร่งและชะลออย่างนุ่มนวล Easy Ease ใช้ influence 33.33% เป็นค่าเริ่มต้น</td></tr>
<tr><td>Auto Bezier</td><td>ค่าเริ่มต้นของเส้นทางการเคลื่อนที่ ทำให้ทางโค้งนุ่ม</td></tr>
<tr><td>Hold</td><td>ค่าคงที่จนถึง keyframe ถัดไปแล้วกระโดดเปลี่ยน ใช้ทำ<span class="nw">เอฟเฟกต์</span>กระตุกหรือข้อความเปลี่ยนทันที</td></tr>
</tbody></table></div>
<p class="note">เปลี่ยนชนิดได้โดยคลิกขวาที่ keyframe › <span class="ui">Keyframe Interpolation</span></p>

<h2 id="keys"><span class="nw">คีย์ลัด</span>ที่ใช้บ่อย</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>คีย์</th><th>ทำอะไร</th></tr></thead>
<tbody>
<tr><td><kbd>J</kbd> / <kbd>K</kbd></td><td>ไป keyframe (หรือ marker) ก่อนหน้า / ถัดไป</td></tr>
<tr><td><kbd>U</kbd></td><td>แสดงเฉพาะค่าที่มี keyframe</td></tr>
<tr><td><kbd>F9</kbd></td><td>Easy Ease</td></tr>
<tr><td><kbd>Shift</kbd>+<kbd>F9</kbd></td><td>Easy Ease In</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>F9</kbd> / <kbd>Cmd</kbd>+<kbd>Shift</kbd>+<kbd>F9</kbd></td><td>Easy Ease Out</td></tr>
<tr><td><kbd>Shift</kbd>+<kbd>F3</kbd></td><td>เปิดปิด Graph Editor</td></tr>
<tr><td><kbd>Alt</kbd>+<kbd>←</kbd>/<kbd>→</kbd> / <kbd>Option</kbd>+<kbd>←</kbd>/<kbd>→</kbd></td><td>เลื่อน keyframe ที่เลือกทีละ 1 เฟรม</td></tr>
</tbody></table></div>

<h2 id="mistakes">ข้อผิดพลาดที่มือใหม่เจอบ่อย</h2>
<ul class="mist">
<li><b>เปลี่ยนค่าแล้วมันเปลี่ยนทั้ง layer</b>ยังไม่ได้กด stopwatch ค่านั้นจึงไม่มี keyframe กด stopwatch ก่อนแล้วค่อยเปลี่ยนค่า</li>
<li><b>การเคลื่อนไหวเร็วหรือช้าเกิน</b>ลาก keyframe ให้ห่างกันเพื่อให้ช้าลง หรือชิดกันเพื่อให้เร็วขึ้น</li>
<li><b>ใส่ Easy Ease แล้วดูยืด</b>ลด influence ใน Graph Editor หรือใช้ Ease Out ที่ keyframe แรก Ease In ที่ keyframe สุดท้ายเท่านั้น</li>
<li><b>ลาก handle ใน Graph Editor ไม่ได้ผล</b>ดูว่าเปิด Speed Graph หรือ Value Graph อยู่ ทั้งสองแบบลาก handle แล้วได้ผลต่างกัน</li>
</ul>

<template id="t-th-ae-text">
<p class="crumb">After Effects</p>
<h1>ทำตัวหนังสือเคลื่อนไหว</h1>
<p class="lead">ตัวหนังสือใน After Effects ขยับได้ทั้ง layer หรือขยับทีละตัวอักษร ทีละคำ ทีละบรรทัด ด้วย <b>text animator</b> วิธีที่เร็วที่สุดคือเริ่มจาก animation preset แล้วค่อยแกะดูว่าข้างในตั้งค่าไว้อย่างไร</p>
<ul class="meta"><li class="ver">After Effects 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>แกะสูตรจาก preset:</b> ใส่ animation preset ให้ text layer แล้วกด <kbd>U</kbd> หรือ <kbd>UU</kbd> จะเห็นเฉพาะค่าที่ preset นั้นขยับหรือแก้ไว้</p></div>
<div class="demo" data-demo="ae-text"></div>

<h2 id="create">สร้าง text layer</h2>
<ol class="steps">
<li><h3>เลือก Type tool</h3><p>กด <kbd>Ctrl</kbd>+<kbd>T</kbd> / <kbd>Cmd</kbd>+<kbd>T</kbd> คลิกหนึ่งครั้งใน Composition panel เพื่อพิมพ์แบบบรรทัดเดียว (point text) หรือลากเป็นกรอบเพื่อพิมพ์แบบย่อหน้า (paragraph text)</p></li>
<li><h3>ตั้งฟอนต์และขนาด</h3><p>ใช้ Character panel หรือ Properties panel ถ้าพิมพ์ภาษาเกาหลีหรือจีน ต้องเลือกฟอนต์ที่มีตัวอักษรนั้น ไม่อย่างนั้นจะเห็นเป็นสี่เหลี่ยม</p></li>
</ol>

<h2 id="preset">วิธีที่ 1: ใช้ animation preset</h2>
<ol class="steps">
<li><h3>เปิด Effects &amp; Presets panel</h3><p>ไปที่ <span class="ui">Animation Presets › Text</span> จะเห็นหมวดเช่น Animate In, Animate Out, Blurs</p></li>
<li><h3>ลาก preset ไปวางบน text layer</h3><p>preset จะเริ่มที่ตำแหน่ง playhead กด Spacebar เพื่อดูผล</p>
<p class="note">ถ้าอยากเห็นตัวอย่างก่อนใช้ เลือก <span class="ui">Browse Presets</span> จากเมนูของ Effects &amp; Presets panel เพื่อเปิดใน Adobe Bridge</p></li>
</ol>

<h2 id="animator">วิธีที่ 2: ทำเองด้วย text animator</h2>
<ol class="steps">
<li><h3>เพิ่ม animator</h3><p>เปิด text layer ใน Timeline คลิก <span class="ui">Animate</span> แล้วเลือกค่าที่จะขยับ เช่น Opacity หรือ Position หรือใช้เมนู <span class="ui">Animation › Animate Text</span></p></li>
<li><h3>ตั้งค่า "ปลายทาง" ของตัวอักษร</h3><p>เช่นตั้ง Opacity เป็น 0% ตัวอักษรที่อยู่ในช่วงของ Range Selector จะได้ค่านี้</p></li>
<li><h3>animate ช่วงของ Range Selector</h3><p>เปิด <span class="ui">Range Selector 1</span> กด stopwatch ของ <span class="ui">Start</span> ที่ 0% แล้วเลื่อนเวลาไปข้างหน้าและตั้ง Start เป็น 100% ตัวอักษรจะค่อย ๆ ปรากฏทีละตัว</p></li>
<li><h3>เลือกหน่วยใน Advanced</h3><p>ใน Range Selector › Advanced › <span class="ui">Based On</span> เลือกได้ว่าจะนับเป็นตัวอักษร คำ หรือบรรทัด</p></li>
</ol>

<h2 id="ideas">ไอเดียที่ทำได้ด้วย animator</h2>
<ul class="check">
<li><span><b>พิมพ์ดีด</b> Opacity 0% แล้ว animate Start จาก 0 ถึง 100%</span></li>
<li><span><b>ลอยขึ้นทีละตัว</b> Position Y +30 และ Opacity 0% ด้วย Range Selector เดียวกัน</span></li>
<li><span><b>ตัวสั่น</b> เพิ่ม Wiggly Selector แทน Range Selector</span></li>
<li><span><b>น้ำหนักฟอนต์เปลี่ยน</b> ใช้ variable font แล้วเพิ่ม animator ของแกน Weight</span></li>
</ul>

<h2 id="mistakes">ข้อผิดพลาดที่มือใหม่เจอบ่อย</h2>
<ul class="mist">
<li><b>animate ทั้ง layer แทนที่จะเป็นทีละตัว</b>ค่า Transform ของ layer ขยับทั้งก้อน ถ้าอยากให้ทีละตัวต้องใช้ animator</li>
<li><b>Start กับ End สับสน</b>ตัวอักษรที่อยู่ระหว่าง Start และ End คือตัวที่ได้ค่าของ animator ลองดูแถบช่วงใน Composition panel ประกอบ</li>
<li><b>ตัวอักษรเกาหลีหรือจีนเป็นสี่เหลี่ยม</b>ฟอนต์ไม่มีตัวอักษรนั้น เปลี่ยนเป็นฟอนต์ที่รองรับภาษานั้น</li>
<li><b>ภาพตัวหนังสือดูกระตุก</b>เปิด motion blur ให้ text layer จะดูนุ่มขึ้น</li>
</ul>

<h2 id="older">ถ้าใช้<span class="nw">เวอร์ชัน</span>เก่ากว่า 27.0</h2>
<details class="old"><summary>After Effects 25.x–26.x</summary><ul>
<li>text animator และ Range Selector ใช้แบบเดียวกัน</li>
<li>การ animate แกนของ variable font มีตั้งแต่ 26.0</li>
<li>ข้อความจาก Illustrator ที่แก้ต่อได้ใน After Effects เพิ่มเข้ามาใน 27.0</li></ul></details>

<template id="t-th-ae-render">
<p class="crumb">After Effects</p>
<h1>Render และส่งออก</h1>
<p class="lead">After Effects ส่งงานออกเป็นไฟล์ผ่าน <b>Render Queue</b> ถ้าต้องการ MP4 ใช้ H.264 ได้ในตัว ถ้าต้องการพื้นหลังโปร่งใสหรือหลายไฟล์พร้อมกัน ก็มีทางเลือกของมัน</p>
<ul class="meta"><li class="ver">After Effects 27.0</li><li>อัปเดต 27 พ.ย. 2569</li><li>ระดับมือใหม่</li><li>อ้างอิง Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>ค่าเริ่มต้นคือ H.264</b> ถ้าติดตั้งใหม่หรือล้างค่า Output Module ไว้ After Effects จะใช้ preset <span class="ui">H.264 – Match Render Settings – 15 Mbps</span> เป็นค่าเริ่มต้น</p></div>
<div class="demo" data-demo="ae-render"></div>

<h2 id="steps">ขั้นตอน render เป็น MP4</h2>
<ol class="steps">
<li><h3>เพิ่ม composition เข้าคิว</h3><p>เลือก composition แล้วไปที่ <span class="ui">File › Export › Add to Render Queue</span> (<kbd>Ctrl</kbd>+<kbd>M</kbd> / <kbd>Cmd</kbd>+<kbd>M</kbd>) Render Queue panel จะเปิดขึ้น</p></li>
<li><h3>เช็ก Render Settings</h3><p>ปกติใช้ <span class="ui">Best Settings</span> ดูช่อง Time Span ด้วยว่าจะ render ทั้ง composition หรือแค่ work area</p></li>
<li><h3>เลือก Output Module</h3><p>คลิกชื่อ Output Module แล้วเลือก Format เป็น H.264 จะมี preset 5, 15 และ 40 Mbps ให้เลือกตามความละเอียดและคุณภาพที่ต้องการ</p></li>
<li><h3>ตั้งชื่อและที่เก็บไฟล์</h3><p>คลิกชื่อไฟล์ที่ช่อง <span class="ui">Output To</span> แล้วเลือกโฟลเดอร์</p></li>
<li><h3>กด Render</h3><p>กดปุ่ม Render ด้านขวาของ Render Queue panel รอจนแถบเสร็จ แล้วเปิดดูไฟล์ที่ได้</p></li>
</ol>

<h2 id="formats">เลือก format ตามการใช้งาน</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>ต้องการ</th><th>Format</th><th>Channels</th></tr></thead>
<tbody>
<tr><td>ไฟล์สำหรับเว็บหรือโซเชียล</td><td>H.264</td><td>RGB</td></tr>
<tr><td>วิดีโอพื้นหลังใสไปวางทับใน Premiere</td><td>QuickTime, codec Apple ProRes 4444</td><td>RGB + Alpha</td></tr>
<tr><td>ภาพนิ่งเรียงเฟรม</td><td>PNG Sequence</td><td>RGB หรือ RGB + Alpha</td></tr>
<tr><td>ไฟล์ master คุณภาพสูง</td><td>QuickTime, codec Apple ProRes 422 HQ</td><td>RGB</td></tr>
</tbody></table></div>
<p class="note">ตั้งค่าเริ่มต้นของ Output Module เองได้ที่ <span class="ui">Edit › Templates › Output Module</span></p>

<h2 id="ame">ส่งให้ Media Encoder หรือ Premiere</h2>
<ul class="check">
<li><span><b>Adobe Media Encoder</b> เลือก <span class="ui">File › Export › Add to Adobe Media Encoder Queue</span> เหมาะเมื่อต้องการหลายไฟล์หลายสเปก และอยากทำงานใน After Effects ต่อระหว่าง render</span></li>
<li><span><b>Dynamic Link ไป Premiere</b> import composition เข้า Premiere ได้เลยโดยไม่ต้อง render แก้ใน After Effects แล้ว Premiere อัปเดตตาม ต้องใช้<span class="nw">เวอร์ชัน</span>เดียวกัน</span></li>
</ul>

<h2 id="mistakes">ข้อผิดพลาดที่มือใหม่เจอบ่อย</h2>
<ul class="mist">
<li><b>ได้ไฟล์สั้นกว่าที่คิด</b>Time Span ใน Render Settings ตั้งเป็น work area อยู่ เปลี่ยนเป็นความยาวทั้ง composition หรือขยาย work area</li>
<li><b>MP4 พื้นหลังเป็นสีดำ</b>H.264 เก็บความโปร่งใสไม่ได้ ใช้ QuickTime ProRes 4444 และตั้ง Channels เป็น RGB + Alpha</li>
<li><b>ไม่รู้ว่าไฟล์ไปอยู่ไหน</b>ดูช่อง Output To ก่อนกด Render ทุกครั้ง</li>
<li><b>render ช้ามาก</b>ปิด layer ที่ไม่ใช้ และเช็กว่าเปิด Multi-Frame Rendering ไว้ใน Preferences</li>
</ul>

<h2 id="older">ถ้าใช้<span class="nw">เวอร์ชัน</span>เก่ากว่า 27.0</h2>
<details class="old"><summary>After Effects 25.x–26.x</summary><ul>
<li>Render Queue และ H.264 ในตัวใช้แบบเดียวกัน</li>
<li>27.0 เพิ่มแถบปรับระดับการบีบอัดของ PNG (ยังไม่สูญเสียคุณภาพ) และปรับปรุง Auto-Save ให้กู้งานได้ง่ายขึ้น</li></ul></details>

<template id="t-en-first-video">
<p class="crumb">Start here</p>
<h1>Your first video, start to finish</h1>
<p class="lead">This page walks you through one short video in Premiere, from preparing files to a finished MP4. Follow the steps in order; each links to a page with the details. One full pass gives you a feel for the whole app.</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>Running Premiere in Korean or Simplified Chinese?</b> This site uses the English menu names. To change the app's language, open the Creative Cloud desktop app › Preferences and set Default install language (under Apps or Language, depending on the version). Then uninstall and reinstall Premiere for the change to apply.</p></div>
<div class="demo" data-demo="first-video"></div>

<h2 id="before">Before you start</h2>
<ul class="check">
<li><span>3–10 clips from a phone or camera, and one song you have the rights to use</span></li>
<li><span>Enough free disk space; Premiere creates cache and preview files as you work</span></li>
<li><span>Decide where it is going first: landscape for YouTube or vertical for Shorts / Reels, because that sets the sequence size</span></li>
</ul>

<h2 id="steps">8 steps</h2>
<ol class="steps">
<li><h3>Set up folders and import</h3><p>Make a folder such as <code>MyVlog</code> with <code>Footage</code> and <code>Music</code> inside it. Create the new project in that folder, then drag your files into the Project panel. Don't move or rename files after importing.</p><p class="note"><a href="#en-project-media">Managing files and projects →</a></p></li>
<li><h3>Create a sequence</h3><p>Drag your main clip onto the <span class="ui">New Item</span> icon. For a vertical video, create a 1080×1920 sequence yourself.</p><p class="note"><a href="#en-sequence">Sequences and Sequence Settings →</a></p></li>
<li><h3>Pick your takes</h3><p>Double-click a clip to open it in the Source Monitor, press <kbd>I</kbd> and <kbd>O</kbd> around the best part, then press <kbd>,</kbd> to Insert it into the timeline. Work through the clips in story order.</p><p class="note"><a href="#en-monitors">Source Monitor vs Program Monitor →</a></p></li>
<li><h3>Edit in the timeline</h3><p>Put the music on an audio track, mark the beats with <kbd>M</kbd>, cut clips to the beat with the Razor, and close gaps with Ripple Delete. Play the whole thing often.</p><p class="note"><a href="#en-timeline">Editing in the Timeline →</a> · <a href="#en-markers">Markers →</a></p></li>
<li><h3>Add titles and graphics</h3><p>Open <span class="ui">Window › Graphics Templates</span>, drag a title template onto track V2, and edit the text in the Properties panel.</p><p class="note"><a href="#en-mogrt">MOGRT →</a> · <a href="#en-effects-keyframes">Effects and keyframes →</a></p></li>
<li><h3>Grade the colour</h3><p>Click the <span class="ui">Color</span> tab, press Auto Color clip by clip, then adjust Contrast, Exposure and Temperature so every shot matches.</p><p class="note"><a href="#en-color-mode">Color grading with Color Mode →</a></p></li>
<li><h3>Add captions</h3><p>If there is speech, transcribe it with Speech to Text, create captions, then check spelling and line length.</p><p class="note"><a href="#en-captions">Korean and Simplified Chinese captions →</a></p></li>
<li><h3>Export</h3><p>Click the <span class="ui">Export</span> tab, choose Format <span class="ui">H.264</span> and Preset <span class="ui">Match Source – Adaptive High Bitrate</span>, check frame size and frame rate, then click Export.</p><p class="note"><a href="#en-presets-resolution">Common presets and resolutions →</a></p></li>
</ol>

<h2 id="habits">Habits that keep projects safe</h2>
<ul class="check">
<li><span><b>Press <kbd>Ctrl</kbd>+<kbd>S</kbd> / <kbd>Cmd</kbd>+<kbd>S</kbd> often</b> and keep Auto Save on.</span></li>
<li><span><b>Lock the edit before polishing.</b> Grade, add effects and caption after the clip order settles, so you don't redo work.</span></li>
<li><span><b>Watch it where it will be seen.</b> Send a vertical video to your phone before posting it.</span></li>
<li><span><b>Panels in a mess?</b> Choose <span class="ui">Window › Workspaces › Reset to Saved Layout</span> to put them back.</span></li>
</ul>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>Importing from Downloads or the desktop, then deleting the files</b>The clips go Media Offline. Move files into the project folder before importing.</li>
<li><b>The sequence is the wrong orientation</b>You find out at export that you needed vertical. Get it right at step 2.</li>
<li><b>Grading or captioning before the edit is done</b>Every later cut means redoing that work.</li>
<li><b>Using music without the rights</b>The video may be muted or claimed on the platform. Choose music you can use from the start.</li>
</ul>

<h2 id="older">Using a version older than 27.0</h2>
<details class="old"><summary>Premiere 25.x–26.x</summary><ul>
<li>Every step is the same except grading, where older versions use the Lumetri Color panel instead of Color Mode.</li></ul></details>

<template id="t-en-project-media">
<p class="crumb">Start here</p>
<h1>Managing files and projects without Media Offline</h1>
<p class="lead">A Premiere project file (.prproj) doesn't contain your video. It only remembers where each file lives and what it is called. Move or rename a file and the clip turns into a red Media Offline frame. Understanding that one fact prevents most problems.</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>The one rule to remember:</b> keep your media in the same folder as the project file, or in a subfolder of it, and don't rename files or folders after importing.</p></div>
<div class="demo" data-demo="project-media"></div>

<h2 id="folders">A folder structure that works</h2>
<pre class="note" style="background:var(--soft);padding:12px 14px;border-radius:10px;font:500 14px/1.6 'IBM Plex Mono',monospace;overflow-x:auto">MyVlog/
  MyVlog.prproj
  Footage/
  Audio/
  Graphics/
  Exports/</pre>
<ul class="check">
<li><span>One job, one folder. Everything the job uses lives inside it, and you always move the whole folder.</span></li>
<li><span>If you use an external drive, keep it connected while you work.</span></li>
<li><span>For teams on Windows with network storage, map a drive letter and use the same letter on every computer.</span></li>
</ul>

<h2 id="relink">How Premiere finds moved files</h2>
<ol class="steps">
<li><h3>It checks old locations first</h3><p>A standard project remembers up to three locations per file (the current path plus two earlier ones). Move a file back and Premiere finds it.</p></li>
<li><h3>It searches automatically, twice</h3><p>The first pass searches the folder containing the project file and all its subfolders. The second goes up one level and searches the whole parent folder, including neighbouring folders.</p></li>
<li><h3>If it still can't find them, Link Media opens</h3><p>Point it at the files yourself, or right-click an offline clip in the Project panel and choose <span class="ui">Link Media</span> at any time.</p>
<p class="note">For files whose extension changed, such as proxies or transcodes, untick File Extension under Match File Properties before searching.</p></li>
</ol>
<p>You always have to relink by hand when files or folders were renamed, the folder structure was reorganised, or a drive isn't connected.</p>

<h2 id="move">Moving or handing over a project</h2>
<ol class="steps">
<li><h3>Use Project Manager</h3><p>Choose <span class="ui">File › Project Manager</span>, pick the sequences to take, and choose <span class="ui">Collect Files and Copy to New Location</span>. Premiere copies only the files actually used, together with the project file.</p></li>
<li><h3>Don't forget the Masks folder</h3><p>If you used Object Mask, send the <code>&lt;Project Name&gt; Masks</code> folder that sits next to the project file as well.</p></li>
<li><h3>Fonts and templates</h3><p>The other computer needs the fonts used in titles and MOGRTs, or the text switches to a different font.</p></li>
</ol>

<h2 id="autosave">Auto Save and recovering work</h2>
<p>Set it under <span class="ui">Edit › Preferences › Auto Save</span> (Mac: <span class="ui">Premiere › Settings › Auto Save</span>): how often to save and how many versions to keep. Backups go in an Auto-Save folder next to the project file. If Premiere quits unexpectedly or the project file is damaged, open the latest file in that folder.</p>

<h2 id="cache">What the media cache is, and whether you can delete it</h2>
<p>When you import, Premiere creates helper files such as conformed audio and index files and keeps them in the media cache, which it shares with Media Encoder and After Effects. They can be deleted; the apps rebuild them when needed.</p>
<ul class="check">
<li><span>Settings are in <span class="ui">Edit › Preferences › Media Cache</span> (Mac: <span class="ui">Premiere › Settings › Media Cache</span>). You can move the cache to a fast drive with plenty of space.</span></li>
<li><span>Have old cache files deleted automatically when the cache grows past a set size, so the disk doesn't fill up unnoticed.</span></li>
<li><span>If sound or picture plays back strangely, clearing the cache and reopening the project often helps.</span></li>
</ul>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>Importing straight from a memory card</b>The clips go offline the moment you remove the card. Copy the files to the computer first.</li>
<li><b>Reorganising folders mid-project</b>Files moved outside the project folder can't be found. Finish organising before you start.</li>
<li><b>Deleting footage you think you don't need</b>Use Project Manager to separate what is used first, then delete.</li>
<li><b>The drive fills up with cache</b>Set a maximum cache size and turn on automatic deletion of old files.</li>
</ul>

<h2 id="older">Using a version older than 27.0</h2>
<details class="old"><summary>Premiere 25.x–26.x</summary><ul>
<li>Link Media, Project Manager, Auto Save and Media Cache are in the same places.</li>
<li>Team Projects remember unlimited earlier file locations, unlike standard projects, which remember three.</li></ul></details>

<h2 id="sources">Sources</h2>
<ul class="src">
<li><a href="https://helpx.adobe.com/premiere/desktop/organize-media/file-organization/relink-offline-media-automatically.html">Relink media in Premiere</a></li>
<li><a href="https://helpx.adobe.com/ro/premiere-pro/how-to/relink-offline-media.html">Relink offline media</a></li>
<li><a href="https://helpx.adobe.com/premiere/desktop/add-video-effects/work-with-masks/object-masking.html">Object masking in Premiere (mask data storage)</a></li>
<li><a href="https://helpx.adobe.com/dk/media-encoder/desktop/encoding-and-exporting/media-cache-database.html">Managing the media cache database</a></li>
</ul>
</template>
<template id="t-en-premiere-vs-ae">
<p class="crumb">Start here</p>
<h1>Premiere vs After Effects</h1>
<p class="lead">Premiere is for <b>editing</b>: arranging long footage into a story, with sound, captions and colour. After Effects is for <b>motion graphics and visual effects</b>: detailed work on short shots. Most projects start in Premiere and send a few shots to After Effects.</p>
<ul class="meta"><li class="ver">Premiere &amp; After Effects 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>Rule of thumb:</b> minutes of footage with many clips belongs in Premiere. A few seconds where everything has to move just right belongs in After Effects.</p></div>
<div class="demo" data-demo="premiere-vs-ae"></div>

<h2 id="compare">Side by side</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Topic</th><th>Premiere</th><th>After Effects</th></tr></thead>
<tbody>
<tr><td>Main job</td><td>Editing, story, audio, captions, colour</td><td>Motion graphics, compositing, visual effects</td></tr>
<tr><td>Unit of work</td><td>Sequence</td><td>Composition</td></tr>
<tr><td>Timeline</td><td>A track holds many clips in a row</td><td>Each layer has exactly one source</td></tr>
<tr><td>Typical length</td><td>Minutes to hours</td><td>Seconds to a few minutes</td></tr>
<tr><td>Project file</td><td><code>.prproj</code></td><td><code>.aep</code></td></tr>
<tr><td>Output</td><td>Export mode or Media Encoder</td><td>Render Queue or Media Encoder</td></tr>
</tbody></table></div>

<h2 id="together">Using both together</h2>
<ol class="steps">
<li><h3>Dynamic Link: send a clip to After Effects</h3><p>In Premiere, right-click a clip in the timeline and choose <span class="ui">Replace With After Effects Composition</span>. After Effects opens with a new composition containing that clip. Changes you make there show up in Premiere without rendering.</p>
<p class="note">Premiere and After Effects must be the same version, or Dynamic Link won't work.</p></li>
<li><h3>Create an empty composition from Premiere</h3><p>Choose <span class="ui">File › Adobe Dynamic Link › New After Effects Composition</span>. The new comp matches the Premiere project's frame size and frame rate and is 30 seconds long by default.</p></li>
<li><h3>MOGRT: design once, reuse across the team</h3><p>Design a graphic in After Effects and export it as a <code>.mogrt</code>. Editors use it in Premiere and change only the fields you exposed, such as names and colours. See <a href="#en-mogrt">MOGRT</a>.</p></li>
<li><h3>Media Encoder: let it export for you</h3><p>Both apps can queue jobs in Adobe Media Encoder, so you can keep working while files export.</p></li>
</ol>

<h2 id="which">Which app for which job</h2>
<ul class="check">
<li><span><b>Vlogs, interviews, event videos</b> start and finish in Premiere, using ready-made MOGRTs for name straps.</span></li>
<li><span><b>Logo intros, film titles, animated infographics</b> build them in After Effects and render or Dynamic Link them in.</span></li>
<li><span><b>Removing objects, tracking signs, replacing skies</b> detailed compositing happens in After Effects. For simple cases, try <a href="#en-object-mask">Object Mask</a> in Premiere first.</span></li>
<li><span><b>Captions, sound, grading the whole film</b> do these in Premiere, where you see the whole story in order.</span></li>
</ul>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>Editing a whole film in After Effects</b>It isn't built for arranging long footage, so previews get slow and changes get painful. Cut in Premiere and send only effects shots over.</li>
<li><b>Building complex animation with Premiere keyframes</b>It works up to a point, but when many elements move together After Effects' Graph Editor and text animators give far more control.</li>
<li><b>Dynamic Link not showing up</b>Check that both apps are the same version, for example 27.0 in both.</li>
<li><b>Rendering an MP4 from After Effects to overlay in Premiere</b>MP4 (H.264) can't store transparency. Use Dynamic Link, or render ProRes 4444 with RGB + Alpha.</li>
</ul>

<h2 id="older">Using a version older than 27.0</h2>
<details class="old"><summary>Premiere Pro 25.x and Premiere 26.x</summary><ul>
<li>Before 26.0 the app was called Adobe Premiere Pro. Its role and how it works with After Effects are the same.</li>
<li>Dynamic Link and MOGRTs work the same way; the two apps' versions still need to match.</li></ul></details>

<h2 id="sources">Sources</h2>
<ul class="src">
<li><a href="https://helpx.adobe.com/after-effects/using/dynamic-link-effects.html">Dynamic Link and After Effects</a></li>
<li><a href="https://helpx.adobe.com/ca/after-effects/desktop/work-with-layers/create-layers/creating-layers.html">Creating layers (After Effects)</a></li>
</ul>
</template>
<template id="t-en-system-requirements">
<p class="crumb">Start here</p>
<h1>System requirements and install</h1>
<p class="lead">Before installing Premiere or After Effects 27.0, check three things: your operating system, RAM and graphics card. Version 27.0 drops older Windows versions and Intel Macs.</p>
<ul class="meta"><li class="ver">Premiere &amp; After Effects 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>Windows 11 version 23H2 can't install 27.0.</b> Update to 24H2 or later first. On Mac you need Apple silicon (M1 or newer) and macOS 15 or later.</p></div>
<div class="demo" data-demo="system-requirements"></div>

<h2 id="specs">Requirements at a glance</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Item</th><th>Premiere 27.0</th><th>After Effects 27.0</th></tr></thead>
<tbody>
<tr><td>Windows</td><td>Windows 11 v24H2 or later</td><td>Windows 11 v24H2 or later</td></tr>
<tr><td>Mac</td><td>Apple silicon (M1 or newer), macOS 15 or later</td><td>Apple silicon (M1 or newer), macOS 15 or later</td></tr>
<tr><td>RAM</td><td>8 GB minimum; 16 GB recommended for HD, 32 GB or more for 4K</td><td>16 GB minimum; 32 GB or more recommended for 4K</td></tr>
<tr><td>GPU (Windows)</td><td>At least 4 GB VRAM; NVIDIA cards must be Maxwell (2014) or newer; 8 GB recommended</td><td>At least 4 GB VRAM</td></tr>
<tr><td>Display</td><td>1920×1080 or higher</td><td>1920×1080 or higher</td></tr>
<tr><td>Storage</td><td>About 8 GB to install, plus a fast SSD for media and cache</td><td>Space to install plus disk cache on an SSD</td></tr>
</tbody></table></div>
<p class="note">Summarised from Adobe's technical requirements pages on the update date. Supported CPU models and other details are on the original pages.</p>

<h2 id="steps">Installing</h2>
<ol class="steps">
<li><h3>Check your OS version</h3><p>Windows: <span class="ui">Settings › System › About</span> and look at Version; it must be 24H2 or later. Mac: Apple menu › <span class="ui">About This Mac</span> to see the chip and macOS version.</p></li>
<li><h3>Check your GPU memory (Windows)</h3><p>Open Task Manager › <span class="ui">Performance</span> › GPU and read Dedicated GPU memory. Below 4 GB, Premiere may not open or may be unusable.</p></li>
<li><h3>Install the Creative Cloud desktop app</h3><p>Download it from Adobe and sign in with your Adobe ID. You need an internet connection to activate.</p></li>
<li><h3>Set the language before installing</h3><p>In the Creative Cloud desktop app, open Preferences › <span class="ui">Apps</span> and choose a <span class="ui">Default install language</span>. Both apps offer 한국어 and 简体中文.</p>
<p class="note">The setting applies to apps you install afterwards. To change the language of an app that's already installed, uninstall and reinstall it.</p></li>
<li><h3>Install Premiere and After Effects at the same version</h3><p>Click Install for both in the Apps list. Dynamic Link needs matching versions.</p></li>
</ol>

<h2 id="buy">If you're buying a computer</h2>
<ul class="check">
<li><span><b>32 GB RAM</b> if you plan to work in 4K or use After Effects regularly.</span></li>
<li><span><b>A dedicated GPU with 8 GB+ VRAM</b> on Windows, for GPU effects and AI features.</span></li>
<li><span><b>Two SSDs</b>: one for the system and apps, one for media and cache.</span></li>
<li><span><b>Apple silicon on Mac</b>, with enough unified memory from the start, because you can't add more later.</span></li>
</ul>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>Can't update on Windows 11 23H2</b>27.0 blocks installation on 23H2. Update Windows to 24H2 or later.</li>
<li><b>27.0 doesn't appear on an Intel Mac</b>27.0 supports only Apple silicon. Intel Macs stay on 26.x.</li>
<li><b>The app installed in the wrong language</b>Change Default install language, then uninstall and reinstall.</li>
<li><b>Footage on a slow external hard drive</b>Playback can stutter even on a fast computer. Move media to an SSD.</li>
</ul>

<h2 id="older">Using a version older than 27.0</h2>
<details class="old"><summary>Versions 26.x and 25.x</summary><ul>
<li>26.x also needs Windows 11 v24H2, and still supports Intel Macs.</li>
<li>25.x still supports Windows 10 v22H2.</li>
<li>Adobe says that from 28.0, installation will be blocked on all Windows 10-based systems, including Windows Server 2022.</li></ul></details>

<h2 id="sources">Sources</h2>
<ul class="src">
<li><a href="https://helpx.adobe.com/premiere-pro/system-requirements.html">Adobe Premiere technical requirements</a></li>
<li><a href="https://helpx.adobe.com/after-effects/system-requirements.html">After Effects system requirements</a></li>
<li><a href="https://community.adobe.com/announcements-727/important-notice-upcoming-system-requirement-changes-in-v27-0-1639157">Important Notice: Upcoming System Requirement Changes in v27.0</a></li>
<li><a href="https://helpx.adobe.com/creative-cloud/help/change-install-language.html">Change language for Creative Cloud apps</a></li>
</ul>
</template>
<template id="t-en-workspace-tour">
<p class="crumb">Start here</p>
<h1>Tour of the workspace</h1>
<p class="lead">Premiere's screen is split into panels, each with its own job. The header bar at the top switches between modes. If a panel disappears or the layout gets messy, you can always reset it.</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>Layout in a mess?</b> Choose <span class="ui">Window › Workspaces › Reset to Saved Layout</span>, or double-click the workspace name in the header bar, and the panels go back where they were.</p></div>
<div class="demo" data-demo="workspace-tour"></div>

<h2 id="header">The header bar and modes</h2>
<p>Premiere opens on the Home screen. Choose New Project and it opens in <b>Import</b> mode. Once a project is created or opened you're in <b>Edit</b> mode, and when you're ready to deliver you go to <b>Export</b> mode. Version 27.0 adds a <b>Color</b> mode for grading.</p>
<p>On the right of the header bar are the project name, the Workspaces menu, the Quick Export button and the button that maximises video output.</p>

<h2 id="panels">Panels you'll use most</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Panel</th><th>What it's for</th><th>Shortcut</th></tr></thead>
<tbody>
<tr><td>Project</td><td>Holds imported files and sequences, organised into bins</td><td><kbd>Shift</kbd>+<kbd>1</kbd></td></tr>
<tr><td>Source Monitor</td><td>Watch raw clips and set In/Out</td><td><kbd>Shift</kbd>+<kbd>2</kbd></td></tr>
<tr><td>Timeline</td><td>Where editing happens: clips on tracks</td><td><kbd>Shift</kbd>+<kbd>3</kbd></td></tr>
<tr><td>Program Monitor</td><td>Shows the sequence</td><td><kbd>Shift</kbd>+<kbd>4</kbd></td></tr>
<tr><td>Effect Controls</td><td>Effect values and keyframes for the selected clip</td><td><kbd>Shift</kbd>+<kbd>5</kbd></td></tr>
<tr><td>Effects</td><td>Every effect and transition</td><td><kbd>Shift</kbd>+<kbd>7</kbd></td></tr>
<tr><td>Properties</td><td>Common settings for the selected clip in one place, such as size, position and volume</td><td>Window menu</td></tr>
<tr><td>Essential Sound</td><td>Audio types, loudness, ducking</td><td>Window menu</td></tr>
</tbody></table></div>
<p class="note">Press <kbd>`</kbd> (left of the 1 key) to maximise the selected panel; press it again to restore.</p>

<h2 id="steps">Make the screen work for you</h2>
<ol class="steps">
<li><h3>Pick a workspace for the job</h3><p>Open the Workspaces menu at the top right. Ready-made layouts such as Editing, Audio and Captions and Graphics arrange panels for that kind of work.</p></li>
<li><h3>Drag panels to new places</h3><p>Drag a panel's tab to the edge of another panel; a highlighted area shows where it will land.</p></li>
<li><h3>Save your own layout</h3><p>When you're happy, choose <span class="ui">Window › Workspaces › Save as New Workspace</span> and give it a name.</p></li>
<li><h3>Find a missing panel</h3><p>Every panel can be opened from the <span class="ui">Window</span> menu, so if you close one by accident, reopen it there.</p></li>
</ol>

<h2 id="ae">How After Effects differs</h2>
<p>After Effects has similar panels with different names: the <b>Composition</b> panel instead of the Program Monitor, a <b>Timeline</b> of stacked layers instead of tracks, and <b>Effects &amp; Presets</b> and <b>Properties</b> on the right. See <a href="#en-ae-comp-layers">Compositions and layers</a>.</p>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>Opening someone's project changes your screen</b>With <span class="ui">Import Workspace From Projects</span> on, Premiere uses the layout saved in the project. Turn it off under Window › Workspaces.</li>
<li><b>Reset doesn't go back to the default</b>Reset to Saved Layout returns to the last saved version of that workspace. If you saved over it, switch to another workspace you haven't changed.</li>
<li><b>Panels too small to read</b>Press <kbd>`</kbd> to maximise temporarily, or drag the dividers between panels.</li>
</ul>

<h2 id="older">Using a version older than 27.0</h2>
<details class="old"><summary>Premiere 25.x–26.x</summary><ul>
<li>The header bar has only Import, Edit and Export; there's no Color mode.</li>
<li>Grading uses the Lumetri Color panel in the Color workspace.</li></ul></details>

<template id="t-en-sequence">
<p class="crumb">Premiere › Basics</p>
<h1>What a sequence is, and which settings to use</h1>
<p class="lead">A sequence is the timeline for one piece of work. It holds your clips, audio and effects, and it sets the frame size and frame rate of the whole edit. Match it to where the video is going from the start, and nothing stretches, stutters or fights you at export.</p>
<ul class="meta"><li class="ver">Premiere 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>Not sure what to choose?</b> Drag your main clip onto the <span class="ui">New Item</span> icon at the bottom of the Project panel. Premiere creates a sequence whose frame size and frame rate match that clip.</p></div>
<div class="demo" data-demo="sequence"></div>

<h2 id="what">What a sequence is</h2>
<ul class="check">
<li><span>One project can hold many sequences, for example a full landscape cut for YouTube and a short vertical cut for Reels, both using the same footage.</span></li>
<li><span>A sequence stores two things: <b>the edit</b> (clips on video and audio tracks, effects, graphics) and <b>its settings</b> (frame size, frame rate, audio format).</span></li>
<li><span>The Editing Mode setting does not decide your final file. You choose the output format when you export.</span></li>
</ul>

<h2 id="create">Three ways to create a sequence</h2>
<ol class="steps">
<li><h3>From a clip (easiest)</h3>
<p>Drag a clip from the Project panel onto the <span class="ui">New Item</span> icon, or right-click the clip and choose <span class="ui">New Sequence From Clip</span>.</p>
<p class="note">Best when the destination matches how the camera recorded, for example 1920×1080 at 25p going to landscape YouTube.</p></li>
<li><h3>From the menu, with your own settings</h3>
<p>Choose <span class="ui">File › New › Sequence</span> (<kbd>Ctrl</kbd>+<kbd>N</kbd> / <kbd>Cmd</kbd>+<kbd>N</kbd>). Pick the closest preset, or open the <span class="ui">Settings</span> tab, set Editing Mode to <span class="ui">Custom</span> and enter the values yourself.</p>
<p class="note">Click <span class="ui">Save Preset</span> and give it a clear name such as "Reels 1080x1920 25p" so you can pick it next time.</p></li>
<li><h3>Drop the first clip into an empty sequence</h3>
<p>If the clip doesn't match the sequence, Premiere asks whether to change the sequence to match the clip or keep the existing settings. If you already set the sequence for its destination (vertical, say), keep the existing settings.</p></li>
</ol>

<h2 id="settings">The settings that matter</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Setting</th><th>What it is</th><th>What a beginner should pick</th></tr></thead>
<tbody>
<tr><td>Timebase</td><td>The sequence's unit of time, in other words its frame rate</td><td>Match your camera. Typically 24 for a film look, 25 for PAL regions and 29.97 for NTSC regions.</td></tr>
<tr><td>Frame Size</td><td>Image size in pixels</td><td>Set it for the destination, such as 1920×1080 or 1080×1920. The maximum is 10,240×8,192.</td></tr>
<tr><td>Pixel Aspect Ratio</td><td>The shape of each pixel</td><td><span class="ui">Square Pixels (1.0)</span>. A mismatch stretches or squashes the picture.</td></tr>
<tr><td>Fields</td><td>Interlaced or progressive video</td><td><span class="ui">No Fields (Progressive Scan)</span> for today's cameras and phones.</td></tr>
<tr><td>Working color space / Auto Tone Map Media</td><td>Colour management for the sequence</td><td>Leave the defaults. Auto Tone Map Media makes it easier to mix Log, iPhone HLG and other HDR footage in one sequence.</td></tr>
<tr><td>Audio Sample Rate</td><td>Audio resolution</td><td>48000 Hz, the video standard.</td></tr>
<tr><td>Video Previews</td><td>The format used for preview renders inside Premiere</td><td>Leave the default (many presets use Apple ProRes 422 LT).</td></tr>
<tr><td>Maximum Bit Depth / Maximum Render Quality</td><td>Highest processing quality</td><td>Turn on only when needed; they cost RAM and render time.</td></tr>
</tbody></table></div>

<h2 id="jobs">Settings by type of job</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Job</th><th>Frame Size</th><th>Timebase</th><th>Why / what to know</th></tr></thead>
<tbody>
<tr><td>Landscape YouTube</td><td class="n">1920 × 1080<br>or 3840 × 2160</td><td>As recorded</td><td>YouTube recommends uploading at the frame rate you recorded, and 16:9 is its standard on computers.</td></tr>
<tr><td>Shorts / Reels / TikTok</td><td class="n">1080 × 1920</td><td>As recorded</td><td>If you shot landscape, <span class="ui">Sequence › Auto Reframe Sequence</span> crops to follow the subject.</td></tr>
<tr><td>Instagram feed</td><td class="n">1080 × 1350</td><td>As recorded</td><td>4:5 fills more of a phone screen than landscape. Check the platform's current specs before delivery.</td></tr>
<tr><td>Events and indoor shoots</td><td class="n">1920 × 1080</td><td>Match the local power</td><td>In 50 Hz countries such as Thailand and China, shoot and edit at 25 or 50. In 60 Hz countries such as Korea, use 29.97/30 or 59.94/60. This reduces flicker from indoor lighting.</td></tr>
<tr><td>TV delivery</td><td class="n">1920 × 1080</td><td>Per broadcaster spec</td><td>Thailand and China use 50 Hz systems (25/50); Korea uses a 60 Hz system (29.97/59.94). Always follow the broadcaster's delivery spec.</td></tr>
<tr><td>Short film / festivals</td><td class="n">1920 × 1080<br>or 4096 × 2160</td><td>24 or 23.976</td><td>4096×2160 is cinema (DCI) 4K. Check the festival's spec first.</td></tr>
</tbody></table></div>

<h2 id="change">Changing settings later</h2>
<p>Choose <span class="ui">Sequence › Sequence Settings</span>, or right-click the sequence in the Project panel and choose <span class="ui">Sequence Settings</span>. When you change the frame size, tick <span class="ui">Scale motion effects proportionally when changing frame size</span> so clip positions and sizes follow.</p>
<p>Don't shrink the frame size to fix choppy playback. Lower the playback resolution in the Program Monitor instead.</p>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>4K clips look zoomed in on a 1080 sequence</b>Right-click the clip in the timeline and choose <span class="ui">Set to Frame Size</span>. It fits the frame and you can still punch in sharply, because the source is bigger.</li>
<li><b>Sequence frame rate doesn't match the camera</b>You get stutter or repeated frames. Creating the sequence from your main clip avoids this.</li>
<li><b>Editing vertical clips in a landscape sequence</b>You get black bars. Make a separate vertical sequence.</li>
<li><b>Wrong Fields or Pixel Aspect Ratio</b>Combing lines or a stretched picture. Use No Fields and Square Pixels for ordinary footage.</li>
</ul>

<h2 id="older">Using a version older than 27.0</h2>
<details class="old"><summary>Premiere 25.x–26.x</summary><ul>
<li>Almost everything here applies; the main menus haven't changed.</li>
<li>Colour management options such as Auto Tone Map Media may be missing or in a different place in older versions.</li>
<li>Intel-based Macs stop at 26.x, because Premiere 27.0 dropped Intel Mac support.</li></ul></details>

<h2 id="sources">Sources</h2>
<ul class="src">
<li><a href="https://helpx.adobe.com/premiere/desktop/edit-projects/change-clip-sequence/sequence-settings-reference.html">Sequence settings reference</a></li>
<li><a href="https://helpx.adobe.com/premiere/desktop/edit-projects/change-clip-sequence/create-a-sequence.html">Create a sequence</a></li>
<li><a href="https://helpx.adobe.com/premiere-pro/using/change-sequence-settings.html">Change sequence settings</a></li>
<li><a href="https://support.google.com/youtube/answer/1722171">YouTube recommended upload encoding settings</a></li>
</ul>
