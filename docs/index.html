<template id="t-en-ae-comp-layers">
<p class="crumb">After Effects</p>
<h1>Compositions and layers</h1>
<p class="lead">In After Effects a piece of work is a <b>composition</b>, with its own frame size, frame rate and duration. Inside it are <b>layers</b> stacked like sheets of acetate: higher layers cover what's below.</p>
<ul class="meta"><li class="ver">After Effects 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>The big difference from Premiere:</b> a Premiere track holds many clips in a row, but an After Effects layer has only one source. That's why a single piece often has dozens of layers.</p></div>
<div class="demo" data-demo="ae-comp-layers"></div>

<h2 id="comp">Creating a composition</h2>
<ol class="steps">
<li><h3>From footage (easiest)</h3><p>Drag a video from the Project panel onto the New Composition icon at the bottom of the panel. The comp takes that file's size and frame rate.</p></li>
<li><h3>Or set it up yourself</h3><p>Choose <span class="ui">Composition › New Composition</span> (<kbd>Ctrl</kbd>+<kbd>N</kbd> / <kbd>Cmd</kbd>+<kbd>N</kbd>), pick a Preset or type Width, Height, Frame Rate and Duration.</p></li>
<li><h3>Change it later</h3><p><span class="ui">Composition › Composition Settings</span> (<kbd>Ctrl</kbd>+<kbd>K</kbd> / <kbd>Cmd</kbd>+<kbd>K</kbd>) lets you change duration or size at any time.</p></li>
</ol>

<h2 id="types">Kinds of layer</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Layer</th><th>What it is</th><th>Create it with</th></tr></thead>
<tbody>
<tr><td>Footage</td><td>Imported video, stills or audio</td><td>Drag from the Project panel</td></tr>
<tr><td>Text</td><td>Editable, animatable type</td><td><span class="ui">Layer › New › Text</span></td></tr>
<tr><td>Shape</td><td>Vector shapes that stay sharp at any size</td><td>Shape tools or the Pen tool</td></tr>
<tr><td>Solid</td><td>A flat colour, for backgrounds or effects</td><td><kbd>Ctrl</kbd>+<kbd>Y</kbd> / <kbd>Cmd</kbd>+<kbd>Y</kbd></td></tr>
<tr><td>Adjustment</td><td>Its effects apply to every layer below</td><td><span class="ui">Layer › New › Adjustment Layer</span></td></tr>
<tr><td>Null Object</td><td>An invisible layer that drives other layers' motion</td><td><span class="ui">Layer › New › Null Object</span></td></tr>
<tr><td>Precomp</td><td>A composition used as a layer in another</td><td><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd> / <kbd>Cmd</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd></td></tr>
</tbody></table></div>

<h2 id="transform">Transform: five properties every layer has</h2>
<p>Press a letter to reveal that property on the selected layer: <kbd>A</kbd> Anchor Point · <kbd>P</kbd> Position · <kbd>S</kbd> Scale · <kbd>R</kbd> Rotation · <kbd>T</kbd> Opacity. Hold <kbd>Shift</kbd> and press another to show several at once.</p>

<h2 id="preview">Previewing</h2>
<ul class="check">
<li><span><b>Press Spacebar to preview.</b> The green bar on the timeline shows what's cached and will play smoothly.</span></li>
<li><span><b>Lower the Composition panel's Resolution.</b> Half or Quarter makes previews faster while you work. It doesn't change the comp's frame size.</span></li>
<li><span><b>Set a work area.</b> Press <kbd>B</kbd> and <kbd>N</kbd> to set the start and end of the range you preview.</span></li>
</ul>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>You added something but can't see it</b>It's probably under an opaque layer. Drag it higher in the Timeline.</li>
<li><b>Mixing up Resolution and frame size</b>Resolution in the Composition panel is preview quality; the real size is in Composition Settings.</li>
<li><b>The comp is shorter than you need</b>Change Duration in Composition Settings rather than dragging the end of a layer.</li>
<li><b>Editing the wrong comp</b>Check the tab name above the Timeline before you change anything, especially with nested precomps.</li>
</ul>

<h2 id="older">Using a version older than 27.0</h2>
<details class="old"><summary>After Effects 25.x–26.x</summary><ul>
<li>Creating compositions and layers works the same way.</li>
<li>The Adobe Stock panel and AI Assistant arrived in 27.0.</li></ul></details>

<h2 id="sources">Sources</h2>
<ul class="src">
<li><a href="https://helpx.adobe.com/ca/after-effects/desktop/work-with-layers/create-layers/creating-layers.html">Creating layers</a></li>
<li><a href="https://helpx.adobe.com/after-effects/release-note.html">After Effects release notes</a></li>
</ul>
</template>
<template id="t-en-ae-keyframes">
<p class="crumb">After Effects</p>
<h1>Keyframes in After Effects</h1>
<p class="lead">A keyframe says "at this time, this property has this value", and After Effects fills in everything between. What makes motion look professional is the <b>timing</b> between keyframes, which you control with Easy Ease and the Graph Editor.</p>
<ul class="meta"><li class="ver">After Effects 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>Select keyframes and press <kbd>F9</kbd>.</b> Motion then eases out and slows down before it stops, instead of shooting off and halting dead. Compare the two in the demo.</p></div>
<div class="demo" data-demo="ae-keyframes"></div>

<h2 id="steps">Your first keyframes</h2>
<ol class="steps">
<li><h3>Reveal the property</h3><p>Select a layer and press <kbd>P</kbd> for Position (or <kbd>S</kbd> Scale, <kbd>R</kbd> Rotation, <kbd>T</kbd> Opacity).</p></li>
<li><h3>Click the stopwatch</h3><p>Move the playhead to the start and click the stopwatch next to the property name. That's your first keyframe.</p>
<p class="note">Shortcut to add a Position keyframe: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> (Windows) or <kbd>Option</kbd>+<kbd>P</kbd> (Mac).</p></li>
<li><h3>Move in time and change the value</h3><p>Move the playhead forward, then drag the layer in the Composition panel or type a new value. After Effects adds the second keyframe for you.</p></li>
<li><h3>Add Easy Ease</h3><p>Drag-select both keyframes and press <kbd>F9</kbd>. The keyframe icons change from diamonds to hourglass shapes.</p></li>
<li><h3>Refine in the Graph Editor</h3><p>Press <kbd>Shift</kbd>+<kbd>F3</kbd> to open the Graph Editor. Drag a keyframe's handle further out to increase its influence, making the ease stronger.</p></li>
</ol>

<h2 id="graphs">Value graph vs speed graph</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Graph</th><th>Shows</th><th>Use it when</th></tr></thead>
<tbody>
<tr><td>Value Graph</td><td>The property's actual value over time (X red, Y green)</td><td>You want to see where a value goes, or build an overshoot</td></tr>
<tr><td>Speed Graph</td><td>How fast the value changes</td><td>You want to shape speed, such as a hard start</td></tr>
</tbody></table></div>
<p>In the Composition panel, the motion path shows one dot per frame. Dots far apart mean fast; dots close together mean slow.</p>

<h2 id="types">Interpolation types</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Type</th><th>Result</th></tr></thead>
<tbody>
<tr><td>Linear</td><td>Constant speed with abrupt changes at keyframes; looks stiff</td></tr>
<tr><td>Bezier / Easy Ease</td><td>Smooth acceleration and deceleration; Easy Ease uses 33.33% influence by default</td></tr>
<tr><td>Auto Bezier</td><td>The default for motion paths, giving smooth curves</td></tr>
<tr><td>Hold</td><td>Keeps the value until the next keyframe, then jumps; good for snappy changes</td></tr>
</tbody></table></div>
<p class="note">Change it by right-clicking a keyframe › <span class="ui">Keyframe Interpolation</span>.</p>

<h2 id="keys">Handy shortcuts</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Key</th><th>What it does</th></tr></thead>
<tbody>
<tr><td><kbd>J</kbd> / <kbd>K</kbd></td><td>Previous / next keyframe (or marker)</td></tr>
<tr><td><kbd>U</kbd></td><td>Show only keyframed properties</td></tr>
<tr><td><kbd>F9</kbd></td><td>Easy Ease</td></tr>
<tr><td><kbd>Shift</kbd>+<kbd>F9</kbd></td><td>Easy Ease In</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>F9</kbd> / <kbd>Cmd</kbd>+<kbd>Shift</kbd>+<kbd>F9</kbd></td><td>Easy Ease Out</td></tr>
<tr><td><kbd>Shift</kbd>+<kbd>F3</kbd></td><td>Toggle the Graph Editor</td></tr>
<tr><td><kbd>Alt</kbd>+<kbd>←</kbd>/<kbd>→</kbd> / <kbd>Option</kbd>+<kbd>←</kbd>/<kbd>→</kbd></td><td>Nudge selected keyframes by one frame</td></tr>
</tbody></table></div>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>Changing a value changes the whole layer</b>The stopwatch isn't on, so there are no keyframes. Turn it on first, then change values.</li>
<li><b>Motion too fast or too slow</b>Drag keyframes further apart to slow down, or closer together to speed up.</li>
<li><b>Easy Ease feels sluggish</b>Lower the influence in the Graph Editor, or use Ease Out on the first keyframe and Ease In on the last only.</li>
<li><b>Dragging handles in the Graph Editor does nothing useful</b>Check whether you're in the Speed Graph or Value Graph; handles behave differently in each.</li>
</ul>

<h2 id="older">Using a version older than 27.0</h2>
<details class="old"><summary>After Effects 25.x–26.x</summary><ul>
<li>Keyframes, Easy Ease and the Graph Editor work the same in every version.</li>
<li>The Effect Controls panel was redesigned in 26.5, so it may look different in earlier versions.</li></ul></details>

<h2 id="sources">Sources</h2>
<ul class="src">
<li><a href="https://helpx.adobe.com/en/after-effects/using/keyframe-interpolation.html">Keyframe interpolation</a></li>
<li><a href="https://helpx.adobe.com/after-effects/using/speed.html">Speed</a></li>
</ul>
</template>
<template id="t-en-ae-text">
<p class="crumb">After Effects</p>
<h1>Animating text</h1>
<p class="lead">Text in After Effects can move as a whole layer, or character by character, word by word or line by line using <b>text animators</b>. The fastest way in is to apply an animation preset and then look at how it's built.</p>
<ul class="meta"><li class="ver">After Effects 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>Reverse-engineer a preset:</b> apply an animation preset to a text layer, then press <kbd>U</kbd> or <kbd>UU</kbd> to see only the properties it animates or changes.</p></div>
<div class="demo" data-demo="ae-text"></div>

<h2 id="create">Create a text layer</h2>
<ol class="steps">
<li><h3>Choose the Type tool</h3><p>Press <kbd>Ctrl</kbd>+<kbd>T</kbd> / <kbd>Cmd</kbd>+<kbd>T</kbd>. Click once in the Composition panel for single-line point text, or drag a box for paragraph text.</p></li>
<li><h3>Set font and size</h3><p>Use the Character panel or the Properties panel. For Korean or Chinese, choose a font that contains those characters, or you'll see empty boxes.</p></li>
</ol>

<h2 id="preset">Method 1: an animation preset</h2>
<ol class="steps">
<li><h3>Open the Effects &amp; Presets panel</h3><p>Go to <span class="ui">Animation Presets › Text</span> for categories such as Animate In, Animate Out and Blurs.</p></li>
<li><h3>Drag a preset onto the text layer</h3><p>It starts at the playhead. Press Spacebar to see it.</p>
<p class="note">To preview presets before applying them, choose <span class="ui">Browse Presets</span> from the Effects &amp; Presets panel menu to open them in Adobe Bridge.</p></li>
</ol>

<h2 id="animator">Method 2: build it with a text animator</h2>
<ol class="steps">
<li><h3>Add an animator</h3><p>Expand the text layer in the Timeline, click <span class="ui">Animate</span> and choose a property such as Opacity or Position, or use <span class="ui">Animation › Animate Text</span>.</p></li>
<li><h3>Set the characters' "target" value</h3><p>For example, set Opacity to 0%. Characters inside the Range Selector get this value.</p></li>
<li><h3>Animate the Range Selector</h3><p>Expand <span class="ui">Range Selector 1</span>, turn on the stopwatch for <span class="ui">Start</span> at 0%, move forward in time and set Start to 100%. The characters appear one by one.</p></li>
<li><h3>Choose the unit under Advanced</h3><p>In Range Selector › Advanced › <span class="ui">Based On</span>, choose whether it counts characters, words or lines.</p></li>
</ol>

<h2 id="ideas">Ideas to try</h2>
<ul class="check">
<li><span><b>Typewriter</b>: Opacity 0%, then animate Start from 0 to 100%.</span></li>
<li><span><b>Rise in letter by letter</b>: Position Y +30 and Opacity 0% in the same animator.</span></li>
<li><span><b>Jitter</b>: add a Wiggly Selector instead of a Range Selector.</span></li>
<li><span><b>Changing weight</b>: use a variable font and add an animator for its Weight axis.</span></li>
</ul>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>Animating the whole layer instead of each character</b>A layer's Transform moves the whole block. For per-character motion you need an animator.</li>
<li><b>Mixing up Start and End</b>Characters between Start and End are the ones that get the animator's values. Watch the range bars in the Composition panel.</li>
<li><b>Korean or Chinese shows as boxes</b>The font lacks those characters. Switch to a font that supports the language.</li>
<li><b>Text motion looks choppy</b>Turn on motion blur for the text layer.</li>
</ul>

<h2 id="older">Using a version older than 27.0</h2>
<details class="old"><summary>After Effects 25.x–26.x</summary><ul>
<li>Text animators and the Range Selector work the same way.</li>
<li>Animating variable font axes arrived in 26.0.</li>
<li>Editable text from Illustrator files arrived in 27.0.</li></ul></details>

<h2 id="sources">Sources</h2>
<ul class="src">
<li><a href="https://helpx.adobe.com/after-effects/using/animating-text.html">Animating text</a></li>
<li><a href="https://helpx.adobe.com/after-effects/using/examples-resources-text-animation.html">Examples and resources for text animation</a></li>
<li><a href="https://helpx.adobe.com/after-effects/using/working-with-variable-font-axes.html">Working with Variable Font Axes</a></li>
</ul>
</template>
<template id="t-en-ae-render">
<p class="crumb">After Effects</p>
<h1>Rendering and export</h1>
<p class="lead">After Effects turns compositions into files through the <b>Render Queue</b>. For an MP4, H.264 is built in. For transparent video or many files at once, there are routes for those too.</p>
<ul class="meta"><li class="ver">After Effects 27.0</li><li>Updated 27 Nov 2026</li><li>Beginner</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>H.264 is the default.</b> On a fresh install, or after clearing Output Module preferences, After Effects uses <span class="ui">H.264 – Match Render Settings – 15 Mbps</span> as the default output module.</p></div>
<div class="demo" data-demo="ae-render"></div>

<h2 id="steps">Rendering an MP4</h2>
<ol class="steps">
<li><h3>Add the comp to the queue</h3><p>Select the composition and choose <span class="ui">File › Export › Add to Render Queue</span> (<kbd>Ctrl</kbd>+<kbd>M</kbd> / <kbd>Cmd</kbd>+<kbd>M</kbd>). The Render Queue panel opens.</p></li>
<li><h3>Check Render Settings</h3><p><span class="ui">Best Settings</span> is the usual choice. Also check Time Span: the whole composition, or only the work area?</p></li>
<li><h3>Choose an Output Module</h3><p>Click the Output Module name and set Format to H.264. There are 5, 15 and 40 Mbps presets depending on resolution and the quality you want.</p></li>
<li><h3>Name the file and pick a folder</h3><p>Click the file name next to <span class="ui">Output To</span> and choose where it goes.</p></li>
<li><h3>Click Render</h3><p>Click Render on the right of the Render Queue panel, wait for the bar to finish, then open the file.</p></li>
</ol>

<h2 id="formats">Pick a format for the job</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>You need</th><th>Format</th><th>Channels</th></tr></thead>
<tbody>
<tr><td>A file for the web or social</td><td>H.264</td><td>RGB</td></tr>
<tr><td>Transparent video to overlay in Premiere</td><td>QuickTime, Apple ProRes 4444 codec</td><td>RGB + Alpha</td></tr>
<tr><td>An image sequence</td><td>PNG Sequence</td><td>RGB or RGB + Alpha</td></tr>
<tr><td>A high-quality master</td><td>QuickTime, Apple ProRes 422 HQ codec</td><td>RGB</td></tr>
</tbody></table></div>
<p class="note">Set your own default output modules under <span class="ui">Edit › Templates › Output Module</span>.</p>

<h2 id="ame">Hand off to Media Encoder or Premiere</h2>
<ul class="check">
<li><span><b>Adobe Media Encoder</b>: choose <span class="ui">File › Export › Add to Adobe Media Encoder Queue</span>. Good for several files and specs, and you can keep working in After Effects while it renders.</span></li>
<li><span><b>Dynamic Link to Premiere</b>: import the composition into Premiere without rendering. Changes in After Effects update in Premiere. Versions must match.</span></li>
</ul>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>The file is shorter than expected</b>Time Span in Render Settings is set to the work area. Change it to the composition length or widen the work area.</li>
<li><b>MP4 has a black background</b>H.264 can't store transparency. Use QuickTime ProRes 4444 with Channels set to RGB + Alpha.</li>
<li><b>Can't find the file</b>Check Output To every time before you click Render.</li>
<li><b>Rendering is very slow</b>Turn off layers you don't need and make sure Multi-Frame Rendering is on in Preferences.</li>
</ul>

<h2 id="older">Using a version older than 27.0</h2>
<details class="old"><summary>After Effects 25.x–26.x</summary><ul>
<li>The Render Queue and built-in H.264 work the same way.</li>
<li>27.0 adds a PNG compression slider (still lossless) and better Auto-Save recovery.</li></ul></details>

<template id="t-en-whats-new">
<p class="crumb">Reference</p>
<h1>What's new in 27.0</h1>
<p class="lead">Premiere and After Effects 27.0 shipped in November 2026, the big release of the year. The changes beginners will notice most are Color Mode replacing the Lumetri Color panel, the AI Assistant, and higher minimum system requirements.</p>
<ul class="meta"><li class="ver">Premiere &amp; After Effects 27.0</li><li>Updated 27 Nov 2026</li><li>All levels</li><li>Based on Adobe Help Center</li></ul>
<div class="call" role="note"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--acc)" stroke-width="2"/><path d="M11 10v6" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="6.5" r="1.2" fill="var(--acc)"/></svg>
<p><b>Before you update:</b> 27.0 needs Windows 11 v24H2 or later, or an Apple silicon Mac with macOS 15 or later. See <a href="#en-system-requirements">System requirements and install</a>.</p></div>
<div class="demo" data-demo="whats-new"></div>

<h2 id="premiere">Premiere 27.0</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Feature</th><th>What it is</th></tr></thead>
<tbody>
<tr><td>Color Mode</td><td>A new grading mode in the header bar that replaces the Lumetri Color panel. See <a href="#en-color-mode">Color grading with Color Mode</a>.</td></tr>
<tr><td>AI Assistant</td><td>A panel where you type requests or ask how to do things; some actions use Firefly generative credits</td></tr>
<tr><td>Generated audio</td><td>Generate music, sound effects and soundscapes onto the timeline</td></tr>
<tr><td>Generative Extend for transitions</td><td>Fills in frames when a clip is too short for a transition</td></tr>
<tr><td>Eight new effects</td><td>Including Bevel Alpha, Bevel &amp; Emboss, Posterize, Radial Blur and Zoom Blur</td></tr>
<tr><td>Usability</td><td>Waveforms while recording, animated thumbnails in the Effects panel, a card layout in the Properties panel, and a Live Ripple Edit preference</td></tr>
<tr><td>Performance</td><td>AI features run faster on NVIDIA RTX GPUs</td></tr>
</tbody></table></div>

<h2 id="ae">After Effects 27.0</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Feature</th><th>What it is</th></tr></thead>
<tbody>
<tr><td>AI Assistant</td><td>Ask how to do things or give instructions in plain text</td></tr>
<tr><td>Better Auto-Save recovery</td><td>Easier to open auto-saved work after a crash</td></tr>
<tr><td>Adobe Stock panel</td><td>Search and use Adobe Stock media inside the app</td></tr>
<tr><td>Editable Illustrator text</td><td>Text from Illustrator files stays editable type in After Effects</td></tr>
<tr><td>New effects</td><td>Including Contour Paint and De-esser</td></tr>
<tr><td>PNG</td><td>A compression slider for PNG renders</td></tr>
</tbody></table></div>

<h2 id="year">The 2026 timeline</h2>
<ul class="check">
<li><span><b>26.0 (Jan)</b> Premiere Pro renamed Adobe Premiere; Object Mask and built-in Adobe Stock · After Effects can animate variable fonts</span></li>
<li><span><b>26.2 (Apr)</b> Premiere adds Content Credentials at export and a Color Mode public beta in the beta app · After Effects gets Object Matte</span></li>
<li><span><b>26.3 (Jun)</b> Premiere adds 90+ modern effects, transitions and animations · After Effects gets Depth of Field in Advanced 3D</span></li>
<li><span><b>26.5 (Sep)</b> Premiere gets the Generative Media Tool · After Effects redesigns Effect Controls and supports ACES 2.0</span></li>
<li><span><b>27.0 (Nov)</b> The major release in the tables above</span></li>
</ul>

<h2 id="update">Should you update now?</h2>
<ul class="mist">
<li><b>You're close to a deadline</b>Finish in your current version. A project opened and saved in the new version won't open in the old one.</li>
<li><b>You work in a team</b>Agree to update together, and update Premiere and After Effects as a pair so Dynamic Link keeps working.</li>
<li><b>You rely on plug-ins</b>Check that the developer supports 27.0.</li>
</ul>

<h2 id="custom">See and change shortcuts in the app</h2>
<ol class="steps">
<li><h3>Premiere</h3><p>Windows: <span class="ui">Edit › Keyboard Shortcuts</span> · Mac: <span class="ui">Premiere › Keyboard Shortcuts</span>. A keyboard map highlights keys that have commands, and you can search commands by name.</p></li>
<li><h3>After Effects</h3><p>Choose <span class="ui">Edit › Keyboard Shortcuts</span> to search and reassign keys the same way.</p></li>
<li><h3>Save your own set</h3><p>If you change shortcuts, save them as a new set rather than overwriting the default, so it's easy to go back.</p></li>
</ol>

<h2 id="mistakes">Common beginner mistakes</h2>
<ul class="mist">
<li><b>The shortcut types a letter instead</b>A text field still has focus. Click in the timeline first, then press the key again.</li>
<li><b>A correct shortcut does nothing</b>Many shortcuts only work when their panel is active. Look for the blue outline to see which panel has focus.</li>
<li><b>Shortcuts from a tutorial don't match</b>The video may use an older version or a customised set. Check the Keyboard Shortcuts window on your own machine.</li>
</ul>

<h2 id="pairs">Pairs beginners often mix up</h2>
<div class="tbl"><table class="stack">
<thead><tr><th>Pair</th><th>The difference</th></tr></thead>
<tbody>
<tr><td>Sequence / Composition</td><td>The unit of work in Premiere / in After Effects</td></tr>
<tr><td>Render / Export</td><td>Rendering processes frames for smooth playback or output; exporting makes the final file (After Effects uses "render" for both)</td></tr>
<tr><td>Codec / Container</td><td>How it's compressed, such as H.264 / the file wrapper, such as .mp4</td></tr>
<tr><td>Frame size / Resolution in After Effects</td><td>The comp's real size / preview quality in the Composition panel</td></tr>
<tr><td>Ripple / Rolling edit</td><td>Change length and push later clips / move the cut between two clips, keeping total length</td></tr>
<tr><td>Insert / Overwrite</td><td>Place and push existing material / place over it</td></tr>
<tr><td>Clip marker / Sequence marker</td><td>Travels with the clip / stays on the sequence's time</td></tr>
</tbody></table></div>

D['ae-keyframes']=(root,L)=>{
 const T={th:{h:'ลอง Easy Ease และ Graph Editor: ดูกราฟค่ากับกราฟความเร็ว',lin:'Linear',ease:'Easy Ease (F9)',val:'Value Graph',spd:'Speed Graph',inf:'Influence',play:'เล่น',t:'เวลา',cap:'เดโมจำลองหลักการ ค่า Influence 33.33% คือค่าที่ Easy Ease ใช้เป็นค่าเริ่มต้น'},

 let ease=false,graph='val',inf=33.33,t=0,raf=0;const DUR=2;
 const bez=(p,a)=>{const x1=a/100,x2=1-a/100;let lo=0,hi=1;for(let i=0;i<30;i++){const m=(lo+hi)/2;const x=3*(1-m)**2*m*x1+3*(1-m)*m*m*x2+m**3;if(x<p)lo=m;else hi=m}const s=(lo+hi)/2;return 3*(1-s)**2*s*0+3*(1-s)*s*s*1+s**3};
 const f=p=>ease?bez(p,inf):p;
 root.className='stage';
 root.innerHTML=`<h3>${T.h}</h3><div class="two"><div class="col"><div class="mon"><svg viewBox="0 0 640 360" aria-hidden="true"><rect width="640" height="360" fill="#151517"/><line x1="80" y1="180" x2="560" y2="180" stroke="#3a3a3f" stroke-dasharray="6 6"/><circle class="dot" cy="180" r="28" fill="#ff7a45"/></svg></div><div class="graph"><svg viewBox="0 0 300 110" preserveAspectRatio="none" aria-hidden="true"></svg></div></div>
 <div class="col"><div class="seg ez"><button type="button" data-e="0">${T.lin}</button><button type="button" data-e="1">${T.ease}</button></div><div class="seg gr"><button type="button" data-g="val">${T.val}</button><button type="button" data-g="spd">${T.spd}</button></div>

 const draw=()=>{const p=f(t/DUR);$('.dot',root).setAttribute('cx',80+p*480);
  let d='';const N=80;for(let i=0;i<=N;i++){const q=i/N;let y;if(graph==='val')y=f(q);else{const h=0.002;y=(f(Math.min(1,q+h))-f(Math.max(0,q-h)))/(Math.min(1,q+h)-Math.max(0,q-h))/2.2}d+=(i?'L':'M')+(q*300).toFixed(1)+' '+(104-Math.min(1,y)*96).toFixed(1)}
  $('.graph svg',root).innerHTML=`<path d="${d}" fill="none" stroke="#ff7a45" stroke-width="2.5" vector-effect="non-scaling-stroke"/><line x1="${t/DUR*300}" x2="${t/DUR*300}" y1="0" y2="110" stroke="#fff" stroke-opacity=".5" vector-effect="non-scaling-stroke"/>`;
  $('.iv',root).textContent=ease?inf.toFixed(2)+'%':'—';$('.is',root).disabled=!ease;$('.tv',root).textContent=t.toFixed(2)+' s';$('.ts',root).value=t;
  $$('.ez button',root).forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.e==='1')===ease)));$$('.gr button',root).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.g===graph)))};
 $('.ez',root).addEventListener('click',e=>{const b=e.target.closest('button');if(b){ease=b.dataset.e==='1';draw()}});
 $('.gr',root).addEventListener('click',e=>{const b=e.target.closest('button');if(b){graph=b.dataset.g;draw()}});
 $('.is',root).oninput=e=>{inf=+e.target.value;draw()};$('.ts',root).oninput=e=>{cancelAnimationFrame(raf);t=+e.target.value;draw()};
 $('.pl',root).onclick=()=>{cancelAnimationFrame(raf);if(reduce){t=DUR;draw();return}const t0=performance.now();const st=n=>{if(!root.isConnected)return;t=Math.min(DUR,(n-t0)/1000);draw();if(t<DUR)raf=requestAnimationFrame(st)};raf=requestAnimationFrame(st)};
 draw();capAfter(root,T.cap);
};

/* ---------- shell ---------- */
const art=$('article'),side=$('.side'),toc=$('.toc'),q=$('#q'),navd=$('#navd');
let curKey='';
const renderNav=(lang,id)=>{const u=UI[lang];
 side.setAttribute('aria-label',u.navlabel);
 side.innerHTML=NAV.map(g=>`<p class="grp">${esc(g.g[lang])}</p><ul>${g.items.map(i=>i.id?`<li><a href="#${lang}-${i.id}"${i.id===id?' aria-current="page"':''}>${esc(i[lang])}</a></li>`:`<li><span>${esc(i[lang])}</span></li>`).join('')}</ul>`).join('')+`<p class="hint none" hidden>${u.none}</p>`;
 $('.brand b').textContent=u.brand;$('.brand small').textContent=u.tag;q.placeholder=u.search;$('#ql').textContent=u.search;$('summary',navd).textContent=u.menu;
 $$('.lang a').forEach(a=>{a.href=`#${a.dataset.l}-${id}`;if(a.dataset.l===lang)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current')});
 q.value='';};
const route=()=>{
 const m=/^(th|en)-([a-z-]+)$/.exec(location.hash.slice(1));
 const lang=m?m[1]:'th',id=m&&PAGES.includes(m[2])?m[2]:PAGES[0],key=lang+'-'+id;
 if(key===curKey)return;
 const tpl=document.getElementById('t-'+key);if(!tpl)return;
 curKey=key;document.documentElement.lang=lang;
 art.replaceChildren(tpl.content.cloneNode(true));
 const u=UI[lang],i=PAGES.indexOf(id),P=ORDER[i-1],N=ORDER[i+1];
 const hs=$$('h2[id]',art);
 const links=hs.map(h=>`<a href="#${h.id}">${esc(h.textContent)}</a>`).join('');
 toc.innerHTML=`<p>${u.onpage}</p>${links}`;
 const op=document.createElement('nav');op.className='onpage';op.setAttribute('aria-label',u.onpage);op.innerHTML=links;
 const anchor=$('.demo',art)||$('h2',art);anchor.before(op);
 const pn=document.createElement('div');pn.className='pn';
 pn.innerHTML=(P?`<a href="#${lang}-${P.id}">${u.prev}<b>${esc(P[lang])}</b></a>`:'<span></span>')+(N?`<a href="#${lang}-${N.id}">${u.next}<b>${esc(N[lang])}</b></a>`:'<span></span>');
 const ft=document.createElement('footer');ft.innerHTML=u.foot.map(t=>`<p>${esc(t)}</p>`).join('');
 art.append(pn,ft);
 document.title=($('h1',art)?.textContent||'')+' · '+u.brand;
 renderNav(lang,id);
 $$('.demo[data-demo]',art).forEach(el=>{try{D[el.dataset.demo]?.(el,lang)}catch(err){console.error(err)}});
 if(!wide.matches)navd.open=false;
 window.scrollTo(0,0);
};
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const h=a.getAttribute('href').slice(1);if(/^(th|en)-/.test(h))return;const t=document.getElementById(h);if(t){e.preventDefault();t.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})}});
q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();let n=0;
 $$('.side li').forEach(li=>{const ok=!s||li.textContent.toLowerCase().includes(s);li.hidden=!ok;if(ok)n++});
 $$('.side .grp').forEach(g=>{g.hidden=![...g.nextElementSibling.children].some(li=>!li.hidden)});
 $('.side .none').hidden=n>0;if(s)navd.open=true;});
const wide=matchMedia('(min-width:900px)');
const syncNav=()=>{navd.open=wide.matches};syncNav();wide.addEventListener('change',syncNav);
addEventListener('hashchange',route);
route();
}
